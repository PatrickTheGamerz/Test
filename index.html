<!DOCTYPE html>
<html>
<head>
    <title>ORANGEBIRD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body oncontextmenu="return false;">

    <div id="cursor"></div>

    <div id="game-box">
        <div id="score-gui" style="position:absolute; width:100%; text-align:center; top:50px; font-size:70px; font-weight:900; color:white; text-shadow:4px 4px 0 #000; z-index:10;">0</div>

        <div id="scr-menu" class="ui-screen">
            <h1 style="color:white; font-size:60px; margin:0; text-shadow:0 5px 15px rgba(0,0,0,0.5);">ORANGEBIRD</h1>
            <p style="color:white; font-weight:bold;">RESOURCES: <span id="pts-display">0</span> POINTS</p>
            <button class="btn" onclick="setMode('play')">START ENGINE</button>
            <button class="btn" onclick="setMode('hangar')">OPEN HANGAR</button>
            <button class="btn" onclick="setMode('ach')">VIEW MEDALS</button>
        </div>

        <div id="scr-hangar" class="ui-screen" style="display:none; background:transparent;">
            <div id="hangar-view">
                <svg id="hangar-links" style="position:absolute; width:100%; height:100%; pointer-events:none;"></svg>
            </div>
            <button class="btn" style="position:absolute; bottom:40px;" onclick="setMode('menu')">EXIT HANGAR</button>
            <div style="position:absolute; top:20px; color:white; background:rgba(0,0,0,0.5); padding:5px 15px; border-radius:20px;">Hold Mouse Button to Pan</div>
        </div>

        <div id="scr-ach" class="ui-screen" style="display:none;">
            <h2 style="color:white;">PILOT ACHIEVEMENTS</h2>
            <div id="ach-container" style="width:80%; height:400px; overflow-y:auto; background:rgba(255,255,255,0.1); border-radius:10px; padding:10px;"></div>
            <button class="btn" onclick="setMode('menu')">CLOSE</button>
        </div>

        <div id="toast">
            <div class="toast-icon"></div>
            <div class="toast-text"><b id="t-title">New Medal!</b><span id="t-desc">Description here.</span></div>
        </div>

        <div id="bird"></div>
        <div id="pipe-world"></div>
    </div>

    <script>
        const bird = document.getElementById('bird');
        const world = document.getElementById('pipe-world');
        const hangar = document.getElementById('hangar-view');
        const cursor = document.getElementById('cursor');

        // ENGINE DATA
        let mode = 'menu';
        let birdY = 300, velocity = 0, grav = 0.5, jump = -9;
        let pipesPassed = 0, points = parseInt(localStorage.getItem('ob_pts')) || 0;
        let pipes = [], frame = 0;
        let bought = JSON.parse(localStorage.getItem('ob_skills')) || [];
        
        // HANGAR PANNING
        let isDragging = false, lastX, lastY, panX = -1250, panY = -1125;

        // UPDATE CURSOR
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            if (isDragging && mode === 'hangar') {
                panX += e.clientX - lastX;
                panY += e.clientY - lastY;
                hangar.style.transform = `translate(${panX}px, ${panY}px)`;
                lastX = e.clientX; lastY = e.clientY;
            }
        });

        document.addEventListener('mousedown', e => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
        document.addEventListener('mouseup', () => isDragging = false);

        // UI SWITCHER
        function setMode(m) {
            mode = m;
            document.querySelectorAll('.ui-screen').forEach(s => s.style.display = 'none');
            const box = document.getElementById('game-box');
            
            if (m === 'menu') {
                document.getElementById('scr-menu').style.display = 'flex';
                box.style.background = 'var(--day)';
                document.getElementById('pts-display').innerText = points;
            } else if (m === 'play') {
                resetPlay();
            } else if (m === 'hangar') {
                document.getElementById('scr-hangar').style.display = 'flex';
                box.style.background = 'var(--midnight)';
                initHangar();
            } else if (m === 'ach') {
                document.getElementById('scr-ach').style.display = 'flex';
                box.style.background = 'var(--sunset)';
                renderAchievements();
            }
        }

        function resetPlay() {
            birdY = 300; velocity = 0; pipesPassed = 0; pipes = []; frame = 0;
            world.innerHTML = '';
            document.getElementById('score-gui').innerText = '0';
            requestAnimationFrame(gameLoop);
        }

        // STEAM NOTIFICATION
        function sendToast(title, desc) {
            const t = document.getElementById('toast');
            document.getElementById('t-title').innerText = title;
            document.getElementById('t-desc').innerText = desc;
            t.classList.add('pop');
            setTimeout(() => t.classList.remove('pop'), 5000);
        }

        // HANGAR DATA & SKILLS
        const skillTree = [
            { id: 'S1', name: 'Slim Wings', desc: 'Smaller Hitbox', cost: 1, x: 1450, y: 1450, pre: null },
            { id: 'S2', name: 'Anti-Grav', desc: 'Floaty Physics', cost: 3, x: 1600, y: 1300, pre: 'S1' },
            { id: 'S3', name: 'Turbo Fan', desc: 'Faster Points', cost: 10, x: 1750, y: 1450, pre: 'S2' }
        ];

        function initHangar() {
            const svg = document.getElementById('hangar-links');
            svg.innerHTML = '';
            document.querySelectorAll('.skill-node').forEach(n => n.remove());

            skillTree.forEach(s => {
                const node = document.createElement('div');
                const isOwned = bought.includes(s.id);
                const isReady = s.pre === null || bought.includes(s.pre);
                
                node.className = `skill-node ${isOwned ? 'node-owned' : (isReady ? 'node-ready' : '')}`;
                node.style.left = s.x + 'px'; node.style.top = s.y + 'px';
                node.innerHTML = `<b>${s.name}</b><br>${s.desc}<br>[${s.cost} PTS]`;
                
                node.onclick = () => {
                    if (isReady && !isOwned && points >= s.cost) {
                        points -= s.cost;
                        bought.push(s.id);
                        save();
                        initHangar();
                        sendToast("Research Complete", s.name + " is now active.");
                    }
                };
                hangar.appendChild(node);

                if (s.pre) {
                    const pre = skillTree.find(x => x.id === s.pre);
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", pre.x + 45); line.setAttribute("y1", pre.y + 45);
                    line.setAttribute("x2", s.x + 45); line.setAttribute("y2", s.y + 45);
                    line.setAttribute("class", `connector ${isOwned ? 'connector-on' : ''}`);
                    svg.appendChild(line);
                }
            });
        }

        function gameLoop() {
            if (mode !== 'play') return;
            frame++;
            velocity += grav; birdY += velocity;
            bird.style.top = birdY + 'px';
            bird.style.transform = `rotate(${Math.min(velocity * 4, 90)}deg)`;

            // Pipe Frequency
            if (frame % 160 === 0) spawnPipe();

            pipes.forEach((p, i) => {
                p.x -= 4;
                p.dt.style.left = p.x + 'px'; p.db.style.left = p.x + 'px';

                const b = bird.getBoundingClientRect();
                const pt = p.dt.getBoundingClientRect();
                const pb = p.db.getBoundingClientRect();

                // Hitbox detection
                const padding = bought.includes('S1') ? 12 : 6;
                if (b.right - padding > pt.left && b.left + padding < pt.right) {
                    if (b.top + padding < pt.bottom || b.bottom - padding > pb.top) setMode('menu');
                }

                if (p.x < 50 && !p.passed) {
                    p.passed = true;
                    pipesPassed++;
                    if (pipesPassed % 5 === 0) { points++; save(); }
                    document.getElementById('score-gui').innerText = Math.floor(pipesPassed / 5);
                }
            });

            if (birdY > 730 || birdY < -20) setMode('menu');
            requestAnimationFrame(gameLoop);
        }

        function spawnPipe() {
            const gap = 180;
            const topH = Math.random() * 300 + 100;
            const p = { x: 550, dt: document.createElement('div'), db: document.createElement('div'), passed: false };
            p.dt.className = 'pipe'; p.dt.style.height = topH + 'px'; p.dt.style.top = '0';
            p.db.className = 'pipe'; p.db.style.height = (750 - topH - gap) + 'px'; p.db.style.bottom = '0';
            world.appendChild(p.dt); world.appendChild(p.db);
            pipes.push(p);
        }

        function save() {
            localStorage.setItem('ob_pts', points);
            localStorage.setItem('ob_skills', JSON.stringify(bought));
        }

        // INPUTS
        const flap = () => { if(mode === 'play') velocity = jump; };
        window.addEventListener('keydown', e => { if(e.code === 'Space') flap(); });
        window.addEventListener('mousedown', e => { if(e.button === 0) flap(); });

    </script>
</body>
</html>
