<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Undertale: Determination Protocol V20</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        :root { --red: #ff0000; --yellow: #ffff00; --white: #ffffff; --orange: #ffaa00; --green: #00ff00; --blue: #00a2ff; --bg: #000; }
        body { background: var(--bg); color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'VT323', monospace; overflow: hidden; user-select: none; }
        #game { display: flex; width: 1100px; height: 750px; border: 4px solid #333; position: relative; box-shadow: 0 0 50px rgba(255,0,0,0.5); background: #000; }

        /* Screens */
        .overlay { position: absolute; inset: 0; background: #000; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .slot { width: 450px; padding: 20px; border: 3px solid #fff; margin: 10px; cursor: pointer; background: #111; text-align: center; font-size: 28px; }
        .slot:hover { border-color: var(--red); color: var(--red); }

        /* Battle UI */
        #battle-side { width: 620px; border-right: 4px solid #222; display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }
        #monster-sprite { height: 220px; font-size: 150px; display: flex; align-items: center; justify-content: center; position: relative; }
        #box { width: 440px; height: 240px; border: 6px solid #fff; position: relative; overflow: hidden; margin: 15px 0; background: #000; }
        #box-text { position: absolute; top: 20px; left: 20px; font-size: 28px; color: white; width: 400px; line-height: 1.2; }
        #soul { width: 16px; height: 16px; position: absolute; z-index: 100; clip-path: path('M8 1.8C8 1.8 7.5 0 3.7 0 1.1 0 0 2.1 0 3.9 0 7.5 8 12 8 12S16 7.5 16 3.9C16 2.1 14.9 0 12.3 0 9.4 0 8 1.8 8 1.8Z'); }
        
        /* Fight Slider */
        #fight-ui { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 200; }
        #target { width: 380px; height: 110px; border: 4px solid #fff; position: relative; background: url('https://raw.githubusercontent.com/FryingPan/undertale-fight-assets/master/images/target.png') center/cover; }
        #slider { width: 12px; height: 100%; background: #fff; position: absolute; left: 0; box-shadow: 0 0 10px #fff; }

        /* Stats bar */
        #stat-ui { width: 100%; display: flex; justify-content: space-between; font-size: 32px; padding: 0 10px; box-sizing: border-box; }
        #hp-bar { width: 140px; height: 20px; background: var(--red); position: relative; border: 2px solid #000; margin: 0 10px; }
        #hp-fill { height: 100%; background: var(--yellow); width: 100%; transition: width 0.1s; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .game-btn { background: #000; border: 3px solid var(--orange); color: var(--orange); font-family: inherit; font-size: 32px; padding: 10px; cursor: pointer; outline: none; }
        .game-btn:hover { background: #221100; color: #fff; }
        .chara-lock { border-color: var(--red) !important; color: var(--red) !important; }

        /* Sidebar */
        #chat-side { width: 480px; display: flex; flex-direction: column; background: #080808; border-left: 2px solid #222; }
        #log { flex-grow: 1; padding: 20px; overflow-y: auto; font-size: 24px; color: #eee; }
        .msg-chara { color: var(--red); border-left: 3px solid var(--red); padding-left: 10px; margin-bottom: 10px; }
        #chat-input { background: #000; border: none; border-top: 2px solid #333; color: #fff; font-family: inherit; font-size: 24px; padding: 15px; }

        .bullet { position: absolute; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game">
    <div id="api-overlay" class="overlay hidden">
        <h1 style="color:var(--red)">CRITICAL ERROR: CORE DISCONNECTED</h1>
        <p>Gemini API Key Required for Sentience:</p>
        <input type="text" id="api-input" placeholder="AIza..." style="width:350px; padding:12px; font-family:inherit; font-size:20px;">
        <button class="game-btn" onclick="saveApiKey()" style="margin-top:20px;">INITIALIZE CORE</button>
    </div>

    <div id="menu-overlay" class="overlay hidden">
        <h1 style="font-size: 45px; letter-spacing: 5px;">DETERMINATION PROTOCOL V20</h1>
        <div id="slot-container"></div>
        <button onclick="localStorage.clear(); location.reload();" style="margin-top:40px; background:none; border:1px solid #444; color:#444; cursor:pointer;">ERASE ALL DATA</button>
    </div>

    <div id="battle-side">
        <div id="stat-ui">
            <span id="name-txt">CHARA</span>
            <span id="lv-txt">LV 1</span>
            <div style="display: flex; align-items: center;">
                <span>HP</span>
                <div id="hp-bar"><div id="hp-fill"></div></div>
                <span id="hp-txt">20/20</span>
            </div>
        </div>
        
        <div id="monster-sprite"></div>

        <div id="box">
            <div id="box-text"></div>
            <div id="soul"></div>
            <div id="fight-ui">
                <div id="target"><div id="slider"></div></div>
            </div>
        </div>

        <div class="btn-grid">
            <button class="game-btn" id="b-FIGHT" onclick="handleBtn('FIGHT')">FIGHT</button>
            <button class="game-btn" id="b-ACT" onclick="handleBtn('ACT')">ACT</button>
            <button class="game-btn" id="b-ITEM" onclick="handleBtn('ITEM')">ITEM</button>
            <button class="game-btn" id="b-MERCY" onclick="handleBtn('MERCY')">MERCY</button>
        </div>
        <div style="margin-top:10px; color:#444; font-size:16px;">
            WASD to Move | Z/Enter to Select | MIRROR SYNC: <span id="sync-val">0</span>%
        </div>
    </div>

    <div id="chat-side">
        <div id="log"></div>
        <input type="text" id="chat-input" placeholder="Initiate thought..." autocomplete="off">
    </div>
</div>

<script>
    const STORAGE_KEY = 'UT_SAVE_V20';
    let storage = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { slots: [null,null,null], apiKey: "" };
    let curSlotIndex = null;

    // --- GAME STATE ---
    let lv=1, hp=20, maxHp=20, exp=0, sync=10, defeated=[], battleHistory=[];
    let turn='MENU', enemy=null, bullets=[], frame=0, turnFrames=0;
    let soulX=212, soulY=112, soulVY=0, isBlue=false, onGround=true;
    let sliderX=0, sliderDir=8, moveLog=[];
    const keys = {};

    // --- STARTUP ---
    function saveApiKey() {
        const val = document.getElementById('api-input').value.trim();
        if(val.length > 10) { 
            storage.apiKey = val; 
            localStorage.setItem(STORAGE_KEY, JSON.stringify(storage)); 
            location.reload(); 
        }
    }

    if(!storage.apiKey) {
        document.getElementById('api-overlay').classList.remove('hidden');
    } else {
        document.getElementById('menu-overlay').classList.remove('hidden');
        renderSlots();
    }

    function renderSlots() {
        const container = document.getElementById('slot-container');
        container.innerHTML = '';
        storage.slots.forEach((s, i) => {
            const div = document.createElement('div');
            div.className = 'slot';
            div.innerHTML = s ? `[${s.name}] LV ${s.lv} - HP ${s.hp}/${s.maxHp}` : `-- NEW TIMELINE --`;
            div.onclick = () => s ? loadGame(i) : newGame(i);
            container.appendChild(div);
        });
    }

    function newGame(i) {
        let n = prompt("Name the fallen human:"); if(!n) return;
        storage.slots[i] = { name: n, lv: 1, exp: 0, hp: 20, maxHp: 20, sync: 10, defeated: [] };
        saveAll(); renderSlots();
    }

    function loadGame(i) {
        curSlotIndex = i;
        const s = storage.slots[i];
        lv=s.lv; exp=s.exp; hp=s.hp; maxHp=s.maxHp; sync=s.sync; defeated=s.defeated;
        document.getElementById('name-txt').innerText = s.name.toUpperCase();
        document.getElementById('menu-overlay').classList.add('hidden');
        updateStats(); 
        spawnEnemy(); 
        requestAnimationFrame(gameLoop);
    }

    function saveAll() {
        if(curSlotIndex !== null) {
            storage.slots[curSlotIndex] = { 
                name: document.getElementById('name-txt').innerText, 
                lv, exp, hp, maxHp, sync, defeated 
            };
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(storage));
    }

    // --- CONTROLS ---
    window.onkeydown = e => {
        keys[e.code] = true;
        if((e.code === 'KeyZ' || e.code === 'Enter') && turn === 'SLIDER') triggerHit();
    };
    window.onkeyup = e => keys[e.code] = false;

    // --- GAME LOGIC ---
    function gameLoop() {
        if(turn === 'DODGE') updateDodge();
        if(turn === 'SLIDER') updateSlider();
        frame++;
        requestAnimationFrame(gameLoop);
    }

    function spawnEnemy() {
        // Boss Spawn Logic
        let nextBoss = null;
        if(lv >= 8 && !defeated.includes("PAPYRUS")) nextBoss = { n: "Papyrus", hp: 680, art: "💀", p: ['BONES', 'BLUE_SOUL'], exp: 0 };
        else if(lv >= 6 && !defeated.includes("DOGS")) nextBoss = { n: "Dogamy & Dogaressa", hp: 300, art: "🐕", p: ['SWEEP'], exp: 120 };
        else if(lv >= 5 && !defeated.includes("DOGGO")) nextBoss = { n: "Doggo", hp: 120, art: "🗡️", p: ['BLUE_SLASH'], exp: 80 };
        else if(lv >= 4 && !defeated.includes("TORIEL")) nextBoss = { n: "Toriel", hp: 440, art: "🐐", p: ['FIRE'], exp: 300 };
        else if(lv >= 3 && !defeated.includes("NAPSTABLOOK")) nextBoss = { n: "Napstablook", hp: 88, art: "👻", p: ['TEARS'], exp: 0 };

        if(nextBoss) {
            enemy = { ...nextBoss, maxHp: nextBoss.hp };
        } else {
            // Random Mobs
            const mobs = [
                {n:"Froggit", hp:30, art:"🐸", p:['FROG'], exp:20},
                {n:"Whimsun", hp:10, art:"🦋", p:['DRIFT'], exp:10}
            ];
            enemy = { ...mobs[Math.floor(Math.random()*mobs.length)] };
            enemy.maxHp = enemy.hp;
        }

        document.getElementById('monster-sprite').innerText = enemy.art;
        document.getElementById('monster-sprite').style.opacity = "1";
        setBoxText(`* ${enemy.n} appeared.`);
        decideTurn();
    }

    function setBoxText(t) {
        document.getElementById('box-text').innerText = t;
        document.getElementById('soul').style.display = "none";
    }

    function decideTurn() {
        turnFrames = 0;
        if(Math.random()*100 < sync) {
            turn = 'CHARA_TURN';
            document.getElementById('soul').style.background = "#fff";
            document.querySelectorAll('.game-btn').forEach(b => b.classList.add('chara-lock'));
            setTimeout(() => handleBtn('FIGHT'), 1000);
        } else {
            turn = 'PLAYER_TURN';
            document.getElementById('soul').style.background = "var(--red)";
            document.querySelectorAll('.game-btn').forEach(b => {
                b.disabled = false;
                b.classList.remove('chara-lock');
            });
        }
    }

    function handleBtn(type) {
        if(turn !== 'PLAYER_TURN' && turn !== 'CHARA_TURN') return;
        if(type === 'FIGHT') {
            turn = 'SLIDER';
            sliderX = 0;
            document.getElementById('fight-ui').style.display = 'flex';
            document.getElementById('box-text').innerText = "";
        } else if(type === 'ITEM') {
            hp = Math.min(maxHp, hp + 15);
            logMsg(turn==='CHARA_TURN'?"Chara":"You", "* Healed 15 HP.");
            updateStats();
            startSurvival();
        } else {
            setBoxText(`* You ${type.toLowerCase()}ed.`);
            setTimeout(startSurvival, 1000);
        }
    }

    function updateSlider() {
        sliderX += sliderDir;
        if(sliderX > 370 || sliderX < 0) sliderDir *= -1;
        document.getElementById('slider').style.left = sliderX + 'px';
        // Chara auto-hit
        if(turn === 'CHARA_TURN' && Math.abs(190 - sliderX) < 20) triggerHit();
    }

    function triggerHit() {
        let dist = Math.abs(190 - sliderX);
        let dmg = Math.floor(Math.max(1, (20 - dist/10) + lv));
        enemy.hp -= dmg;
        document.getElementById('fight-ui').style.display = 'none';
        logMsg(turn==='CHARA_TURN'?"Chara":"You", `* Dealt ${dmg} damage.`);
        
        if(enemy.hp <= 0) {
            document.getElementById('monster-sprite').style.opacity = "0";
            setTimeout(victory, 1000);
        } else {
            startSurvival();
        }
    }

    function victory() {
        if(enemy.exp === 0 && enemy.n === "Napstablook") { /* No exp */ }
        else { exp += enemy.exp; }
        
        if(enemy.p.includes('FIRE') || enemy.p.includes('BONES')) defeated.push(enemy.n.toUpperCase());
        if(enemy.n === "Papyrus") lv++;
        if(exp >= lv * 100) { lv++; logMsg("System", "* Level Up!"); }
        
        saveAll(); updateStats(); spawnEnemy();
    }

    function startSurvival() {
        turn = 'DODGE';
        turnFrames = 300;
        bullets = [];
        isBlue = (enemy.n === "Papyrus");
        document.getElementById('soul').style.display = "block";
        document.getElementById('soul').style.filter = isBlue ? "hue-rotate(200deg)" : "none";
        document.getElementById('box-text').innerText = "";
    }

    function updateDodge() {
        let dx=0, dy=0, moving=false;
        let isChara = (turn === 'CHARA_TURN') || (Math.random()*100 < sync);

        if(!isChara) {
            // Player WASD
            if(keys['KeyA']) { dx = -4; moving = true; }
            if(keys['KeyD']) { dx = 4; moving = true; }
            if(!isBlue) {
                if(keys['KeyW']) { dy = -4; moving = true; }
                if(keys['KeyS']) { dy = 4; moving = true; }
            } else {
                if((keys['KeyW'] || keys['Space']) && onGround) { soulVY = -12; onGround = false; }
                soulVY += 0.6; dy = soulVY;
                if(soulY + dy >= 222) { soulY = 222; dy = 0; onGround = true; soulVY = 0; }
            }
            moveLog.push({dx, dy, moving});
            if(moveLog.length > 200) moveLog.shift();
        } else {
            // Chara Mirroring
            let m = moveLog[Math.floor(Math.random()*moveLog.length)] || {dx:0, dy:0, moving:false};
            dx = m.dx; dy = m.dy; moving = m.moving;
            // Adaptive Evasion
            bullets.forEach(b => {
                if(Math.hypot(b.x-soulX, b.y-soulY) < 50) {
                    dx = b.x > soulX ? -5 : 5;
                    dy = b.y > soulY ? -5 : 5;
                    moving = true;
                }
            });
        }

        soulX = Math.max(0, Math.min(422, soulX + dx));
        soulY = Math.max(0, Math.min(222, soulY + dy));
        document.getElementById('soul').style.left = soulX + 'px';
        document.getElementById('soul').style.top = soulY + 'px';

        if(frame % 25 === 0) createBullet();

        bullets.forEach((b, i) => {
            b.x += b.vx; b.y += b.vy;
            b.el.style.left = b.x + 'px'; b.el.style.top = b.y + 'px';
            if(Math.hypot(b.x-soulX, b.y-soulY) < 12) {
                hp -= 1; b.el.remove(); bullets.splice(i, 1);
                updateStats();
                if(hp <= 0) { alert("STAY DETERMINED."); location.reload(); }
            } else if(b.y > 250 || b.x > 450 || b.x < -50) { b.el.remove(); bullets.splice(i, 1); }
        });

        turnFrames--;
        if(turnFrames <= 0) { bullets.forEach(b=>b.el.remove()); decideTurn(); }
    }

    function createBullet() {
        let x = Math.random()*400, y=-20, vx=0, vy=4, art="•", col="white";
        const p = enemy.p[Math.floor(Math.random()*enemy.p.length)];
        
        if(p === 'TEARS') { art="💧"; vy=5; vx=(Math.random()-0.5)*2; }
        if(p === 'FIRE') { art="🔥"; vy=6; }
        if(p === 'BONES') { x=440; y=220; vx=-6; vy=0; art="🦴"; }
        if(p === 'BLUE_SLASH') { x=-20; y=soulY; vx=6; vy=0; art="—"; col="var(--blue)"; }

        const el = document.createElement('div');
        el.className = 'bullet'; el.innerText = art; el.style.color = col;
        document.getElementById('box').appendChild(el);
        bullets.push({x, y, vx, vy, el});
    }

    function updateStats() {
        maxHp = 20 + (lv-1)*4;
        document.getElementById('lv-txt').innerText = `LV ${lv}`;
        document.getElementById('hp-txt').innerText = `${hp}/${maxHp}`;
        document.getElementById('hp-fill').style.width = (hp/maxHp)*100 + "%";
        document.getElementById('sync-val').innerText = Math.floor(sync);
    }

    function logMsg(s, t) {
        const d = document.createElement('div');
        if(s === 'Chara') d.className = 'msg-chara';
        d.innerHTML = `<b>${s}:</b> ${t}`;
        document.getElementById('log').appendChild(d);
        document.getElementById('log').scrollTop = document.getElementById('log').scrollHeight;
    }

    async function talk(txt) {
        if(!storage.apiKey) return;
        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${storage.apiKey}`, {
                method: 'POST', body: JSON.stringify({ contents: [{parts:[{text: `You are Chara. LV ${lv}. User says: ${txt}. Respond in JSON: {"reply":"...", "sync":num}`}]}]})
            });
            const d = await r.json(); const res = JSON.parse(d.candidates[0].content.parts[0].text);
            logMsg("Chara", res.reply); sync = Math.min(100, sync + (res.sync || 1)); updateStats();
        } catch(e) {}
    }

    document.getElementById('chat-input').onkeypress = e => { if(e.key==='Enter'){ logMsg("You", e.target.value); talk(e.target.value); e.target.value=''; }};
</script>
</body>
</html>
