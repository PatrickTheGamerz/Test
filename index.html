<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Undertale: Determination Protocol V16 - THE GREAT PAPYRUS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        :root { --red: #ff0000; --yellow: #ffff00; --white: #ffffff; --orange: #ffaa00; --green: #00ff00; --blue: #00a2ff; --bg: #000; }
        body { background: var(--bg); color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'VT323', monospace; overflow: hidden; }
        #game { display: flex; width: 1100px; height: 750px; border: 4px solid #333; position: relative; box-shadow: 0 0 50px rgba(255,0,0,0.5); }

        /* Screens */
        #api-overlay, #menu-overlay { position: absolute; inset: 0; background: #000; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .slot { width: 450px; padding: 15px; border: 3px solid #fff; margin: 10px; cursor: pointer; background: #111; text-align: center; }
        .slot:hover { border-color: var(--red); color: var(--red); }

        /* Battle */
        #battle-side { width: 620px; border-right: 4px solid #222; display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }
        #monster-sprite { height: 200px; font-size: 120px; display: flex; align-items: center; justify-content: center; position: relative; transition: all 0.3s; }
        #box { width: 440px; height: 260px; border: 6px solid #fff; position: relative; overflow: hidden; margin: 15px 0; background: #000; }
        #soul { width: 18px; height: 18px; position: absolute; z-index: 100; transition: transform 0.1s; clip-path: path('M9 2.1C9 2.1 8.4 0 4.2 0 1.2 0 0 2.4 0 4.4 0 8.4 9 13.5 9 13.5S18 8.4 18 4.4C18 2.4 16.8 0 13.8 0 10.6 0 9 2.1 9 2.1Z'); }
        .bullet { position: absolute; font-size: 20px; display: flex; align-items: center; justify-content: center; }

        /* Stats & UI */
        #stat-ui { width: 100%; display: flex; justify-content: space-between; font-size: 32px; }
        #hp-bar { width: 140px; height: 22px; background: var(--red); border: 2px solid #000; position: relative; }
        #hp-fill { height: 100%; background: var(--yellow); width: 100%; transition: width 0.2s; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .game-btn { background: #000; border: 3px solid var(--orange); color: var(--orange); font-family: inherit; font-size: 30px; padding: 10px; cursor: pointer; }
        .chara-lock { border-color: var(--red) !important; color: var(--red) !important; box-shadow: 0 0 10px var(--red); }

        /* Chat Side */
        #chat-side { width: 480px; display: flex; flex-direction: column; background: #050505; border-left: 2px solid #222; }
        #log { flex-grow: 1; padding: 25px; overflow-y: auto; font-size: 24px; }
        .msg-chara { color: var(--red); margin-bottom: 15px; border-left: 3px solid var(--red); padding-left: 10px; }
        .msg-player { color: #fff; opacity: 0.7; margin-bottom: 10px; text-align: right; }
        #chat-input { background: #000; border: none; border-top: 2px solid #333; color: #fff; font-family: inherit; font-size: 24px; padding: 15px; outline: none; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game">
    <div id="api-overlay">
        <h1 style="color:var(--red)">CORE LINK REQUIRED</h1>
        <input type="password" id="api-input" placeholder="Enter Gemini API Key..." style="width:350px; padding:10px; font-size:20px;">
        <button class="game-btn" onclick="saveApiKey()" style="margin-top:20px;">INITIALIZE</button>
    </div>

    <div id="menu-overlay" class="hidden">
        <h1 style="color:var(--red); font-size: 50px;">DETERMINATION PROTOCOL V16</h1>
        <div id="slot-container"></div>
    </div>

    <div id="battle-side">
        <div id="stat-ui">
            <span id="lv-txt">LV 1</span>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span>HP</span>
                <div id="hp-bar"><div id="hp-fill"></div></div>
                <span id="hp-txt">20/20</span>
            </div>
        </div>
        <div style="font-size:18px; color:#555; margin:5px;">
            SYNC: <span id="sync-txt" style="color:red">0</span>% | 
            LEARNING: <span id="learn-txt" style="color:white">0</span> XP
        </div>
        
        <div id="monster-sprite"></div>

        <div id="box">
            <div id="soul"></div>
        </div>

        <div class="btn-grid">
            <button class="game-btn" id="b-FIGHT" onclick="handleBtn('FIGHT')">FIGHT</button>
            <button class="game-btn" id="b-ACT" onclick="handleBtn('ACT')">ACT</button>
            <button class="game-btn" id="b-ITEM" onclick="handleBtn('ITEM')">ITEM</button>
            <button class="game-btn" id="b-MERCY" onclick="handleBtn('MERCY')">MERCY</button>
        </div>
    </div>

    <div id="chat-side">
        <div id="log"></div>
        <input type="text" id="chat-input" placeholder="Type to Chara..." autocomplete="off">
    </div>
</div>

<script>
    const STORAGE_KEY = 'UT_DATA_V16';
    let storage = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { slots: [null,null,null], apiKey: "" };
    let curSlot = null;

    // --- STATE ---
    let lv=1, hp=20, maxHp=20, exp=0, sync=20, battleExp=0, region='RUINS', defeated=[];
    let turn='MENU', enemy=null, bullets=[], frame=0, turnFrames=0;
    let soulX=211, soulY=121, soulVY=0, isBlueSoul=false, onGround=false;
    const keys = {};

    function saveApiKey() {
        const val = document.getElementById('api-input').value;
        if(val.startsWith("AIza")) { storage.apiKey = val; localStorage.setItem(STORAGE_KEY, JSON.stringify(storage)); location.reload(); }
    }

    if(!storage.apiKey) { document.getElementById('api-overlay').classList.remove('hidden'); }
    else { document.getElementById('menu-overlay').classList.remove('hidden'); initSlots(); }

    function initSlots() {
        const container = document.getElementById('slot-container'); container.innerHTML = '';
        storage.slots.forEach((s, i) => {
            const div = document.createElement('div'); div.className = `slot`;
            div.innerHTML = s ? `[${s.name}] LV ${s.lv} | ${s.region} | SYNC ${Math.floor(s.sync)}%` : `-- EMPTY TIMELINE --`;
            div.onclick = () => s ? loadSlot(i) : createSlot(i);
            container.appendChild(div);
        });
    }

    function createSlot(i) {
        let n = prompt("Name your vessel:"); if(!n) return;
        storage.slots[i] = { name: n, lv: 1, exp: 0, sync: 20, battleExp: 0, region: 'RUINS', defeated: [] };
        saveAll(); initSlots();
    }

    function loadSlot(i) {
        curSlot = i; const s = storage.slots[i];
        lv=s.lv; exp=s.exp; sync=s.sync; battleExp=s.battleExp; region=s.region; defeated=s.defeated;
        hp=20+(lv-1)*4; maxHp=hp;
        document.getElementById('menu-overlay').classList.add('hidden');
        updateStatsUI(); spawnEnemy(); requestAnimationFrame(mainLoop);
    }

    function saveAll() {
        if(curSlot !== null) storage.slots[curSlot] = { lv, exp, sync, battleExp, region, defeated, name: storage.slots[curSlot].name };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(storage));
    }

    // --- INPUT ---
    window.onkeydown = e => keys[e.code] = true;
    window.onkeyup = e => keys[e.code] = false;

    // --- ENGINE ---
    function mainLoop() {
        if(turn === 'SURVIVAL') runSurvival();
        frame++; requestAnimationFrame(mainLoop);
    }

    function spawnEnemy() {
        if (lv >= 7 && !defeated.includes("PAPYRUS")) {
            enemy = { n: "Papyrus", hp: 680, def: 0, exp: 0, art: "💀", boss: true, p: ['BONE_WAVE', 'BONE_TOWER'] };
        } else if (lv === 1 && !defeated.includes("NAPSTABLOOK")) {
            enemy = { n: "Napstablook", hp: 88, def: 0, exp: 20, art: "👻", boss: true, p: ['TEAR_RAIN', 'TEAR_WAVE'] };
        } else if (lv === 4 && !defeated.includes("TORIEL")) {
            enemy = { n: "Toriel", hp: 440, def: 5, exp: 100, art: "🐐", boss: true, p: ['FIRE_RAIN', 'FIRE_SPIRAL'] };
        } else {
            const pool = (region === 'SNOWDIN') ? 
                [{n:"Snowdrake", hp:40, exp:22, art:"🐦", p:['ICE']}, {n:"Doggo", hp:50, exp:30, art:"🐶", p:['BLUE_SLASH']}] : 
                [{n:"Froggit", hp:20, exp:10, art:"🐸", p:['FROG']}, {n:"Whimsun", hp:10, exp:5, art:"🦋", p:['DRIFT']}];
            enemy = { ...pool[Math.floor(Math.random()*pool.length)] };
        }
        document.getElementById('monster-sprite').innerText = enemy.art;
        logMsg("System", `* ${enemy.n} blocks the way.`, "");
        decideTurn();
    }

    function decideTurn() {
        if(Math.random()*100 < sync) {
            turn = 'CHARA_TURN';
            document.getElementById('soul').style.background = "#fff";
            document.querySelectorAll('.game-btn').forEach(b => b.classList.add('chara-lock'));
            // Chara's Autonomy Logic
            setTimeout(() => {
                if (hp < maxHp * 0.4) handleBtn('ITEM');
                else handleBtn('FIGHT');
            }, 800);
        } else {
            turn = 'PLAYER_TURN';
            document.getElementById('soul').style.background = "var(--red)";
            document.querySelectorAll('.game-btn').forEach(b => { b.disabled = false; b.classList.remove('chara-lock'); });
        }
    }

    function handleBtn(a) {
        if(turn !== 'PLAYER_TURN' && turn !== 'CHARA_TURN') return;
        if(a === 'FIGHT') {
            let dmg = Math.floor(Math.random() * 10) + lv;
            enemy.hp -= dmg;
            logMsg(turn==='CHARA_TURN'?"Chara":"You", `* Dealt ${dmg} damage to ${enemy.n}.`, turn==='CHARA_TURN'?'msg-chara':'msg-player');
            if(enemy.hp <= 0) handleVictory();
            else startSurvivalPhase();
        }
        if(a === 'ITEM') {
            hp = Math.min(maxHp, hp+15);
            logMsg(turn==='CHARA_TURN'?"Chara":"You", "* Ate the Cinnamon Bun. HP restored.", "");
            updateStatsUI();
            startSurvivalPhase();
        }
    }

    function handleVictory() {
        if(enemy.boss) {
            defeated.push(enemy.n.toUpperCase());
            if(enemy.n === "Toriel") region = 'SNOWDIN';
            if(enemy.n === "Papyrus") lv++;
        }
        exp += enemy.exp;
        if(exp >= lv*50) lv++;
        saveAll(); updateStatsUI(); spawnEnemy();
    }

    // --- DODGE & LEARNING ENGINE ---
    function startSurvivalPhase() { 
        turn = 'SURVIVAL'; 
        turnFrames = 400; 
        bullets = []; 
        // Papyrus Soul Change Logic
        if (enemy.n === "Papyrus" && turnFrames < 350) {
            isBlueSoul = true;
            document.getElementById('soul').style.filter = "hue-rotate(200deg)";
        } else {
            isBlueSoul = false;
            document.getElementById('soul').style.filter = "none";
        }
    }

    function runSurvival() {
        let isCharaControlling = (sync >= 100) || (Math.random()*100 < sync);
        let moving = false;

        // PHYSICS & MOVEMENT
        if (isCharaControlling) {
            // CHARA LEARNING LOGIC
            let target = null;
            let minDist = 100;
            bullets.forEach(b => {
                let d = Math.hypot(b.x-soulX, b.y-soulY);
                if (b.isGreen && d < 200) target = b; // Priority 1: Healing
                else if (d < minDist) { minDist = d; target = b; } // Priority 2: Avoidance
            });

            if (target) {
                if (target.isBlue && battleExp > 500) {
                    moving = false; // Chara learned to stand still for Blue!
                } else if (target.isGreen && battleExp > 200) {
                    soulX += (target.x > soulX ? 3 : -3);
                    soulY += (target.y > soulY ? 3 : -3);
                    moving = true;
                } else {
                    soulX += (target.x > soulX ? -3.5 : 3.5);
                    soulY += (target.y > soulY ? -3.5 : 3.5);
                    moving = true;
                }
            }
        } else {
            // Player Movement
            let s = keys['ShiftLeft'] ? 1.5 : 4;
            if (!isBlueSoul) {
                if(keys['ArrowUp']) { soulY -= s; moving = true; }
                if(keys['ArrowDown']) { soulY += s; moving = true; }
            } else {
                // Gravity Logic
                if(keys['ArrowUp'] && onGround) { soulVY = -12; onGround = false; }
                soulVY += 0.6; // Gravity
                soulY += soulVY;
                if (soulY >= 242) { soulY = 242; soulVY = 0; onGround = true; }
                if (keys['ArrowLeft'] || keys['ArrowRight']) moving = true;
            }
            if(keys['ArrowLeft']) { soulX -= s; moving = true; }
            if(keys['ArrowRight']) { soulX += s; moving = true; }
        }

        soulX = Math.max(0, Math.min(422, soulX)); 
        soulY = Math.max(0, Math.min(242, soulY));
        document.getElementById('soul').style.left = soulX+'px'; document.getElementById('soul').style.top = soulY+'px';

        if(frame % 20 === 0) spawnBullet();

        // Bullet Logic
        for(let i=bullets.length-1; i>=0; i--) {
            let b = bullets[i]; b.x += b.vx; b.y += b.vy;
            b.el.style.left = b.x+'px'; b.el.style.top = b.y+'px';
            
            let dist = Math.hypot(b.x-soulX, b.y-soulY);
            if(dist < 15) {
                if(b.isBlue && !moving) { /* Safe! */ }
                else if(b.isGreen) { hp = Math.min(maxHp, hp+2); b.el.remove(); bullets.splice(i,1); }
                else {
                    hp -= 1; b.el.remove(); bullets.splice(i,1); 
                    if(hp <= 0) handleGameOver();
                }
                updateStatsUI();
            } else if(b.y > 280 || b.x > 460 || b.x < -50) { b.el.remove(); bullets.splice(i,1); }
        }

        battleExp++; // Chara gains XP just for existing in the bullet box
        if (frame % 60 === 0) updateStatsUI();

        turnFrames--; 
        if(turnFrames <= 0) { bullets.forEach(b => b.el.remove()); decideTurn(); }
    }

    function spawnBullet() {
        const type = enemy.p[Math.floor(Math.random()*enemy.p.length)];
        let x = Math.random()*400, y = -20, vx = 0, vy = 3, art = "•", color = "white", isB = false, isG = false;

        if (type === 'TEAR_RAIN') { art = "💧"; vy = 4; }
        if (type === 'FIRE_SPIRAL') { x = 220; y = 130; vx = Math.cos(frame)*4; vy = Math.sin(frame)*4; art = "🔥"; }
        if (type === 'BLUE_SLASH') { x = -20; y = soulY; vx = 5; vy = 0; color = "var(--blue)"; isB = true; art = "—"; }
        if (type === 'BONE_WAVE') { x = 440; y = 240; vx = -5; vy = 0; art = "🦴"; }
        if (type === 'FROG') { y = 260; vy = -4; art = "🐸"; }

        const el = document.createElement('div');
        el.className = 'bullet'; el.innerText = art; el.style.color = color;
        document.getElementById('box').appendChild(el);
        bullets.push({x, y, vx, vy, el, isBlue: isB, isGreen: isG});
    }

    function handleGameOver() {
        if (enemy.n === "Papyrus") {
            alert("CAPTURED! Papyrus puts you in the doghouse. (Restarting Fight)");
            hp = maxHp; updateStatsUI(); startSurvivalPhase();
        } else {
            alert("STAY DETERMINED..."); location.reload();
        }
    }

    function updateStatsUI() {
        document.getElementById('lv-txt').innerText = `LV ${lv}`;
        document.getElementById('hp-txt').innerText = `${Math.ceil(hp)}/${maxHp}`;
        document.getElementById('hp-fill').style.width = (hp/maxHp)*100+"%";
        document.getElementById('sync-txt').innerText = Math.floor(sync);
        document.getElementById('learn-txt').innerText = battleExp;
    }

    async function talk(txt) {
        if(!storage.apiKey) return;
        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${storage.apiKey}`, {
                method: 'POST', 
                body: JSON.stringify({ 
                    systemInstruction: { parts: [{ text: `You are Chara. LV ${lv}. Sync: ${sync}. Battle Experience: ${battleExp}. Speak in cold, short sentences. Reply in JSON format: {"reply": "text", "syncDelta": number}` }]},
                    contents: [{role: "user", parts: [{text: txt}]}],
                    generationConfig: { responseMimeType: "application/json" }
                })
            });
            const d = await r.json();
            const res = JSON.parse(d.candidates[0].content.parts[0].text);
            logMsg("Chara", res.reply, "msg-chara");
            sync = Math.min(100, Math.max(0, sync + (res.syncDelta || 0)));
            updateStatsUI();
        } catch(e) { console.error(e); }
    }

    document.getElementById('chat-input').onkeypress = e => { if(e.key === 'Enter'){ logMsg("You", e.target.value, "msg-player"); talk(e.target.value); e.target.value = ''; }};
    function logMsg(s, t, c) { const l = document.getElementById('log'); const d = document.createElement('div'); d.className = c; d.innerText = t; l.appendChild(d); l.scrollTop = l.scrollHeight; }
</script>
</body>
</html>
