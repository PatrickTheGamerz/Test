<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Undertale: Determination Protocol V16</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        :root { --red: #ff0000; --yellow: #ffff00; --white: #ffffff; --orange: #ffaa00; --green: #00ff00; --blue: #00a2ff; --bg: #000; }
        
        body { background: var(--bg); color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'VT323', monospace; overflow: hidden; }
        #game { display: flex; width: 1100px; height: 750px; border: 4px solid #333; position: relative; box-shadow: 0 0 60px rgba(255,255,255,0.2); }

        /* Screens */
        #api-overlay, #menu-overlay { position: absolute; inset: 0; background: #000; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .slot { width: 450px; padding: 15px; border: 3px solid #fff; margin: 10px; cursor: pointer; background: #111; }
        .slot:hover { border-color: var(--red); color: var(--red); }

        /* Battle Side */
        #battle-side { width: 620px; border-right: 4px solid #222; display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }
        #monster-sprite { height: 160px; font-size: 100px; display: flex; align-items: center; justify-content: center; position: relative; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
        #box { width: 440px; height: 260px; border: 6px solid #fff; position: relative; overflow: hidden; margin: 15px 0; background: #000; transition: border-color 0.2s; }
        
        #soul { 
            width: 18px; height: 18px; position: absolute; z-index: 100; 
            clip-path: path('M9 2.1C9 2.1 8.4 0 4.2 0 1.2 0 0 2.4 0 4.4 0 8.4 9 13.5 9 13.5S18 8.4 18 4.4C18 2.4 16.8 0 13.8 0 10.6 0 9 2.1 9 2.1Z'); 
        }

        .bullet { position: absolute; border-radius: 2px; }

        /* Fight Bar */
        #fight-ui { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 500; }
        #target-area { width: 380px; height: 120px; border: 4px solid #fff; position: relative; background: url('https://raw.githubusercontent.com/FryingPan/undertale-fight-assets/master/images/target.png') center/cover; }
        #slider { width: 14px; height: 100%; background: #fff; position: absolute; left: 0; box-shadow: 0 0 15px #fff; }

        /* UI Elements */
        #stat-ui { width: 100%; display: flex; justify-content: space-between; font-size: 32px; }
        #hp-bar { width: 140px; height: 22px; background: var(--red); border: 2px solid #000; position: relative; }
        #hp-fill { height: 100%; background: var(--yellow); width: 100%; transition: width 0.2s; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .game-btn { background: #000; border: 3px solid var(--orange); color: var(--orange); font-family: inherit; font-size: 30px; padding: 10px; cursor: pointer; text-align: center; }
        .game-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .possession-active { border-color: #fff !important; color: #fff !important; box-shadow: 0 0 15px #fff; }

        /* Chat Side */
        #chat-side { width: 480px; display: flex; flex-direction: column; background: #050505; border-left: 2px solid #222; }
        #log { flex-grow: 1; padding: 25px; overflow-y: auto; font-size: 24px; line-height: 1.4; }
        .msg-chara { color: var(--red); border-left: 3px solid var(--red); padding-left: 12px; margin-bottom: 20px; }
        .msg-player { color: #fff; align-self: flex-end; opacity: 0.6; margin-bottom: 15px; text-align: right; }
        #chat-input { background: #000; border: none; border-top: 2px solid #333; color: #fff; font-family: inherit; font-size: 26px; padding: 15px; outline: none; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game">
    <div id="api-overlay">
        <h1 style="color:var(--red); font-size: 50px;">CORE LINK REQUIRED</h1>
        <input type="text" id="api-input" placeholder="Enter Gemini 2.5 Flash API Key..." style="width:400px; padding:15px; font-family:inherit; font-size:20px; background:#111; color:#fff; border: 2px solid #333;">
        <button class="game-btn" onclick="saveApiKey()" style="margin-top:20px; width: 200px;">INITIATE</button>
    </div>

    <div id="menu-overlay" class="hidden">
        <h1 style="color:var(--red); font-size: 60px; letter-spacing: 10px;">DETERMINATION</h1>
        <div id="slot-container"></div>
    </div>

    <div id="battle-side">
        <div id="stat-ui">
            <span id="lv-txt">LV 1</span>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span>HP</span>
                <div id="hp-bar"><div id="hp-fill"></div></div>
                <span id="hp-txt">20/20</span>
            </div>
        </div>
        <div style="font-size:18px; color:#666; margin:5px;">SYNC: <span id="sync-txt" style="color:red">0</span>% | STATUS: <span id="status-txt">CONNECTED</span></div>
        
        <div id="monster-sprite"></div>

        <div id="box">
            <div id="soul"></div>
            <div id="fight-ui">
                <div id="target-area"><div id="slider"></div></div>
            </div>
        </div>

        <div class="btn-grid">
            <button class="game-btn" id="b-FIGHT" onclick="handleBtn('FIGHT')">FIGHT</button>
            <button class="game-btn" id="b-ACT" onclick="handleBtn('ACT')">ACT</button>
            <button class="game-btn" id="b-ITEM" onclick="handleBtn('ITEM')">ITEM</button>
            <button class="game-btn" id="b-MERCY" onclick="handleBtn('MERCY')">MERCY</button>
        </div>
    </div>

    <div id="chat-side">
        <div id="log"></div>
        <input type="text" id="chat-input" placeholder="Say something..." autocomplete="off">
    </div>
</div>

<script>
    const KEY = 'UT_DATA_V16';
    let storage = JSON.parse(localStorage.getItem(KEY)) || { slots: [null,null,null], apiKey: "" };
    let curSlot = null;

    // --- STATE ---
    let lv=1, hp=20, maxHp=20, exp=0, sync=0, region='RUINS', defeated=[];
    let learning = { items: 0, blueDodge: 0, moveDistance: 0 }; 
    
    let turn='MENU', enemy=null, bullets=[], frame=0, turnFrames=0;
    let soulX=211, soulY=121, soulColor='red', yVel=0;
    let sliderX=0, sliderDir=8, sliderFrames=0;
    
    // POSSESSION LOGIC
    let possessionTimer = 0; // Frames remaining of Chara control
    const keys = {};

    function saveApiKey() {
        const val = document.getElementById('api-input').value;
        if(val.startsWith("AIza")) { 
            storage.apiKey = val; 
            localStorage.setItem(KEY, JSON.stringify(storage)); 
            location.reload(); 
        }
    }

    if(!storage.apiKey) { 
        document.getElementById('api-overlay').classList.remove('hidden'); 
    } else { 
        document.getElementById('api-overlay').classList.add('hidden'); 
        document.getElementById('menu-overlay').classList.remove('hidden'); 
        initSlots(); 
    }

    function initSlots() {
        const container = document.getElementById('slot-container'); container.innerHTML = '';
        storage.slots.forEach((s, i) => {
            const div = document.createElement('div'); div.className = `slot ${s?'':'empty'}`;
            div.innerHTML = s ? `[${s.name}] LV ${s.lv} | ${s.region} | SYNC ${Math.floor(s.sync)}%` : `-- NEW TIMELINE --`;
            div.onclick = () => s ? loadSlot(i) : createSlot(i);
            container.appendChild(div);
        });
    }

    function createSlot(i) {
        let n = prompt("Name:"); if(!n) return;
        storage.slots[i] = { name: n, lv: 1, exp: 0, sync: 2, learning: {items:0, blueDodge:0, moveDistance:0}, region: 'RUINS', defeated: [] };
        saveAll(); initSlots();
    }

    function loadSlot(i) {
        curSlot = i; const s = storage.slots[i];
        lv=s.lv; exp=s.exp; sync=s.sync; region=s.region; defeated=s.defeated;
        learning = s.learning || {items:0, blueDodge:0, moveDistance:0};
        hp=20+(lv-1)*4; maxHp=hp;
        document.getElementById('menu-overlay').classList.add('hidden');
        updateStatsUI(); spawnEnemy(); requestAnimationFrame(mainLoop);
    }

    function saveAll() {
        if(curSlot !== null) {
            storage.slots[curSlot] = { lv, exp, sync, learning, region, defeated, name: storage.slots[curSlot].name };
            localStorage.setItem(KEY, JSON.stringify(storage));
        }
    }

    window.onkeydown = e => keys[e.code] = true;
    window.onkeyup = e => keys[e.code] = false;

    function mainLoop() {
        if(turn === 'SURVIVAL') runSurvival();
        if(turn === 'FIGHT_PLAYER' || turn === 'FIGHT_CHARA') runFightBar();
        
        // INTERRUPT LOGIC: Chara can seize control every 2 seconds
        if(frame % 120 === 0 && turn !== 'MENU' && sync > 5) {
            if(Math.random() * 100 < sync) {
                possessionTimer = Math.floor(sync * 6); // Duration scales: 100% = 600 frames (10s)
            }
        }

        frame++; requestAnimationFrame(mainLoop);
    }

    function spawnEnemy() {
        // HP INCREASED SIGNIFICANTLY
        if(lv >= 7 && !defeated.includes("PAPYRUS")) {
            enemy = { n: "Papyrus", hp: 6800, def: 20, exp: 0, art: "💀", boss: true, p: ['BONE_JUMP', 'BONE_RAIN', 'BLUE_BONE'] };
        } else if(lv === 2 && !defeated.includes("NAPSTABLOOK")) {
            enemy = { n: "Napstablook", hp: 1200, def: 5, exp: 0, art: "👻", boss: true, p: ['TEARS', 'SINE_TEARS'] };
        } else if(lv === 3 && !defeated.includes("TORIEL")) {
            enemy = { n: "Toriel", hp: 8500, def: 10, exp: 0, art: "🐐", boss: true, p: ['FIRE', 'FIRE_ARC'] };
        } else {
            const ruins = [{n:"Froggit", hp:400, def:10, exp:20, art:"🐸", p:['FROG','FLY']}];
            const snow = [{n:"Snowdrake", hp:900, def:15, exp:22, art:"🐦", p:['ICE']}];
            const pool = (region === 'SNOWDIN') ? snow : ruins;
            enemy = { ...pool[0] };
        }
        document.getElementById('monster-sprite').innerText = enemy.art;
        logMsg("System", `* ${enemy.n} blocks the way.`, "");
        decideTurn();
    }

    function decideTurn() {
        soulColor = (enemy.n === "Papyrus") ? 'blue' : 'red';
        turn = 'PLAYER_TURN';
        document.querySelectorAll('.game-btn').forEach(b => b.disabled = false);
        
        // If high sync, Chara might just pick for you
        if(sync > 40 && Math.random() < (sync/200)) {
            setTimeout(() => {
                logMsg("System", "* Control lost.", "");
                handleBtn(hp < 15 ? 'ITEM' : 'FIGHT');
            }, 500);
        }
    }

    function handleBtn(a) {
        if(turn !== 'PLAYER_TURN') return;
        if(a === 'FIGHT') startFightBar(false);
        if(a === 'ITEM') { hp = Math.min(maxHp, hp+15); learning.items++; startSurvivalPhase(); }
        if(a === 'ACT' || a === 'MERCY') startSurvivalPhase();
    }

    function startFightBar(isChara) {
        turn = isChara ? 'FIGHT_CHARA' : 'FIGHT_PLAYER';
        sliderX = 0; sliderFrames = 0;
        document.getElementById('fight-ui').style.display = 'flex';
        document.querySelectorAll('.game-btn').forEach(b => b.disabled = true);
    }

    function runFightBar() {
        sliderX += sliderDir;
        sliderFrames++;
        if(sliderX > 370 || sliderX < 0) sliderDir *= -1;
        document.getElementById('slider').style.left = sliderX + 'px';

        // Possession during fight bar
        if(possessionTimer > 0) {
            document.getElementById('slider').style.background = "var(--red)";
            if(Math.abs(190 - sliderX) < 10) triggerHit();
        } else if(keys['KeyZ'] || keys['Enter']) {
            triggerHit();
        }
        if(possessionTimer > 0) possessionTimer--;
    }

    function triggerHit() {
        turn = 'ANIMATING';
        document.getElementById('fight-ui').style.display = 'none';
        let dist = Math.abs(190 - sliderX);
        let precision = Math.max(0.1, (1 - (dist / 190)));
        let dmg = Math.floor((15 + lv*5) * precision);
        enemy.hp -= dmg;
        logMsg("System", `* Dealt ${dmg} damage.`, "");
        setTimeout(() => { if(enemy.hp <= 0) handleVictory(); else startSurvivalPhase(); }, 600);
    }

    function handleVictory() {
        if(enemy.boss) defeated.push(enemy.n.toUpperCase());
        if(enemy.n === "Toriel") region = 'SNOWDIN';
        exp += 100; sync = Math.min(100, sync+2);
        saveAll(); updateStatsUI(); spawnEnemy();
    }

    function startSurvivalPhase() { turn = 'SURVIVAL'; turnFrames = 380; bullets = []; }

    function runSurvival() {
        let isCharaActive = possessionTimer > 0;
        let s = keys['ShiftLeft'] ? 1.5 : 4;
        let oldX = soulX, oldY = soulY;

        // Visual Indicator of Control
        document.getElementById('soul').style.background = isCharaActive ? "#fff" : (soulColor === 'blue' ? 'var(--blue)' : 'var(--red)');
        document.getElementById('box').style.borderColor = isCharaActive ? "var(--red)" : "#fff";

        if(isCharaActive) {
            // CHARA POSSESSION PHYSICS
            let near = null, d = 90;
            bullets.forEach(b => { let dst = Math.hypot(b.x-soulX, b.y-soulY); if(dst < d){ d=dst; near=b; }});
            if(near) {
                if(near.isBlue && learning.blueDodge > 2) { /* Stand Still */ }
                else {
                    soulX += (near.x > soulX ? -3.5 : 3.5);
                    if(soulColor !== 'blue') soulY += (near.y > soulY ? -3.5 : 3.5);
                    if(soulColor === 'blue' && soulY >= 242) yVel = -8; 
                }
            }
            possessionTimer--;
        } else {
            // PLAYER CONTROL
            if(soulColor !== 'blue' && (keys['ArrowUp'] || keys['KeyW'])) soulY -= s;
            if(soulColor !== 'blue' && (keys['ArrowDown'] || keys['KeyS'])) soulY += s;
            if(keys['ArrowLeft'] || keys['KeyA']) soulX -= s;
            if(keys['ArrowRight'] || keys['KeyD']) soulX += s;
        }

        // Blue Soul Gravity
        if (soulColor === 'blue') {
            yVel += 0.4; soulY += yVel;
            if (soulY >= 242) { 
                soulY = 242; yVel = 0; 
                if ((keys['ArrowUp'] || keys['KeyW']) && !isCharaActive) yVel = -8.5; 
            }
        }

        soulX = Math.max(0, Math.min(422, soulX)); soulY = Math.max(0, Math.min(242, soulY));
        document.getElementById('soul').style.left = soulX+'px'; document.getElementById('soul').style.top = soulY+'px';

        if(frame % 25 === 0) spawnProj();

        bullets.forEach((b, i) => {
            b.x += b.vx; b.y += b.vy;
            b.el.style.left = b.x+'px'; b.el.style.top = b.y+'px';
            if(Math.hypot(b.x-soulX, b.y-soulY) < 14) {
                if(b.isBlue && Math.hypot(soulX-oldX, soulY-oldY) < 0.1) { /* Saved */ }
                else { hp -= 1; b.el.remove(); bullets.splice(i,1); updateStatsUI(); }
                if(hp <= 0) location.reload();
            } else if(b.y > 300 || b.x > 500 || b.x < -50) { b.el.remove(); bullets.splice(i,1); }
        });

        turnFrames--; if(turnFrames <= 0) { bullets.forEach(b => b.el.remove()); decideTurn(); }
    }

    function spawnProj() {
        const p = enemy.p[Math.floor(Math.random()*enemy.p.length)];
        let x = Math.random()*440, y = -10, vx = 0, vy = 5, isB = (p==='BLUE_BONE');
        if(p === 'BONE_JUMP') { x = 440; y = 230; vx = -6; vy = 0; }
        const b = { x, y, vx, vy, isBlue: isB, el: document.createElement('div') };
        b.el.className = 'bullet';
        b.el.style.width = p.includes('BONE') ? '12px' : '16px';
        b.el.style.height = p.includes('BONE') ? '60px' : '16px';
        b.el.style.background = isB ? "var(--blue)" : "#fff";
        document.getElementById('box').appendChild(b.el); bullets.push(b);
    }

    function updateStatsUI() {
        maxHp = 20 + (lv-1)*4;
        document.getElementById('lv-txt').innerText = `LV ${lv}`;
        document.getElementById('hp-txt').innerText = `${Math.ceil(hp)}/${maxHp}`;
        document.getElementById('hp-fill').style.width = (hp/maxHp)*100+"%";
        document.getElementById('sync-txt').innerText = Math.floor(sync);
    }

    async function talk(txt) {
        if(!storage.apiKey) return;
        const prompt = `You are Chara in Undertale. Sync: ${sync}%. You can POSSESS the soul now. Mention your control. Be cryptic and dark. JSON: {"reply": "string", "controlMod": number}`;
        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${storage.apiKey}`, {
                method: 'POST', body: JSON.stringify({ contents: [{role: "user", parts: [{text: prompt + " Player: " + txt}]}], generationConfig: {responseMimeType: "application/json"} })
            });
            const d = await r.json(); 
            const res = JSON.parse(d.candidates[0].content.parts[0].text);
            logMsg("Chara", res.reply, "msg-chara"); 
            sync = Math.min(100, Math.max(0, sync + res.controlMod)); 
            updateStatsUI();
        } catch(e) { console.log("AI Error"); }
    }

    document.getElementById('chat-input').onkeypress = e => { if(e.key === 'Enter'){ logMsg("You", e.target.value, "msg-player"); talk(e.target.value); e.target.value = ''; }};
    function logMsg(s, t, c) { const l = document.getElementById('log'); const d = document.createElement('div'); d.className = c; d.innerText = t; l.appendChild(d); l.scrollTop = l.scrollHeight; }
</script>
</body>
</html>
