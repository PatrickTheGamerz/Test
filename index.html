<!DOCTYPE html>
<html>
<head>
    <title>ORANGEBIRD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body oncontextmenu="return false;">

    <div id="cursor-custom"></div>

    <div id="game-container">
        <div id="score-text" style="position:absolute; width:100%; text-align:center; top:40px; font-size:50px; font-weight:900; z-index:10;">0</div>

        <div id="menu-gui" class="gui-layer">
            <h1 style="color:#fff; font-size:60px; margin:0;">ORANGEBIRD</h1>
            <p style="color:#fff;">POINTS: <span id="points-val">0</span></p>
            <button class="btn-orange" onclick="setTheme('day'); startGame();">FLY MISSION</button>
            <button class="btn-orange" onclick="setTheme('midnight'); openHangar();">HANGAR</button>
            <button class="btn-orange" onclick="setTheme('sunset'); openAchievements();">MEDALS</button>
        </div>

        <div id="hangar-gui" class="gui-layer" style="display:none; background:transparent;">
            <div id="hangar-canvas">
                <svg id="skill-lines" style="position:absolute; width:100%; height:100%; pointer-events:none;"></svg>
                </div>
            <button class="btn-orange" style="position:absolute; bottom:30px;" onclick="closeHangar()">EXIT HANGAR</button>
            <div style="position:absolute; top:20px; color:#aaa;">Right-Click & Drag to Pan Hangar</div>
        </div>

        <div id="ach-gui" class="gui-layer" style="display:none;">
            <h2>ACHIEVEMENTS</h2>
            <div id="ach-list" style="width:80%; max-height:400px; overflow-y:auto;"></div>
            <button class="btn-orange" onclick="closeAchievements()">BACK</button>
        </div>

        <div id="achievement-toast">
            <div class="toast-img"></div>
            <div class="toast-info">
                <b id="toast-title">Achievement Unlocked!</b>
                <span id="toast-desc">You are a pro.</span>
            </div>
        </div>

        <div id="bird"></div>
        <div id="world"></div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const hangar = document.getElementById('hangar-canvas');
        const bird = document.getElementById('bird');
        const world = document.getElementById('world');
        const cursor = document.getElementById('cursor-custom');

        // GAME VARS
        let gameState = 'menu';
        let birdY = 300, velocity = 0, gravity = 0.45, jump = -8;
        let pipesPassed = 0, points = parseInt(localStorage.getItem('ob_points')) || 0;
        let pipes = [], frame = 0;
        let skillEffects = { slim: 0, slower: 0, bigScore: false };

        // PANNING LOGIC
        let isPanning = false, startX, startY, scrollLeft, scrollTop;
        let hangarPos = { x: -750, y: -625 };

        // MOUSE & CURSOR
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            if(isPanning) {
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                hangarPos.x = scrollLeft + dx;
                hangarPos.y = scrollTop + dy;
                hangar.style.transform = `translate(${hangarPos.x}px, ${hangarPos.y}px)`;
            }
        });

        document.addEventListener('mousedown', e => {
            if(e.button === 2 || e.button === 1) { // Right or Middle click to pan
                isPanning = true;
                startX = e.clientX; startY = e.clientY;
                scrollLeft = hangarPos.x; scrollTop = hangarPos.y;
            }
        });
        document.addEventListener('mouseup', () => isPanning = false);

        // THEME ENGINE
        function setTheme(theme) {
            container.style.background = `var(--bg-${theme})`;
        }

        // START GAME
        function startGame() {
            gameState = 'playing';
            document.getElementById('menu-gui').style.display = 'none';
            birdY = 300; velocity = 0; pipesPassed = 0; pipes = []; frame = 0;
            world.innerHTML = '';
            document.getElementById('score-text').innerText = '0';
            loop();
        }

        function spawnPipe() {
            const gap = 170 + (skillEffects.slim * 10);
            const topH = Math.random() * 300 + 100;
            const p = { x: 550, th: topH, bh: 750 - topH - gap, passed: false,
                       dt: document.createElement('div'), db: document.createElement('div') };
            p.dt.className = 'pipe pipe-top'; p.dt.style.height = p.th + 'px';
            p.db.className = 'pipe pipe-bottom'; p.db.style.height = p.bh + 'px'; p.db.style.bottom = '0';
            world.appendChild(p.dt); world.appendChild(p.db);
            pipes.push(p);
        }

        function loop() {
            if(gameState !== 'playing') return;
            frame++;
            velocity += gravity; birdY += velocity;
            bird.style.top = birdY + 'px';
            bird.style.transform = `rotate(${Math.min(velocity * 4, 90)}deg)`;

            if(frame % 160 === 0) spawnPipe();

            pipes.forEach((p, i) => {
                p.x -= (3.5 - (skillEffects.slower * 0.5));
                p.dt.style.left = p.x + 'px'; p.db.style.left = p.x + 'px';

                const b = bird.getBoundingClientRect();
                const pt = p.dt.getBoundingClientRect();
                const pb = p.db.getBoundingClientRect();

                if(b.right-10 > pt.left && b.left+10 < pt.right) {
                    if(b.top+10 < pt.bottom || b.bottom-10 > pb.top) gameOver();
                }

                if(p.x < 50 && !p.passed) {
                    p.passed = true;
                    pipesPassed++;
                    // 5 Pipes = 1 Point
                    if(pipesPassed % 5 === 0) {
                        points++;
                        saveData();
                    }
                    document.getElementById('score-text').innerText = Math.floor(pipesPassed / 5);
                }
            });

            if(birdY > 720 || birdY < -20) gameOver();
            requestAnimationFrame(loop);
        }

        function gameOver() {
            gameState = 'menu';
            document.getElementById('menu-gui').style.display = 'flex';
            document.getElementById('points-val').innerText = points;
            setTheme('day');
        }

        // STEAM NOTIFICATION
        function unlockAchievement(name, desc) {
            const toast = document.getElementById('achievement-toast');
            document.getElementById('toast-title').innerText = name;
            document.getElementById('toast-desc').innerText = desc;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 5000);
        }

        // HANGAR & SKILLS
        const skills = [
            { id: 'S1', name: 'Aero Shell', desc: 'Easier Hitbox', cost: 1, x: 1000, y: 1000, parent: null },
            { id: 'S2', name: 'Engine Tuner', desc: 'Slow Pipes', cost: 5, x: 1150, y: 900, parent: 'S1' },
            { id: 'S3', name: 'Light Frame', desc: 'Higher Jump', cost: 10, x: 1300, y: 1000, parent: 'S2' }
        ];
        let boughtSkills = JSON.parse(localStorage.getItem('ob_skills')) || [];

        function openHangar() {
            document.getElementById('menu-gui').style.display = 'none';
            document.getElementById('hangar-gui').style.display = 'flex';
            renderSkills();
        }

        function renderSkills() {
            const svg = document.getElementById('skill-lines');
            svg.innerHTML = '';
            // Remove old nodes
            document.querySelectorAll('.skill-node').forEach(n => n.remove());

            skills.forEach(s => {
                const node = document.createElement('div');
                node.className = `skill-node ${boughtSkills.includes(s.id) ? 'bought' : (s.parent == null || boughtSkills.includes(s.parent) ? 'available' : '')}`;
                node.style.left = s.x + 'px'; node.style.top = s.y + 'px';
                node.innerHTML = `<b>${s.name}</b><br>${s.desc}<br>(${s.cost} PT)`;
                
                node.onclick = () => {
                    if(points >= s.cost && !boughtSkills.includes(s.id) && (s.parent == null || boughtSkills.includes(s.parent))) {
                        points -= s.cost;
                        boughtSkills.push(s.id);
                        saveData();
                        renderSkills();
                        applySkills();
                        unlockAchievement("Researcher", "Bought your first skill!");
                    }
                };
                hangar.appendChild(node);

                if(s.parent) {
                    const parent = skills.find(p => p.id === s.parent);
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", parent.x + 35); line.setAttribute("y1", parent.y + 35);
                    line.setAttribute("x2", s.x + 35); line.setAttribute("y2", s.y + 35);
                    line.setAttribute("class", `skill-line ${boughtSkills.includes(s.id) ? 'line-active' : ''}`);
                    svg.appendChild(line);
                }
            });
        }

        function applySkills() {
            if(boughtSkills.includes('S1')) skillEffects.slim = 2;
            if(boughtSkills.includes('S2')) skillEffects.slower = 1;
        }

        function saveData() {
            localStorage.setItem('ob_points', points);
            localStorage.setItem('ob_skills', JSON.stringify(boughtSkills));
        }

        function closeHangar() { document.getElementById('hangar-gui').style.display = 'none'; gameOver(); }
        function openAchievements() { document.getElementById('menu-gui').style.display = 'none'; document.getElementById('ach-gui').style.display = 'flex'; }
        function closeAchievements() { document.getElementById('ach-gui').style.display = 'none'; gameOver(); }

        window.addEventListener('mousedown', e => { if(e.button === 0) { velocity = jump; } });
        window.addEventListener('keydown', e => { if(e.code === 'Space') velocity = jump; });

        applySkills();
    </script>
</body>
</html>
