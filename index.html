<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Undertale: Determination Protocol V15.5</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        :root { --red: #ff0000; --yellow: #ffff00; --white: #ffffff; --orange: #ffaa00; --green: #00ff00; --blue: #00a2ff; --bg: #000; }
        
        body { background: var(--bg); color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'VT323', monospace; overflow: hidden; }
        #game { display: flex; width: 1100px; height: 750px; border: 4px solid #333; position: relative; box-shadow: 0 0 50px rgba(255,0,0,0.5); }

        /* Screens */
        #api-overlay, #menu-overlay { position: absolute; inset: 0; background: #000; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .slot { width: 450px; padding: 15px; border: 3px solid #fff; margin: 10px; cursor: pointer; background: #111; }
        .slot:hover { border-color: var(--red); color: var(--red); }

        /* Battle */
        #battle-side { width: 620px; border-right: 4px solid #222; display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }
        #monster-sprite { height: 160px; font-size: 100px; display: flex; align-items: center; justify-content: center; position: relative; }
        #box { width: 440px; height: 260px; border: 6px solid #fff; position: relative; overflow: hidden; margin: 15px 0; background: #000; }
        
        /* Soul Physics */
        #soul { 
            width: 18px; height: 18px; position: absolute; z-index: 100; 
            clip-path: path('M9 2.1C9 2.1 8.4 0 4.2 0 1.2 0 0 2.4 0 4.4 0 8.4 9 13.5 9 13.5S18 8.4 18 4.4C18 2.4 16.8 0 13.8 0 10.6 0 9 2.1 9 2.1Z'); 
            transition: background 0.1s;
        }
        .bullet { position: absolute; border-radius: 2px; }

        /* Fight Bar */
        #fight-ui { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 500; }
        #target-area { width: 380px; height: 120px; border: 4px solid #fff; position: relative; background: url('https://raw.githubusercontent.com/FryingPan/undertale-fight-assets/master/images/target.png') center/cover; }
        #slider { width: 14px; height: 100%; background: #fff; position: absolute; left: 0; box-shadow: 0 0 15px #fff; }

        /* Stats */
        #stat-ui { width: 100%; display: flex; justify-content: space-between; font-size: 32px; }
        #hp-bar { width: 140px; height: 22px; background: var(--red); border: 2px solid #000; position: relative; }
        #hp-fill { height: 100%; background: var(--yellow); width: 100%; transition: width 0.2s; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .game-btn { background: #000; border: 3px solid var(--orange); color: var(--orange); font-family: inherit; font-size: 30px; padding: 10px; cursor: pointer; text-align: center; }
        .game-btn:disabled { opacity: 0.2; cursor: default; }
        .chara-lock { border-color: #fff !important; color: #fff !important; }

        /* Chat side */
        #chat-side { width: 480px; display: flex; flex-direction: column; background: #050505; border-left: 2px solid #222; }
        #log { flex-grow: 1; padding: 25px; overflow-y: auto; font-size: 24px; color: var(--orange); }
        .msg-chara { color: var(--red); border-left: 3px solid var(--red); padding-left: 12px; margin-bottom: 20px; }
        .msg-player { color: #fff; align-self: flex-end; opacity: 0.6; margin-bottom: 15px; }
        #chat-input { background: #000; border: none; border-top: 2px solid #333; color: #fff; font-family: inherit; font-size: 26px; padding: 15px; outline: none; }

        .slash-vfx { position: absolute; width: 100px; height: 100px; background: #fff; clip-path: polygon(10% 45%, 90% 45%, 90% 55%, 10% 55%); animation: slash 0.2s linear forwards; z-index: 600; }
        @keyframes slash { 0% { transform: scaleY(0); } 50% { transform: scaleY(6); } 100% { transform: scaleY(0); opacity:0; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game">
    <div id="api-overlay">
        <h1 style="color:var(--red)">CONNECTION REQUIRED</h1>
        <p>Your API key is saved locally. It will not be requested again.</p>
        <input type="text" id="api-input" placeholder="Enter Gemini API Key..." style="width:350px; padding:10px; font-family:inherit; font-size:20px;">
        <button class="game-btn" onclick="saveApiKey()" style="margin-top:20px;">LINK CORE</button>
    </div>

    <div id="menu-overlay" class="hidden">
        <h1 style="color:var(--red); font-size: 60px;">PROTOCOL V15.5</h1>
        <div id="slot-container"></div>
    </div>

    <div id="battle-side">
        <div id="stat-ui">
            <span id="lv-txt">LV 1</span>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span>HP</span>
                <div id="hp-bar"><div id="hp-fill"></div></div>
                <span id="hp-txt">20/20</span>
            </div>
        </div>
        <div style="font-size:18px; color:#555; margin:5px;">SYNC: <span id="sync-txt" style="color:red">0</span>% | REGION: <span id="region-txt">RUINS</span></div>
        
        <div id="monster-sprite"></div>

        <div id="box">
            <div id="soul"></div>
            <div id="fight-ui">
                <div id="target-area"><div id="slider"></div></div>
            </div>
        </div>

        <div class="btn-grid">
            <button class="game-btn" id="b-FIGHT" onclick="handleBtn('FIGHT')">FIGHT</button>
            <button class="game-btn" id="b-ACT" onclick="handleBtn('ACT')">ACT</button>
            <button class="game-btn" id="b-ITEM" onclick="handleBtn('ITEM')">ITEM</button>
            <button class="game-btn" id="b-MERCY" onclick="handleBtn('MERCY')">MERCY</button>
        </div>
    </div>

    <div id="chat-side">
        <div id="log"></div>
        <input type="text" id="chat-input" placeholder="Initiate thought..." autocomplete="off">
    </div>
</div>

<script>
    const KEY = 'UT_DATA_V15_5';
    let storage = JSON.parse(localStorage.getItem(KEY)) || { slots: [null,null,null], apiKey: "" };
    let curSlot = null;

    // --- STATE & PHYSICS ---
    let lv=1, hp=20, maxHp=20, exp=0, sync=0, region='RUINS', defeated=[];
    // Mimicry Object: Chara learns from YOU
    let learning = { items: 0, blueDodge: 0, moveDistance: 0 }; 
    
    let turn='MENU', enemy=null, bullets=[], frame=0, turnFrames=0;
    let soulX=211, soulY=121, moving=false, soulColor='red', yVel=0;
    let sliderX=0, sliderDir=8, sliderFrames=0;
    const keys = {};

    // --- INITIALIZATION ---
    function saveApiKey() {
        const val = document.getElementById('api-input').value;
        if(val.startsWith("AIza")) { 
            storage.apiKey = val; 
            localStorage.setItem(KEY, JSON.stringify(storage)); 
            location.reload(); 
        }
    }

    if(!storage.apiKey) { 
        document.getElementById('api-overlay').classList.remove('hidden'); 
    } else { 
        document.getElementById('api-overlay').classList.add('hidden'); 
        document.getElementById('menu-overlay').classList.remove('hidden'); 
        initSlots(); 
    }

    function initSlots() {
        const container = document.getElementById('slot-container'); container.innerHTML = '';
        storage.slots.forEach((s, i) => {
            const div = document.createElement('div'); div.className = `slot ${s?'':'empty'}`;
            div.innerHTML = s ? `[${s.name}] LV ${s.lv} | ${s.region} | SYNC ${Math.floor(s.sync)}%` : `-- CREATE NEW TIMELINE --`;
            div.onclick = () => s ? loadSlot(i) : createSlot(i);
            container.appendChild(div);
        });
    }

    function createSlot(i) {
        let n = prompt("Name:"); if(!n) return;
        storage.slots[i] = { name: n, lv: 1, exp: 0, sync: 0, learning: {items:0, blueDodge:0, moveDistance:0}, region: 'RUINS', defeated: [] };
        saveAll(); initSlots();
    }

    function loadSlot(i) {
        curSlot = i; const s = storage.slots[i];
        lv=s.lv; exp=s.exp; sync=s.sync; region=s.region; defeated=s.defeated;
        learning = s.learning || {items:0, blueDodge:0, moveDistance:0};
        hp=20+(lv-1)*4; maxHp=hp;
        document.getElementById('menu-overlay').classList.add('hidden');
        updateStatsUI(); spawnEnemy(); requestAnimationFrame(mainLoop);
    }

    function saveAll() {
        if(curSlot !== null) storage.slots[curSlot] = { lv, exp, sync, learning, region, defeated, name: storage.slots[curSlot].name };
        localStorage.setItem(KEY, JSON.stringify(storage));
    }

    // --- INPUT ---
    window.onkeydown = e => { 
        keys[e.code] = true; 
        if((e.code==='KeyZ'||e.code==='Enter') && turn==='FIGHT_PLAYER') triggerHit();
    };
    window.onkeyup = e => keys[e.code] = false;

    // --- GAME ENGINE ---
    function mainLoop() {
        if(turn === 'SURVIVAL') runSurvival();
        if(turn === 'FIGHT_PLAYER' || turn === 'FIGHT_CHARA') runFightBar();
        frame++; requestAnimationFrame(mainLoop);
    }

    function spawnEnemy() {
        if(lv >= 7 && !defeated.includes("PAPYRUS")) {
            enemy = { n: "Papyrus", hp: 680, def: 0, exp: 0, art: "💀", boss: true, p: ['BONE_JUMP', 'BONE_RAIN', 'BLUE_BONE'] };
        } else if(lv === 2 && !defeated.includes("NAPSTABLOOK")) {
            enemy = { n: "Napstablook", hp: 88, def: 0, exp: 0, art: "👻", boss: true, p: ['TEARS', 'SINE_TEARS'] };
        } else if(lv === 3 && !defeated.includes("TORIEL")) {
            enemy = { n: "Toriel", hp: 440, def: 0, exp: 0, art: "🐐", boss: true, p: ['FIRE', 'FIRE_ARC'] };
        } else {
            const ruins = [
                {n:"Froggit", hp:20, def:4, exp:20, art:"🐸", p:['FROG','FLY']},
                {n:"Moldsmal", hp:15, def:0, exp:10, art:"🍮", p:['SINE_TEARS']}
            ];
            const snow = [
                {n:"Snowdrake", hp:48, def:2, exp:22, art:"🐦", p:['ICE']},
                {n:"Ice Cap", hp:48, def:2, exp:17, art:"👒", p:['ICE']}
            ];
            const pool = (region === 'SNOWDIN') ? snow : ruins;
            enemy = { ...pool[Math.floor(Math.random()*pool.length)] };
        }
        document.getElementById('monster-sprite').innerText = enemy.art;
        logMsg("System", `* ${enemy.n} appeared.`, "");
        decideTurn();
    }

    function decideTurn() {
        soulColor = (enemy.n === "Papyrus") ? 'blue' : 'red';
        document.getElementById('soul').style.background = (soulColor === 'blue') ? 'var(--blue)' : 'var(--red)';

        if(Math.random()*100 < sync) {
            turn = 'CHARA_TURN';
            document.getElementById('soul').style.background = "#fff";
            document.querySelectorAll('.game-btn').forEach(b => b.classList.add('chara-lock'));
            // CHARA LEARNED: Heal if HP is low and Player heals often
            setTimeout(() => { 
                if(hp < (maxHp * 0.4) && learning.items > 2) handleBtn('ITEM'); 
                else handleBtn('FIGHT'); 
            }, 800);
        } else {
            turn = 'PLAYER_TURN';
            document.querySelectorAll('.game-btn').forEach(b => { b.disabled = false; b.classList.remove('chara-lock'); });
        }
    }

    function handleBtn(a) {
        if(turn !== 'PLAYER_TURN' && turn !== 'CHARA_TURN') return;
        const isChara = (turn === 'CHARA_TURN');
        if(a === 'FIGHT') startFightBar(isChara);
        if(a === 'ITEM') { 
            hp = Math.min(maxHp, hp+15); 
            if(!isChara) learning.items++; 
            logMsg(isChara?"Chara":"You", "* Healed.", ""); 
            startSurvivalPhase(); 
        }
        if(a === 'MERCY') { logMsg("You", "* Spare.", ""); sync = Math.max(0, sync-5); spawnEnemy(); }
        if(a === 'ACT') { logMsg("You", "* Check.", ""); startSurvivalPhase(); }
    }

    function startFightBar(isChara) {
        turn = isChara ? 'FIGHT_CHARA' : 'FIGHT_PLAYER';
        sliderX = 0; sliderFrames = 0;
        document.getElementById('fight-ui').style.display = 'flex';
        document.querySelectorAll('.game-btn').forEach(b => b.disabled = true);
    }

    function runFightBar() {
        sliderX += sliderDir;
        sliderFrames++;
        if(sliderX > 370 || sliderX < 0) sliderDir *= -1;
        document.getElementById('slider').style.left = sliderX + 'px';
        if(turn === 'FIGHT_CHARA') {
            let dist = Math.abs(190 - sliderX);
            if(dist < 15 || sliderFrames > 360) triggerHit();
        }
    }

    function triggerHit() {
        const attacker = (turn === 'FIGHT_CHARA') ? 'Chara' : 'You';
        turn = 'ANIMATING';
        document.getElementById('fight-ui').style.display = 'none';
        let dist = Math.abs(190 - sliderX);
        let precision = Math.max(0.1, (1 - (dist / 190)));
        let dmg = (precision > 0.85) ? Math.floor((10 + (lv-1)*2 - enemy.def) * 1.5) : 2;
        enemy.hp -= dmg;
        const vfx = document.createElement('div'); vfx.className = 'slash-vfx';
        document.getElementById('monster-sprite').appendChild(vfx);
        logMsg(attacker, `* Dealt ${dmg} damage.`, attacker==='Chara'?'msg-chara':'msg-player');
        setTimeout(() => {
            vfx.remove();
            if(enemy.hp <= 0) handleVictory();
            else startSurvivalPhase();
        }, 600);
    }

    function handleVictory() {
        if(enemy.boss) {
            defeated.push(enemy.n.toUpperCase());
            if(enemy.n === "Toriel") { region = 'SNOWDIN'; lv = 4; }
            if(enemy.n === "Papyrus") { region = 'WATERFALL'; lv++; }
        }
        exp += enemy.exp; sync = Math.min(100, sync+2);
        if(exp >= lv*150) { lv++; logMsg("Chara", "* LV UP.", "msg-chara"); }
        saveAll(); updateStatsUI(); spawnEnemy();
    }

    // --- SURVIVAL & PHYSICS ---
    function startSurvivalPhase() { turn = 'SURVIVAL'; turnFrames = 380; bullets = []; }

    function runSurvival() {
        let isSynced = (turn === 'CHARA_TURN');
        document.getElementById('soul').style.background = isSynced ? "#fff" : (soulColor === 'blue' ? 'var(--blue)' : 'var(--red)');
        
        moving = false;
        let oldX = soulX, oldY = soulY;

        // BLUE SOUL GRAVITY
        if (soulColor === 'blue') {
            yVel += 0.4;
            soulY += yVel;
            if (soulY >= 242) { 
                soulY = 242; yVel = 0; 
                if ((keys['ArrowUp'] || keys['KeyW']) && !isSynced) { yVel = -8.5; moving = true; }
            } else { moving = true; }
        }

        if(isSynced) {
            // CHARA AI MIMICRY
            let near = null, d = 75;
            bullets.forEach(b => { let dst = Math.hypot(b.x-soulX, b.y-soulY); if(dst < d){ d=dst; near=b; }});
            if(near) {
                if(near.isBlue && learning.blueDodge > 3) {
                    moving = false; // Chara stands still for blue because you did!
                } else { 
                    moving = true; 
                    let evadeSpeed = (learning.moveDistance > 5000) ? 4.5 : 3.0; 
                    if(soulColor !== 'blue') soulY += (near.y > soulY ? -evadeSpeed : evadeSpeed);
                    soulX += (near.x > soulX ? -evadeSpeed : evadeSpeed); 
                    if(soulColor === 'blue' && soulY >= 242 && near.y > 200) yVel = -8.5; // Chara Jumps
                }
            }
        } else {
            // PLAYER CONTROL
            let s = keys['ShiftLeft'] ? 1.5 : 4;
            if(soulColor !== 'blue' && (keys['ArrowUp'] || keys['KeyW'])) { soulY -= s; moving = true; }
            if(soulColor !== 'blue' && (keys['ArrowDown'] || keys['KeyS'])) { soulY += s; moving = true; }
            if(keys['ArrowLeft'] || keys['KeyA']) { soulX -= s; moving = true; }
            if(keys['ArrowRight'] || keys['KeyD']) { soulX += s; moving = true; }
            if(moving) learning.moveDistance += Math.hypot(soulX - oldX, soulY - oldY);
        }

        soulX = Math.max(0, Math.min(422, soulX)); 
        soulY = Math.max(0, Math.min(242, soulY));
        document.getElementById('soul').style.left = soulX+'px'; document.getElementById('soul').style.top = soulY+'px';

        if(frame % 25 === 0) spawnProj();

        for(let i=bullets.length-1; i>=0; i--) {
            let b = bullets[i]; 
            if(b.isSine) { b.baseX = (b.baseX || b.x) + b.vx; b.x = b.baseX + Math.sin(frame * 0.1) * 20; }
            else { b.x += b.vx; }
            b.y += b.vy;
            b.el.style.left = b.x+'px'; b.el.style.top = b.y+'px';

            if(Math.hypot(b.x-soulX, b.y-soulY) < 14) {
                if(b.isBlue && !moving) { if(!isSynced) learning.blueDodge++; } 
                else if(b.isGreen) { hp = Math.min(maxHp, hp+2); b.el.remove(); bullets.splice(i,1); }
                else {
                    if(enemy.n === "Toriel" && hp <= 4) b.vx = (b.x > soulX ? 6 : -6);
                    else { hp -= 1; b.el.remove(); bullets.splice(i,1); updateStatsUI(); }
                }
                if(hp <= 0) { alert("ERASED."); location.reload(); }
            } else if(b.y > 280 || b.x > 460 || b.x < -40) { b.el.remove(); bullets.splice(i,1); }
        }
        turnFrames--; if(turnFrames <= 0) { bullets.forEach(b => b.el.remove()); decideTurn(); }
    }

    function spawnProj() {
        const p = enemy.p[Math.floor(Math.random()*enemy.p.length)];
        let x = Math.random()*440, y = -10, vx = 0, vy = 4.5, isG = false, isB = false, isSine = false;
        
        if(p === 'BONE_JUMP') { x = 440; y = 230; vx = -5; vy = 0; }
        if(p === 'BLUE_BONE') { x = -20; y = 230; vx = 6; vy = 0; isB = true; }
        if(p === 'SINE_TEARS') { isSine = true; vy = 3; }
        if(p === 'FIRE_ARC') { x = -10; y = 0; vx = 4; vy = 1.5; }

        const b = { x, y, vx, vy, isGreen: isG, isBlue: isB, isSine: isSine, el: document.createElement('div') };
        b.el.className = 'bullet'; 
        // Render BONES vs Projectiles
        if(p.includes('BONE')) { b.el.style.width = '12px'; b.el.style.height = '60px'; b.el.style.borderRadius = '4px'; }
        else { b.el.style.width = '16px'; b.el.style.height = '16px'; b.el.style.borderRadius = '50%'; }
        
        b.el.style.background = isG ? "var(--green)" : (isB ? "var(--blue)" : "#fff");
        document.getElementById('box').appendChild(b.el); bullets.push(b);
    }

    function updateStatsUI() {
        maxHp = 20 + (lv-1)*4;
        document.getElementById('lv-txt').innerText = `LV ${lv}`;
        document.getElementById('hp-txt').innerText = `${Math.ceil(hp)}/${maxHp}`;
        document.getElementById('hp-fill').style.width = (hp/maxHp)*100+"%";
        document.getElementById('sync-txt').innerText = Math.floor(sync);
        document.getElementById('region-txt').innerText = region;
    }

    async function talk(txt) {
        if(!storage.apiKey) return;
        const p = `You are Chara. LV ${lv}. Learning Stats: Item Use: ${learning.items}, Blue Dodge Skill: ${learning.blueDodge}. Reply to player in 1 sentence. JSON format: {"reply": "...", "controlMod": number}`;
        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${storage.apiKey}`, {
                method: 'POST', body: JSON.stringify({ contents: [{role: "user", parts: [{text: p + " User said: " + txt}]}], generationConfig: {responseMimeType: "application/json"} })
            });
            const d = await r.json(); const res = JSON.parse(d.candidates[0].content.parts[0].text);
            logMsg("Chara", res.reply, "msg-chara"); sync = Math.min(100, Math.max(0, sync + res.controlMod)); updateStatsUI();
        } catch(e) {}
    }

    document.getElementById('chat-input').onkeypress = e => { if(e.key === 'Enter'){ logMsg("You", e.target.value, "msg-player"); talk(e.target.value); e.target.value = ''; }};
    function logMsg(s, t, c) { const l = document.getElementById('log'); const d = document.createElement('div'); d.className = c; d.innerText = t; l.appendChild(d); l.scrollTop = l.scrollHeight; }
</script>
</body>
</html>
