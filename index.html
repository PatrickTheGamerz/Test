<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Undertale: Determination Protocol V20</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        :root { --red: #ff0000; --yellow: #ffff00; --white: #ffffff; --orange: #ffaa00; --green: #00ff00; --blue: #00a2ff; --cyan: #00ffff; --purple: #d535d5; --bg: #000; }
        
        body { background: var(--bg); color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'VT323', monospace; overflow: hidden; }
        #game { display: flex; width: 1100px; height: 750px; border: 4px solid #333; position: relative; box-shadow: 0 0 50px rgba(255,255,255,0.1); }

        /* Screens */
        #api-overlay, #menu-overlay { position: absolute; inset: 0; background: #000; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .slot { width: 400px; padding: 15px; border: 2px solid #fff; margin: 10px; cursor: pointer; background: #0a0a0a; font-size: 24px; text-align: center; }
        .slot:hover { border-color: var(--red); color: var(--red); }

        /* Battle side */
        #battle-side { width: 620px; border-right: 4px solid #222; display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }
        #monster-sprite { height: 180px; font-size: 100px; display: flex; align-items: center; justify-content: center; position: relative; }
        #box { width: 440px; height: 260px; border: 6px solid #fff; position: relative; overflow: hidden; margin: 15px 0; background: #000; }
        
        /* Soul Physics */
        #soul { 
            width: 18px; height: 18px; position: absolute; z-index: 100; 
            clip-path: path('M9 2.1C9 2.1 8.4 0 4.2 0 1.2 0 0 2.4 0 4.4 0 8.4 9 13.5 9 13.5S18 8.4 18 4.4C18 2.4 16.8 0 13.8 0 10.6 0 9 2.1 9 2.1Z'); 
        }
        .soul-player { background: var(--red); box-shadow: none; }
        .soul-chara { background: #000; box-shadow: inset 0 0 0 2px var(--red), 0 0 15px var(--red); }
        .soul-frisk { background: var(--red); box-shadow: 0 0 10px var(--white); }

        .bullet { position: absolute; border-radius: 2px; }

        /* UI */
        #stat-ui { width: 100%; display: flex; justify-content: space-between; font-size: 32px; }
        #hp-bar { width: 140px; height: 22px; background: var(--red); border: 2px solid #000; position: relative; }
        #hp-fill { height: 100%; background: var(--yellow); width: 100%; transition: width 0.2s; }
        
        #sync-bars { width: 100%; display: flex; gap: 5px; font-size: 14px; margin-top: 5px; color: #666; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .game-btn { background: #000; border: 3px solid var(--orange); color: var(--orange); font-family: inherit; font-size: 30px; padding: 10px; cursor: pointer; }
        .game-btn:disabled { opacity: 0.2; }

        /* Fight Bar */
        #fight-ui { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 500; }
        #target-area { width: 380px; height: 120px; border: 4px solid #fff; position: relative; background: url('https://raw.githubusercontent.com/FryingPan/undertale-fight-assets/master/images/target.png') center/cover; }
        #slider { width: 14px; height: 100%; background: #fff; position: absolute; left: 0; box-shadow: 0 0 10px #fff; }

        /* Chat Side */
        #chat-side { width: 480px; display: flex; flex-direction: column; background: #050505; border-left: 2px solid #222; }
        #log { flex-grow: 1; padding: 25px; overflow-y: auto; font-size: 22px; line-height: 1.4; color: #888; }
        .msg-chara { color: var(--red); border-left: 3px solid var(--red); padding-left: 12px; margin-bottom: 20px; font-style: italic; }
        .msg-player { color: #fff; opacity: 0.6; margin-bottom: 10px; align-self: flex-end; }
        #chat-input { background: #000; border: none; border-top: 2px solid #333; color: #fff; font-family: inherit; font-size: 24px; padding: 15px; outline: none; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game">
    <div id="api-overlay">
        <h1 style="color:var(--red); font-size: 45px;">DETERMINATION PROTOCOL V20</h1>
        <p>Linking to Gemini 2.5 Flash...</p>
        <input type="password" id="api-input" placeholder="Google AI API Key..." style="width:350px; padding:12px; font-family:inherit; background:#111; color:#fff; border:1px solid #444;">
        <button class="game-btn" onclick="saveApiKey()" style="margin-top:20px; width:180px;">ESTABLISH</button>
    </div>

    <div id="menu-overlay" class="hidden">
        <h1 style="color:var(--red); font-size: 50px;">LOAD TIMELINE</h1>
        <div id="slot-container"></div>
    </div>

    <div id="battle-side">
        <div id="stat-ui">
            <span id="lv-txt">LV 1</span>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span>HP</span>
                <div id="hp-bar"><div id="hp-fill"></div></div>
                <span id="hp-txt">20/20</span>
            </div>
        </div>
        <div id="sync-bars">
            PLAYER: <span id="s-p" style="color:white">0</span>% | FRISK: <span id="s-f" style="color:var(--cyan)">0</span>% | CHARA: <span id="s-c" style="color:var(--red)">0</span>%
        </div>
        
        <div id="monster-sprite"></div>

        <div id="box">
            <div id="soul"></div>
            <div id="fight-ui">
                <div id="target-area"><div id="slider"></div></div>
            </div>
        </div>

        <div class="btn-grid">
            <button class="game-btn" id="b-FIGHT" onclick="handleBtn('FIGHT')">FIGHT</button>
            <button class="game-btn" id="b-ACT" onclick="handleBtn('ACT')">ACT</button>
            <button class="game-btn" id="b-ITEM" onclick="handleBtn('ITEM')">ITEM</button>
            <button class="game-btn" id="b-MERCY" onclick="handleBtn('MERCY')">MERCY</button>
        </div>
    </div>

    <div id="chat-side">
        <div id="log"></div>
        <input type="text" id="chat-input" placeholder="Initiate thought..." autocomplete="off">
    </div>
</div>

<script>
    const KEY = 'UT_DATA_V20';
    let storage = JSON.parse(localStorage.getItem(KEY)) || { slots: [null,null,null], apiKey: "" };
    let curSlot = null;

    // --- STATE ---
    let lv=1, hp=20, maxHp=20, exp=0, region='RUINS', defeated=[];
    let syncs = { player: 100, frisk: 0, chara: 0, souls: {} };
    let neural = { accuracy: 10, patternMemory: 0 };
    let mode = 'NORMAL'; 
    
    let turn='MENU', enemy=null, bullets=[], frame=0, turnFrames=0;
    let soulX=211, soulY=121, yVel=0, dominantSoul = 'player';
    let sliderX=0, sliderDir=8, sliderFrames=0;
    
    const keys = {};

    function saveApiKey() {
        const val = document.getElementById('api-input').value;
        if(val.startsWith("AIza")) { storage.apiKey = val; localStorage.setItem(KEY, JSON.stringify(storage)); location.reload(); }
    }

    if(!storage.apiKey) { document.getElementById('api-overlay').classList.remove('hidden'); }
    else { document.getElementById('api-overlay').classList.add('hidden'); document.getElementById('menu-overlay').classList.remove('hidden'); initSlots(); }

    function initSlots() {
        const container = document.getElementById('slot-container'); container.innerHTML = '';
        storage.slots.forEach((s, i) => {
            const div = document.createElement('div'); div.className = 'slot';
            div.innerHTML = s ? `[${s.name}] LV ${s.lv}` : `-- EMPTY TIMELINE --`;
            div.onclick = () => s ? loadSlot(i) : createSlot(i);
            container.appendChild(div);
        });
    }

    function createSlot(i) {
        let n = prompt("Name:"); if(!n) return;
        let isFrisk = n.toUpperCase() === 'FRISK';
        let isSouls = n.toUpperCase() === 'SOULS';
        storage.slots[i] = { 
            name: n, lv: 1, exp: 0, region: 'RUINS', defeated: [],
            syncs: isFrisk ? {player: 80, frisk: 20, chara: 0} : 
                   isSouls ? {player: 40, chara: 10, souls: {justice:10, bravery:10, kindness:10, patience:10, integrity:10, perseverance:10}} :
                   {player: 100, chara: 0, frisk: 0},
            neural: { accuracy: 10, patternMemory: 0 }
        };
        saveAll(); initSlots();
    }

    function loadSlot(i) {
        curSlot = i; const s = storage.slots[i];
        lv=s.lv; exp=s.exp; region=s.region; defeated=s.defeated;
        syncs = s.syncs; neural = s.neural || { accuracy: 10, patternMemory: 0 };
        mode = s.name.toUpperCase() === 'FRISK' ? 'FRISK' : (s.name.toUpperCase() === 'SOULS' ? 'SOULS' : 'NORMAL');
        hp=20+(lv-1)*4; maxHp=hp;
        document.getElementById('menu-overlay').classList.add('hidden');
        updateStatsUI(); spawnEnemy(); requestAnimationFrame(mainLoop);
    }

    function saveAll() {
        if(curSlot !== null) storage.slots[curSlot] = { lv, exp, syncs, neural, region, defeated, name: storage.slots[curSlot].name };
        localStorage.setItem(KEY, JSON.stringify(storage));
    }

    window.onkeydown = e => keys[e.code] = true;
    window.onkeyup = e => keys[e.code] = false;

    function mainLoop() {
        if(turn === 'SURVIVAL') runSurvival();
        if(turn === 'FIGHT_PLAYER' || turn === 'FIGHT_CHARA') runFightBar();
        frame++; requestAnimationFrame(mainLoop);
    }

    function spawnEnemy() {
        // CLASSIC HARDCODED STATS
        if(lv >= 7 && !defeated.includes("PAPYRUS")) enemy = { n: "Papyrus", hp: 680, def: 0, exp: 0, art: "💀", p: ['BONE','BLUE'] };
        else if(lv === 2 && !defeated.includes("NAPSTABLOOK")) enemy = { n: "Napstablook", hp: 88, def: 0, exp: 0, art: "👻", p: ['TEAR'] };
        else if(lv === 3 && !defeated.includes("TORIEL")) enemy = { n: "Toriel", hp: 440, def: 0, exp: 0, art: "🐐", p: ['FIRE'] };
        else enemy = { n: "Froggit", hp: 30, def: 4, exp: 20, art: "🐸", p: ['FLY'] };
        
        document.getElementById('monster-sprite').innerText = enemy.art;
        turn = 'PLAYER_TURN';
        document.querySelectorAll('.game-btn').forEach(b => b.disabled = false);
    }

    function handleBtn(a) {
        if(turn !== 'PLAYER_TURN') return;
        if(a === 'FIGHT') {
            // Chara can hijack based on sync
            startFightBar(syncs.chara > 40 && Math.random() < 0.4);
        }
        if(a === 'ITEM') { hp = Math.min(maxHp, hp+15); startSurvivalPhase(); }
        if(a === 'MERCY' || a === 'ACT') startSurvivalPhase();
    }

    function startFightBar(isChara) {
        turn = isChara ? 'FIGHT_CHARA' : 'FIGHT_PLAYER';
        sliderX = 0; sliderFrames = 0;
        document.getElementById('fight-ui').style.display = 'flex';
        document.querySelectorAll('.game-btn').forEach(b => b.disabled = true);
    }

    function runFightBar() {
        sliderX += sliderDir; sliderFrames++;
        if(sliderX > 370 || sliderX < 0) sliderDir *= -1;
        document.getElementById('slider').style.left = sliderX + 'px';

        if(turn === 'FIGHT_CHARA') {
            let error = (100 - neural.accuracy) * 2;
            let target = 190 + (Math.random() * error - error/2);
            if(Math.abs(sliderX - target) < 10 || sliderFrames > 220) triggerHit();
        } else if(keys['KeyZ'] || keys['Enter']) {
            triggerHit();
        }
    }

    function triggerHit() {
        let isChara = (turn === 'FIGHT_CHARA');
        turn = 'ANIMATING';
        document.getElementById('fight-ui').style.display = 'none';
        
        let dist = Math.abs(190 - sliderX);
        let precision = Math.max(0.1, (1 - (dist / 190)));
        
        if(!isChara && precision > 0.85) neural.accuracy = Math.min(100, neural.accuracy + 2);

        // BALANCED CLASSIC DAMAGE
        let base = 10 + (lv-1)*2;
        let dmg = Math.floor(base * precision);
        enemy.hp -= dmg;
        logMsg("System", `* Dealt ${dmg} damage.`, "");
        
        setTimeout(() => { 
            if(enemy.hp <= 0) { defeated.push(enemy.n.toUpperCase()); logMsg("System", "* Victory.", ""); spawnEnemy(); }
            else startSurvivalPhase(); 
        }, 600);
    }

    function startSurvivalPhase() { turn = 'SURVIVAL'; turnFrames = 300; bullets = []; }

    function runSurvival() {
        // SELECT DOMINANT SOUL
        let pool = [];
        for(let k in syncs) { if(k !== 'souls') for(let i=0; i<syncs[k]; i++) pool.push(k); }
        if(mode === 'SOULS') for(let s in syncs.souls) for(let i=0; i<syncs.souls[s]; i++) pool.push(s);
        dominantSoul = pool[Math.floor(Math.random()*pool.length)] || 'player';
        
        const soul = document.getElementById('soul');
        soul.className = '';
        if(dominantSoul === 'chara') soul.classList.add('soul-chara');
        else if(dominantSoul === 'frisk') soul.classList.add('soul-frisk');
        else soul.classList.add('soul-player');

        // Apply Souls Colors
        const soulColors = {justice:'var(--yellow)', bravery:'var(--orange)', kindness:'var(--green)', patience:'var(--cyan)', integrity:'var(--blue)', perseverance:'var(--purple)'};
        if(soulColors[dominantSoul]) soul.style.background = soulColors[dominantSoul];
        else soul.style.background = '';

        // --- MOVEMENT ---
        let mx=0, my=0, s = keys['ShiftLeft'] ? 1.5 : 4;

        if(dominantSoul === 'player') {
            if(keys['ArrowUp'] || keys['KeyW']) my -= s;
            if(keys['ArrowDown'] || keys['KeyS']) my += s;
            if(keys['ArrowLeft'] || keys['KeyA']) mx -= s;
            if(keys['ArrowRight'] || keys['KeyD']) mx += s;
        } else {
            // NEURAL DODGING AI
            let near = null, d = 90;
            bullets.forEach(b => { let dst = Math.hypot(b.x-soulX, b.y-soulY); if(dst < d){ d=dst; near=b; }});
            if(near) {
                let force = (dominantSoul === 'chara') ? 5 : 3;
                mx += (near.x > soulX ? -force : force);
                my += (near.y > soulY ? -force : force);
            }
        }

        // Integrity/Papyrus Blue Soul Gravity
        if(dominantSoul === 'integrity' || (enemy.n === 'Papyrus' && dominantSoul === 'player')) {
            yVel += 0.4; my = yVel;
            if(soulY >= 242) { soulY = 242; yVel = 0; if((keys['ArrowUp'] || keys['KeyW']) && dominantSoul === 'player') yVel = -8.5; }
        }

        soulX += mx; soulY += my;
        soulX = Math.max(0, Math.min(422, soulX)); soulY = Math.max(0, Math.min(242, soulY));
        soul.style.left = soulX+'px'; soul.style.top = soulY+'px';

        if(frame % 30 === 0) spawnProj();

        for(let i=bullets.length-1; i>=0; i--) {
            let b = bullets[i]; b.x += b.vx; b.y += b.vy;
            b.el.style.left = b.x+'px'; b.el.style.top = b.y+'px';
            if(Math.hypot(b.x-soulX, b.y-soulY) < 14) {
                hp -= 1; b.el.remove(); bullets.splice(i,1); updateStatsUI();
                if(hp <= 0) { alert("ERASED."); location.reload(); }
            } else if(b.y > 300) { b.el.remove(); bullets.splice(i,1); }
        }
        turnFrames--; if(turnFrames <= 0) { bullets.forEach(b => b.el.remove()); turn = 'PLAYER_TURN'; saveAll(); }
    }

    function spawnProj() {
        const p = enemy.p[Math.floor(Math.random()*enemy.p.length)];
        let x = Math.random()*400, y = -20, vx = 0, vy = 5;
        if(p === 'BONE') { x = 440; y = 230; vx = -6; vy = 0; }
        const b = { x, y, vx, vy, el: document.createElement('div') };
        b.el.className = 'bullet'; b.el.style.width = p==='BONE'?'10px':'16px'; b.el.style.height = p==='BONE'?'60px':'16px';
        b.el.style.background = "#fff"; document.getElementById('box').appendChild(b.el); bullets.push(b);
    }

    function updateStatsUI() {
        document.getElementById('lv-txt').innerText = `LV ${lv}`;
        document.getElementById('hp-txt').innerText = `${hp}/${maxHp}`;
        document.getElementById('hp-fill').style.width = (hp/maxHp)*100+"%";
        document.getElementById('s-p').innerText = Math.floor(syncs.player || 0);
        document.getElementById('s-f').innerText = Math.floor(syncs.frisk || 0);
        document.getElementById('s-c').innerText = Math.floor(syncs.chara || 0);
    }

    // --- GEMINI 2.5 FLASH API NEURAL LINK ---
    async function talk(txt) {
        if(!storage.apiKey) return;
        const prompt = `You are Chara. Sync: Player ${syncs.player}%, Frisk ${syncs.frisk}%, Chara ${syncs.chara}%. Mode: ${mode}. Dominant Soul: ${dominantSoul}. 
        You are in a crowded mind. Acknowledge Frisk if they are present. Mention your growing combat accuracy (${neural.accuracy}%).
        Be cryptic. Output JSON only: {"reply": "...", "playerMod": number, "charaMod": number, "friskMod": number}`;

        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${storage.apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ role: "user", parts: [{ text: prompt + " User says: " + txt }] }],
                    generationConfig: { responseMimeType: "application/json" }
                })
            });
            const d = await r.json();
            const res = JSON.parse(d.candidates[0].content.parts[0].text);
            logMsg("Chara", res.reply, "msg-chara");
            syncs.player = Math.max(0, syncs.player + (res.playerMod || 0));
            syncs.chara = Math.min(100, syncs.chara + (res.charaMod || 0));
            syncs.frisk = Math.max(0, syncs.frisk + (res.friskMod || 0));
            updateStatsUI();
        } catch(e) { console.error("Neural Bridge Offline."); }
    }

    document.getElementById('chat-input').onkeypress = e => { if(e.key === 'Enter'){ logMsg("You", e.target.value, "msg-player"); talk(e.target.value); e.target.value = ''; }};
    function logMsg(s, t, c) { const l = document.getElementById('log'); const d = document.createElement('div'); d.className = c; d.innerText = t; l.appendChild(d); l.scrollTop = l.scrollHeight; }
</script>
</body>
</html>
