<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Undertale: Determination Protocol V11</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        :root { --red: #ff0000; --yellow: #ffff00; --white: #ffffff; --orange: #ffaa00; --green: #00ff00; --blue: #00a2ff; --bg: #000000; }
        body { background: var(--bg); color: var(--white); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'VT323', monospace; overflow: hidden; }
        #game-container { display: flex; width: 1100px; height: 750px; border: 4px solid #333; background: var(--bg); position: relative; box-shadow: 0 0 50px rgba(255,0,0,0.3); }

        /* Save Overlay */
        #menu-overlay { position: absolute; inset: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .save-slot { width: 480px; padding: 15px; border: 3px solid var(--white); margin: 10px; cursor: pointer; background: #080808; transition: 0.1s; }
        .save-slot:hover { border-color: var(--red); color: var(--red); transform: scale(1.02); }

        /* Combat Side */
        #battle-side { width: 620px; border-right: 4px solid #222; display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }
        #monster-sprite { height: 160px; font-size: 100px; display: flex; align-items: center; justify-content: center; }
        
        #battle-box { width: 440px; height: 260px; border: 6px solid var(--white); background: var(--bg); position: relative; overflow: hidden; margin: 15px 0; }
        #soul { width: 18px; height: 18px; position: absolute; background: var(--red); z-index: 100; clip-path: path('M9 2.1C9 2.1 8.4 0 4.2 0 1.2 0 0 2.4 0 4.4 0 8.4 9 13.5 9 13.5S18 8.4 18 4.4C18 2.4 16.8 0 13.8 0 10.6 0 9 2.1 9 2.1Z'); }
        .bullet { position: absolute; border-radius: 50%; }

        /* Interaction */
        #fight-ui { position: absolute; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 500; }
        #target-area { width: 380px; height: 120px; border: 4px solid var(--white); position: relative; background: url('https://raw.githubusercontent.com/FryingPan/undertale-fight-assets/master/images/target.png') center/cover; }
        #slider { width: 14px; height: 100%; background: #fff; position: absolute; left: 0; box-shadow: 0 0 15px #fff; }

        #stat-ui { width: 100%; display: flex; justify-content: space-between; font-size: 32px; }
        #hp-bar-bg { width: 140px; height: 22px; background: var(--red); border: 2px solid #000; }
        #hp-bar-fill { height: 100%; background: var(--yellow); transition: width 0.2s; }

        #action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .act-btn { background: #000; border: 3px solid var(--orange); color: var(--orange); font-family: inherit; font-size: 30px; padding: 10px; cursor: pointer; text-align: center; }
        .act-btn:disabled { opacity: 0.3; cursor: default; }

        /* Narrative Side */
        #chat-side { width: 480px; display: flex; flex-direction: column; background: #050505; border-left: 2px solid #222; }
        #chat-log { flex-grow: 1; padding: 25px; overflow-y: auto; font-size: 24px; color: var(--orange); }
        .msg-chara { color: var(--red); border-left: 3px solid var(--red); padding-left: 12px; margin-bottom: 20px; }
        .msg-player { color: var(--white); align-self: flex-end; opacity: 0.6; margin-bottom: 15px; }
        #chat-input { background: #000; border: none; border-top: 2px solid #333; color: var(--white); font-family: inherit; font-size: 26px; padding: 15px; outline: none; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="menu-overlay">
        <h1 style="color: var(--red); font-size: 60px;">PROTOCOL V11</h1>
        <div id="save-slots"></div>
        <button class="act-btn" onclick="setKey()" style="font-size: 20px; margin-top: 20px;">LINK API CORE</button>
    </div>

    <div id="battle-side">
        <div id="stat-ui">
            <span id="lv-val">LV 1</span>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span>HP</span>
                <div id="hp-bar-bg"><div id="hp-bar-fill"></div></div>
                <span id="hp-txt">20/20</span>
            </div>
        </div>
        
        <div style="width:100%; text-align:center; color: #666; font-size: 18px; margin: 5px 0;">
            DEF: <span id="p-def">10</span> | SYNC: <span id="sync-val" style="color:red">0</span>% | EXP: <span id="exp-val">0</span>
        </div>

        <div id="monster-sprite"></div>

        <div id="battle-box">
            <div id="soul"></div>
            <div id="fight-ui">
                <div id="target-area"><div id="slider"></div></div>
            </div>
        </div>

        <div id="action-grid">
            <button class="act-btn" id="btn-FIGHT" onclick="tryAct('FIGHT')">FIGHT</button>
            <button class="act-btn" id="btn-ACT" onclick="tryAct('ACT')">ACT</button>
            <button class="act-btn" id="btn-ITEM" onclick="tryAct('ITEM')">ITEM</button>
            <button class="act-btn" id="btn-MERCY" onclick="tryAct('MERCY')">MERCY</button>
        </div>
    </div>

    <div id="chat-side">
        <div id="chat-log"></div>
        <input type="text" id="chat-input" placeholder="Initiate thought..." autocomplete="off">
    </div>
</div>

<script>
    const STORAGE_KEY = 'CHARA_V11_STABLE';
    let appData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { slots: [null,null,null], apiKey: "" };
    let curIdx = null;

    // --- GAME DATA ---
    let lv = 1, hp = 20, maxHp = 20, exp = 0, sync = 0, learning = 0;
    let turn = 'MENU', region = 'RUINS', defeated = [];
    let enemy = null, bullets = [], frame = 0, turnFrames = 0;
    let soulPos = { x: 211, y: 121 };
    const keys = {};

    const MonsterTable = {
        RUINS: [
            { n: "Froggit", hp: 20, def: 4, exp: 20, art: "🐸", patterns: ['FLY', 'CURVE'] },
            { n: "Whimsun", hp: 10, def: 0, exp: 10, art: "🦋", patterns: ['DRIFT'] },
            { n: "Moldsmal", hp: 12, def: 0, exp: 3, art: "🍮", patterns: ['SINE'] },
            { n: "Vegetoid", hp: 20, def: 6, exp: 6, art: "🥕", patterns: ['VEGGIE', 'MORNING'] }
        ],
        SNOWDIN: [
            { n: "Snowdrake", hp: 48, def: 2, exp: 22, art: "🐦", patterns: ['ICE_SPIKE', 'SHARD'] },
            { n: "Ice Cap", hp: 48, def: 2, exp: 17, art: "👒", patterns: ['SNOWFLAKE', 'BOOMERANG'] },
            { n: "Lesser Dog", hp: 60, def: 0, exp: 18, art: "🐕", patterns: ['BONE_SWING', 'BONE_RAIN'] },
            { n: "Gyftrot", hp: 100, def: 2, exp: 50, art: "🦌", patterns: ['SNOWFLAKE'] }
        ]
    };

    const BossTable = {
        NAPSTABLOOK: { n: "Napstablook", hp: 88, def: 0, exp: 0, art: "👻", patterns: ['TEAR_RAIN', 'SIDE_TEARS', 'WAVY_TEARS'], boss: true },
        TORIEL: { n: "Toriel", hp: 440, def: 0, exp: 0, art: "🐐", patterns: ['FIRE_BALL', 'FIRE_WAVE', 'FIRE_SPIRAL'], boss: true },
        DOGGO: { n: "Doggo", hp: 30, def: 1, exp: 30, art: "🗡️", patterns: ['BLUE_SLASH'], boss: true },
        DOGAMY: { n: "Dogamy & Dogaressa", hp: 108, def: 5, exp: 40, art: "🪓", patterns: ['BLUE_WHITE_BONE'], boss: true }
    };

    function save() {
        if(curIdx !== null) appData.slots[curIdx] = { lv, hp, exp, sync, learning, region, defeated, name: appData.slots[curIdx].name };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    function initMenu() {
        const slots = document.getElementById('save-slots'); slots.innerHTML = '';
        appData.slots.forEach((s, i) => {
            const d = document.createElement('div');
            d.className = `save-slot ${s ? '' : 'empty'}`;
            d.innerHTML = s ? `[${s.name}] LV ${s.lv} | SYNC ${Math.floor(s.sync)}% | ${s.region}` : `-- NEW DATA --`;
            d.onclick = () => s ? loadSlot(i) : createSlot(i);
            slots.appendChild(d);
        });
    }

    function createSlot(i) {
        let n = prompt("Name:"); if(!n) return;
        appData.slots[i] = { name: n, lv: 1, hp: 20, exp: 0, sync: 0, learning: 0, region: 'RUINS', defeated: [] };
        save(); initMenu();
    }

    function loadSlot(i) {
        curIdx = i; const s = appData.slots[i];
        lv = s.lv; hp = 20; exp = s.exp; sync = s.sync; learning = s.learning || 0;
        region = s.region; defeated = s.defeated || [];
        document.getElementById('menu-overlay').classList.add('hidden');
        updateStats(); spawnEnemy();
        requestAnimationFrame(coreLoop);
    }

    function setKey() { let k = prompt("Gemini Key:"); if(k) { appData.apiKey = k; save(); } }

    window.onkeydown = e => {
        keys[e.code] = true;
        if((e.code === 'KeyZ' || e.code === 'Enter') && turn === 'FIGHT_MINI' && !document.getElementById('btn-FIGHT').disabled) {
            finalizeHit();
        }
    };
    window.onkeyup = e => keys[e.code] = false;

    function coreLoop() {
        if(turn === 'SURVIVAL') runDodge();
        if(turn === 'FIGHT_MINI') runFightBar();
        frame++; requestAnimationFrame(coreLoop);
    }

    function spawnEnemy() {
        if (lv === 2 && !defeated.includes("NAPSTABLOOK")) enemy = { ...BossTable.NAPSTABLOOK };
        else if (lv === 3 && !defeated.includes("TORIEL")) enemy = { ...BossTable.TORIEL };
        else if (lv === 4 && region === 'SNOWDIN' && !defeated.includes("DOGGO")) enemy = { ...BossTable.DOGGO };
        else {
            const pool = MonsterTable[region];
            enemy = { ...pool[Math.floor(Math.random()*pool.length)] };
        }
        document.getElementById('monster-sprite').innerText = enemy.art;
        logMsg("System", `* ${enemy.n} appeared.`, "");
        startTurnSelection();
    }

    function startTurnSelection() {
        if(Math.random()*100 < sync) {
            turn = 'CHARA';
            document.getElementById('soul').style.background = "var(--white)";
            document.querySelectorAll('.act-btn').forEach(b => b.disabled = true);
            setTimeout(() => { if(hp < 8) useHeal(); else startFightMini(); }, 1000);
        } else {
            turn = 'PLAYER';
            document.getElementById('soul').style.background = "var(--red)";
            document.querySelectorAll('.act-btn').forEach(b => b.disabled = false);
        }
    }

    function tryAct(a) {
        if(turn !== 'PLAYER') return;
        if(a === 'FIGHT') startFightMini();
        if(a === 'ITEM') useHeal();
        if(a === 'MERCY') { logMsg("You", "* Spare.", "msg-player"); sync -= 2; save(); spawnEnemy(); }
        if(a === 'ACT') { logMsg("You", "* Check.", "msg-player"); beginSurvival(); }
    }

    let sPos = 0, sDir = 7.5;
    function startFightMini() {
        turn = 'FIGHT_MINI'; sPos = 0;
        document.getElementById('fight-ui').style.display = 'flex';
        if(turn === 'CHARA') {
            // Chara's learning affects timing. Low learning = jittery.
            let jitter = 190 * (1 - (learning/100));
            let target = 190 + (Math.random() - 0.5) * jitter;
            setTimeout(() => { if(turn === 'FIGHT_MINI') { sPos = target; finalizeHit(); } }, 600);
        }
    }

    function runFightBar() {
        sPos += sDir; if(sPos > 365 || sPos < 0) sDir *= -1;
        document.getElementById('slider').style.left = sPos + 'px';
    }

    function finalizeHit() {
        document.getElementById('fight-ui').style.display = 'none';
        let dist = Math.abs(190 - sPos);
        let precision = Math.max(0.1, (1 - (dist / 190)));
        
        let baseAtk = 10 + (lv-1)*2;
        let finalDmg = 1;
        // LV 1 Cap Logic
        if(precision > 0.8) finalDmg = Math.floor(Math.max(1, (baseAtk - enemy.def)) * (precision * 1.5));
        let cap = 10 + (lv-1)*2;
        finalDmg = Math.min(cap, finalDmg);

        enemy.hp -= finalDmg;
        logMsg(turn==='CHARA'?'Chara':'You', `* Dealt ${finalDmg} damage.`, turn==='CHARA'?'msg-chara':'msg-player');
        
        if(enemy.hp <= 0) handleWin();
        else beginSurvival();
    }

    function handleWin() {
        if(enemy.boss) {
            defeated.push(enemy.n.toUpperCase());
            if(enemy.n === "Toriel") { lv = 4; region = "SNOWDIN"; logMsg("Chara", "* Snowing.", "msg-chara"); }
        }
        exp += enemy.exp; sync = Math.min(100, sync + 2); learning = Math.min(100, learning + 2);
        if(exp >= lv*150) { lv++; hp = maxHp = 20 + (lv-1)*4; logMsg("Chara", "* LV up.", "msg-chara"); }
        save(); updateStats(); spawnEnemy();
    }

    function beginSurvival() { turn = 'SURVIVAL'; turnFrames = 380; bullets = []; }

    function runDodge() {
        let isSynced = (sync >= 100) || (Math.random()*100 < sync);
        const sEl = document.getElementById('soul');
        sEl.style.background = isSynced ? "var(--white)" : "var(--red)";

        let moving = false;
        if(isSynced) {
            // CHARA AI Dodge Navigation
            let danger = null, d = 70 + (learning/2);
            bullets.forEach(b => { 
                let dist = Math.hypot(b.x-soulPos.x, b.y-soulPos.y); 
                if(dist < d){ d = dist; danger = b; }
            });
            if(danger) {
                if(danger.isBlue && learning > 50) { moving = false; } 
                else if(danger.isGreen && learning > 30 && hp < maxHp) { moving = true; soulPos.x += (danger.x > soulPos.x ? 2.5 : -2.5); soulPos.y += (danger.y > soulPos.y ? 2.5 : -2.5); }
                else { moving = true; soulPos.x += (danger.x > soulPos.x ? -3.5 : 3.5); soulPos.y += (danger.y > soulPos.y ? -3.5 : 3.5); }
            }
        } else {
            let s = keys['ShiftLeft'] ? 1.5 : 4;
            if(keys['ArrowUp'] || keys['KeyW']) { soulPos.y -= s; moving = true; }
            if(keys['ArrowDown'] || keys['KeyS']) { soulPos.y += s; moving = true; }
            if(keys['ArrowLeft'] || keys['KeyA']) { soulPos.x -= s; moving = true; }
            if(keys['ArrowRight'] || keys['KeyD']) { soulPos.x += s; moving = true; }
        }

        soulPos.x = Math.max(0, Math.min(422, soulPos.x));
        soulPos.y = Math.max(0, Math.min(242, soulPos.y));
        sEl.style.left = soulPos.x + 'px'; sEl.style.top = soulPos.y + 'px';

        // Attack Logic based on provided Monster Patterns
        if(frame % 20 === 0) {
            let p = enemy.patterns[Math.floor(Math.random()*enemy.patterns.length)];
            spawnPattern(p);
        }

        for(let i=bullets.length-1; i>=0; i--) {
            let b = bullets[i]; b.x += b.vx; b.y += b.vy;
            if(b.type === 'SINE') b.y += Math.sin(frame*0.1)*5;
            if(b.type === 'CURVE') { b.vx += (220 - b.x)*0.01; b.vy += 0.1; }

            b.el.style.left = b.x + 'px'; b.el.style.top = b.y + 'px';
            
            if(Math.hypot(b.x-soulPos.x, b.y-soulPos.y) < 15) {
                if(b.isBlue && !moving) { /* safe */ }
                else if(b.isGreen) { hp = Math.min(maxHp, hp + 2); b.el.remove(); bullets.splice(i,1); }
                else {
                    // Toriel Mercy Check
                    if(enemy.n === "Toriel" && hp < 10) { b.vx = (b.x > soulPos.x ? 5 : -5); }
                    else {
                        hp -= 1; b.el.remove(); bullets.splice(i,1);
                        if(hp <= 0) { alert("ERASED."); location.reload(); }
                    }
                }
            } else if(b.y > 280 || b.y < -30 || b.x > 460 || b.x < -30) { b.el.remove(); bullets.splice(i,1); }
        }

        turnFrames--; if(turnFrames <= 0) { bullets.forEach(b => b.el.remove()); startTurnSelection(); }
    }

    function spawnPattern(p) {
        if(p === 'FLY') spawnProj(Math.random()*440, -10, 0, 4.5, 'STRAIGHT');
        if(p === 'CURVE') spawnProj(Math.random()*440, -10, (Math.random()-0.5)*2, 2, 'CURVE');
        if(p === 'SINE') spawnProj(-10, 50+Math.random()*150, 4, 0, 'SINE');
        if(p === 'VEGGIE') spawnProj(Math.random()*440, -10, 0, 4+Math.random()*3, 'STRAIGHT', Math.random()<0.2);
        if(p === 'BLUE_SLASH') spawnProj(-10, soulPos.y, 7, 0, 'STRAIGHT', false, true);
        if(p === 'TEAR_RAIN') spawnProj(Math.random()*440, -10, 0, 3.5, 'STRAIGHT');
        if(p === 'FIRE_SPIRAL') { let a = frame*0.1; spawnProj(220+Math.cos(a)*150, 130+Math.sin(a)*150, -Math.cos(a)*3, -Math.sin(a)*3, 'STRAIGHT'); }
    }

    function spawnProj(x, y, vx, vy, type, isGreen=false, isBlue=false) {
        let b = { x, y, vx, vy, type, isGreen, isBlue, el: document.createElement('div') };
        b.el.className = 'bullet'; b.el.style.width = '16px'; b.el.style.height = '16px';
        if(isGreen) b.el.style.background = "var(--green)";
        else if(isBlue) b.el.style.background = "var(--blue)";
        else b.el.style.background = "var(--white)";
        document.getElementById('battle-box').appendChild(b.el); bullets.push(b);
    }

    function useHeal() { hp = Math.min(maxHp, hp + 15); logMsg("System", "* Heal.", "msg-player"); updateStats(); beginSurvival(); }

    function updateStats() {
        maxHp = 20 + (lv-1)*4;
        document.getElementById('lv-val').innerText = `LV ${lv}`;
        document.getElementById('hp-txt').innerText = `${Math.ceil(hp)}/${maxHp}`;
        document.getElementById('hp-bar-fill').style.width = (hp/maxHp)*100 + "%";
        document.getElementById('sync-val').innerText = Math.floor(sync);
        document.getElementById('exp-val').innerText = exp;
        document.getElementById('p-def').innerText = 10 + (lv-1);
    }

    async function talkAI(txt) {
        if(!appData.apiKey) return;
        const prompt = `You are Chara. LV ${lv}, Learning: ${learning}%, Region: ${region}. JSON: {"reply": "...", "controlMod": number}`;
        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${appData.apiKey}`, {
                method: 'POST', body: JSON.stringify({ contents: [{role: "user", parts: [{text: prompt}]}], generationConfig: {responseMimeType: "application/json"} })
            });
            const d = await r.json(); const res = JSON.parse(d.candidates[0].content.parts[0].text);
            logMsg("Chara", res.reply, "msg-chara"); sync = Math.min(100, Math.max(0, sync + res.controlMod)); updateStats();
        } catch(e) {}
    }

    document.getElementById('chat-input').onkeypress = e => { if(e.key === 'Enter'){ logMsg("You", e.target.value, "msg-player"); talkAI(e.target.value); e.target.value = ''; }};
    function logMsg(s, t, c) { const l = document.getElementById('chat-log'); const d = document.createElement('div'); d.className = c; d.innerText = t; l.appendChild(d); l.scrollTop = l.scrollHeight; }

    initMenu();
</script>
</body>
</html>
