<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Undertale: Determination Protocol V5</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        :root { --red: #ff0000; --yellow: #ffff00; --white: #ffffff; --orange: #ffaa00; --bg: #000000; }
        body { background: var(--bg); color: var(--white); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'VT323', monospace; overflow: hidden; }
        #game-container { display: flex; width: 1150px; height: 700px; border: 4px solid #333; background: var(--bg); position: relative; box-shadow: 0 0 50px rgba(255,0,0,0.15); }

        /* Saves */
        #menu-overlay { position: absolute; inset: 0; background: var(--bg); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .save-slot { width: 480px; padding: 20px; border: 3px solid var(--white); margin: 10px; cursor: pointer; background: #050505; position: relative; }
        .save-slot:hover { border-color: var(--red); transform: scale(1.02); }
        .del-btn { position: absolute; right: 15px; top: 15px; color: var(--red); border: 1px solid var(--red); padding: 2px 8px; }

        /* Left: Battle */
        #battle-side { width: 650px; border-right: 4px solid #222; display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }
        #enemy-sprite { height: 120px; display: flex; align-items: center; justify-content: center; font-size: 80px; margin-top: 10px; }
        #battle-box { width: 400px; height: 240px; border: 5px solid var(--white); background: var(--bg); position: relative; overflow: hidden; margin: 20px 0; }
        #soul { width: 16px; height: 16px; position: absolute; background: var(--red); z-index: 100; clip-path: path('M8 2.1C8 2.1 7.4 0 4.2 0 1.2 0 0 2.4 0 4.4 0 8.4 8 13.5 8 13.5S16 8.4 16 4.4C16 2.4 14.8 0 11.8 0 8.6 0 8 2.1 8 2.1Z'); }
        .bullet { position: absolute; background: var(--white); border-radius: 50%; }

        /* UI Elements */
        #stat-ui { width: 100%; display: flex; align-items: center; justify-content: space-between; font-size: 30px; margin-bottom: 5px; }
        #hp-bar-outer { width: 120px; height: 20px; background: var(--red); border: 2px solid #000; }
        #hp-bar-inner { height: 100%; background: var(--yellow); transition: width 0.3s; }
        #control-bar { width: 100%; height: 6px; background: #222; margin: 10px 0; border: 1px solid #444; }
        #control-fill { height: 100%; background: var(--red); box-shadow: 0 0 10px var(--red); }

        /* Buttons */
        #action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .act-btn { background: #000; border: 3px solid var(--orange); color: var(--orange); font-family: inherit; font-size: 28px; padding: 10px; cursor: pointer; text-align: center; }
        .act-btn:hover:not(:disabled) { background: var(--orange); color: #000; }
        .act-btn.hijacked { border-color: var(--red) !important; color: var(--red) !important; }

        /* Right: Chat */
        #chat-side { width: 500px; display: flex; flex-direction: column; background: #080808; }
        #chat-log { flex-grow: 1; padding: 25px; overflow-y: auto; font-size: 24px; color: var(--orange); border-bottom: 2px solid #222; }
        .msg-chara { color: var(--red); border-left: 4px solid var(--red); padding-left: 10px; margin-bottom: 15px; }
        .msg-player { color: var(--white); align-self: flex-end; opacity: 0.6; margin-bottom: 15px; }
        #chat-input { background: transparent; border: none; color: var(--white); font-family: inherit; font-size: 24px; padding: 15px; outline: none; }

        .hidden { display: none !important; }
        .shake { animation: shake 0.2s infinite; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } 100% { transform: translate(1px, -1px); } }
    </style>
</head>
<body>

<div id="game-container">
    <div id="menu-overlay">
        <h1 style="color: var(--red); font-size: 50px;">- SELECT TIMELINE -</h1>
        <div id="slot-list"></div>
        <button class="act-btn" onclick="configureAPI()" style="font-size: 18px; margin-top: 20px;">CONNECT AI ENGINE</button>
    </div>

    <div id="battle-side">
        <div id="stat-ui">
            <span id="lv-text">LV 1</span>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span>HP</span>
                <div id="hp-bar-outer"><div id="hp-bar-inner"></div></div>
                <span id="hp-text">20/20</span>
            </div>
        </div>

        <div id="control-ui" style="width: 100%; text-align: center;">
            <div style="color: var(--red); font-size: 18px;">VESSEL SYNCHRONIZATION: <span id="ctrl-num">0</span>%</div>
            <div id="control-bar"><div id="control-fill"></div></div>
        </div>

        <div id="enemy-sprite"></div>
        <div id="battle-box"><div id="soul"></div></div>

        <div id="action-grid">
            <button class="act-btn" id="btn-FIGHT" onclick="tryAction('FIGHT')">FIGHT</button>
            <button class="act-btn" id="btn-ACT" onclick="tryAction('ACT')">ACT</button>
            <button class="act-btn" id="btn-ITEM" onclick="tryAction('ITEM')">ITEM</button>
            <button class="act-btn" id="btn-MERCY" onclick="tryAction('MERCY')">MERCY</button>
        </div>
    </div>

    <div id="chat-side">
        <div id="chat-log"></div>
        <input type="text" id="chat-input" placeholder="Speak to them..." autocomplete="off">
    </div>
</div>

<script>
    // --- DATABASE & RPG LOGIC ---
    const DB_KEY = 'UT_CHARA_V5_STABLE';
    let appData = JSON.parse(localStorage.getItem(DB_KEY)) || { slots: [null, null, null], apiKey: "" };
    let curSlotIdx = null;

    const Monsters = {
        FROGGIT: { n: "Froggit", hp: 30, exp: 10, sprite: "🐸" },
        WHIMSUN: { n: "Whimsun", hp: 10, exp: 2, sprite: "🦋" },
        MOLDSMAL: { n: "Moldsmal", hp: 50, exp: 5, sprite: "🍮" },
        VEGETOID: { n: "Vegetoid", hp: 70, exp: 15, sprite: "🥕" }
    };

    let pLV = 1, pHP = 20, pMaxHP = 20, pEXP = 0, pControl = 0, pInv = ["Pie"];
    let curMonster = null;
    let state = 'MENU'; // MENU, PLAYER, ENEMY
    let bullets = [], frame = 0, turnTimer = 0;
    const soulPos = { x: 192, y: 112 };
    const keys = {};

    function save() {
        if (curSlotIdx !== null) {
            appData.slots[curSlotIdx] = { lv: pLV, hp: pHP, exp: pEXP, control: pControl, inv: pInv, name: appData.slots[curSlotIdx].name };
        }
        localStorage.setItem(DB_KEY, JSON.stringify(appData));
    }

    function updateStats() {
        pMaxHP = 20 + (pLV - 1) * 4;
        document.getElementById('lv-text').innerText = `LV ${pLV}`;
        document.getElementById('hp-text').innerText = `${Math.ceil(pHP)}/${pMaxHP}`;
        document.getElementById('hp-bar-inner').style.width = (pHP / pMaxHP) * 100 + "%";
        document.getElementById('ctrl-num').innerText = Math.floor(pControl);
        document.getElementById('control-fill').style.width = pControl + "%";
    }

    // --- MENUS ---
    function initMenu() {
        const list = document.getElementById('slot-list'); list.innerHTML = '';
        appData.slots.forEach((s, i) => {
            const d = document.createElement('div');
            d.className = `save-slot ${s ? '' : 'empty'}`;
            d.innerHTML = s ? `NAME: ${s.name} | LV: ${s.lv} | CTRL: ${Math.floor(s.control)}% <span class="del-btn" onclick="event.stopPropagation(); deleteSlot(${i})">ERASE</span>` : `[ EMPTY SLOT ]`;
            d.onclick = () => s ? startSlot(i) : createSlot(i);
            list.appendChild(d);
        });
    }

    function createSlot(i) {
        let n = prompt("Name the human:"); if (!n) return;
        appData.slots[i] = { name: n, lv: 1, hp: 20, exp: 0, control: 0, inv: ["Pie"] };
        save(); initMenu();
    }

    function deleteSlot(i) { if(confirm("Delete?")) { appData.slots[i] = null; save(); initMenu(); } }

    function startSlot(i) {
        curSlotIdx = i; const s = appData.slots[i];
        pLV = s.lv; pHP = s.hp; pEXP = s.exp; pControl = s.control; pInv = s.inv || ["Pie"];
        state = 'PLAYER'; document.getElementById('menu-overlay').classList.add('hidden');
        updateStats(); nextEncounter(); logMsg("Chara", `Greetings. I am ${s.name}.`, "msg-chara");
        requestAnimationFrame(gameLoop);
    }

    function configureAPI() { let k = prompt("API Key:"); if(k) { appData.apiKey = k; save(); } }

    // --- BATTLE ENGINE ---
    window.onkeydown = e => keys[e.code] = true;
    window.onkeyup = e => keys[e.code] = false;

    function nextEncounter() {
        const keys = Object.keys(Monsters);
        curMonster = { ...Monsters[keys[Math.floor(Math.random()*keys.length)]] };
        document.getElementById('enemy-sprite').innerText = curMonster.sprite;
        logMsg("System", `* ${curMonster.n} draws near.`, "");
        state = 'PLAYER';
    }

    function gameLoop() {
        if (state === 'ENEMY') {
            updateSoul();
            updateBullets();
            turnTimer--; if (turnTimer <= 0) endTurn();
        }
        frame++; requestAnimationFrame(gameLoop);
    }

    function updateSoul() {
        // CHARA CONTROL MATH: Chance to hijack every frame is pControl/100
        let hijacked = (pControl >= 100) || (Math.random() < pControl/100);
        const soulEl = document.getElementById('soul');
        soulEl.style.background = hijacked ? varColor('--white') : varColor('--red');

        if (hijacked) {
            // Chara Dodge AI
            let near = null, minDist = 60;
            bullets.forEach(b => {
                let d = Math.hypot(b.x - soulPos.x, b.y - soulPos.y);
                if(d < minDist) { minDist = d; near = b; }
            });
            if (near) {
                if(near.x > soulPos.x) soulPos.x -= 3; else soulPos.x += 3;
                if(near.y > soulPos.y) soulPos.y -= 3; else soulPos.y += 3;
            }
        } else {
            let s = 3.5;
            if(keys['ArrowUp'] || keys['KeyW']) soulPos.y -= s;
            if(keys['ArrowDown'] || keys['KeyS']) soulPos.y += s;
            if(keys['ArrowLeft'] || keys['KeyA']) soulPos.x -= s;
            if(keys['ArrowRight'] || keys['KeyD']) soulPos.x += s;
        }
        soulPos.x = Math.max(0, Math.min(384, soulPos.x));
        soulPos.y = Math.max(0, Math.min(224, soulPos.y));
        soulEl.style.left = soulPos.x + 'px'; soulEl.style.top = soulPos.y + 'px';
    }

    function tryAction(act) {
        if (state !== 'PLAYER') return;
        
        // CHARA OVERRIDE: Chance to force a FIGHT even if you click something else
        if (pControl > 30 && Math.random() < pControl/100 && act !== 'FIGHT') {
            logMsg("Chara", "* No. We are doing this my way.", "msg-chara");
            act = 'FIGHT';
        }

        if (act === 'FIGHT') {
            curMonster.hp -= (pLV * 10);
            logMsg("You", `* You dealt ${pLV*10} damage to ${curMonster.n}.`, "msg-player");
            if (curMonster.hp <= 0) {
                logMsg("System", `* You won! Gained ${curMonster.exp} EXP.`, "");
                pEXP += curMonster.exp;
                if(pEXP >= pLV * 20) { pLV++; logMsg("Chara", "* LV UP. Determination increases.", "msg-chara"); }
                pControl += 5; save(); nextEncounter(); return;
            }
        } else if (act === 'MERCY') {
            logMsg("You", "* You spared the enemy.", "msg-player");
            pControl -= 3; save(); nextEncounter(); return;
        } else if (act === 'ITEM') {
            pHP = Math.min(pMaxHP, pHP + 15);
            logMsg("You", "* You ate the Pie.", "msg-player");
        }
        
        startEnemyTurn();
    }

    function startEnemyTurn() {
        state = 'ENEMY'; turnTimer = 300; bullets = [];
        document.querySelectorAll('.act-btn').forEach(b => b.disabled = true);
        
        let intv = setInterval(() => {
            if (state !== 'ENEMY') { clearInterval(intv); return; }
            // Monster Specific Patterns
            if (curMonster.n === 'Froggit') spawnBullet(Math.random()*400, -10, (Math.random()-0.5)*2, 4);
            if (curMonster.n === 'Whimsun') spawnBullet(200, 120, Math.cos(frame)*4, Math.sin(frame)*4);
            if (curMonster.n === 'Vegetoid') spawnBullet(Math.random()*400, 240, 0, -5);
            if (curMonster.n === 'Moldsmal') spawnBullet(-10, Math.random()*240, 3, (Math.random()-0.5)*2);
        }, 150);
        setTimeout(() => clearInterval(intv), 4500);
    }

    function spawnBullet(x, y, vx, vy) {
        let b = { x, y, vx, vy, el: document.createElement('div') };
        b.el.className = 'bullet'; b.el.style.width = '12px'; b.el.style.height = '12px';
        document.getElementById('battle-box').appendChild(b.el); bullets.push(b);
    }

    function updateBullets() {
        for(let i=bullets.length-1; i>=0; i--) {
            let b = bullets[i]; b.x += b.vx; b.y += b.vy;
            b.el.style.left = b.x + 'px'; b.el.style.top = b.y + 'px';
            if (Math.hypot(b.x - soulPos.x, b.y - soulPos.y) < 14) {
                pHP -= 1; updateStats(); b.el.remove(); bullets.splice(i, 1);
                if(pHP <= 0) { alert("DEAD."); pHP = 20; save(); location.reload(); }
            } else if (b.x < -20 || b.x > 420 || b.y < -20 || b.y > 260) {
                b.el.remove(); bullets.splice(i, 1);
            }
        }
    }

    function endTurn() {
        state = 'PLAYER'; bullets.forEach(b => b.el.remove()); bullets = [];
        document.querySelectorAll('.act-btn').forEach(b => b.disabled = false);
        updateStats(); save();
    }

    // --- CHAT & AI ---
    async function talkAI(txt) {
        if (!appData.apiKey) return;
        const prompt = `You are Chara. LV: ${pLV}, Control: ${pControl}%. Reply to: "${txt}". JSON ONLY: {"reply": "...", "controlMod": number}`;
        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${appData.apiKey}`, {
                method: 'POST', body: JSON.stringify({ contents: [{role: "user", parts: [{text: prompt}]}], generationConfig: {responseMimeType: "application/json"} })
            });
            const d = await r.json(); const res = JSON.parse(d.candidates[0].content.parts[0].text);
            logMsg("Chara", res.reply, "msg-chara"); pControl = Math.min(100, Math.max(0, pControl + res.controlMod)); updateStats();
        } catch(e) {}
    }

    document.getElementById('chat-input').onkeypress = e => { if(e.key === 'Enter') { let v = e.target.value; logMsg("You", v, "msg-player"); e.target.value = ''; talkAI(v); } }

    function logMsg(s, t, c) {
        const l = document.getElementById('chat-log'); const d = document.createElement('div');
        d.className = c; d.innerText = t; l.appendChild(d); l.scrollTop = l.scrollHeight;
    }

    function varColor(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
    initMenu();
</script>
</body>
</html>
