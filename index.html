<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 2.5 Flash Storyteller</title>
    <style>
        :root {
            --primary: #10b981; /* Emerald green for Gemini */
            --primary-hover: #059669;
            --bg: #111827;
            --box-bg: #1f2937;
            --text: #f3f4f6;
            --border: #374151;
        }
        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            background: var(--box-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 700px;
            width: 100%;
            border: 1px solid var(--border);
        }
        h1 { margin-top: 0; color: #6ee7b7; text-align: center; font-family: 'Segoe UI', sans-serif;}
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .field { margin-bottom: 20px; }
        .field.full { grid-column: span 2; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #9ca3af; font-family: 'Segoe UI', sans-serif;}
        input, textarea, select {
            width: 100%;
            padding: 14px;
            background: #111827;
            color: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            font-family: 'Segoe UI', sans-serif;
        }
        input:focus, textarea:focus, select:focus { outline: 2px solid var(--primary); }
        button {
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-family: 'Segoe UI', sans-serif;
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #4b5563; cursor: not-allowed; }
        #output-container {
            margin-top: 30px;
            display: none;
        }
        #output {
            padding: 30px;
            background: #111827;
            border: 1px solid var(--border);
            border-radius: 8px;
            line-height: 1.8;
            font-size: 18px;
            white-space: pre-wrap;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
            color: #9ca3af;
        }
        .error { color: #f87171; margin-top: 10px; font-size: 14px; text-align: center; font-family: 'Segoe UI', sans-serif;}
        
        .cursor::after {
            content: '▌';
            animation: blink 1s step-start infinite;
            color: var(--primary);
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ Gemini 2.5 Flash Storyteller</h1>
    
    <div class="grid">
        <div class="field full">
            <label for="apiKey">Google AI Studio API Key:</label>
            <input type="password" id="apiKey" placeholder="AIza...">
        </div>

        <div class="field">
            <label for="genre">Genre:</label>
            <select id="genre">
                <option value="Fantasy">Fantasy</option>
                <option value="Sci-Fi">Sci-Fi</option>
                <option value="Mystery">Mystery</option>
                <option value="Cyberpunk">Cyberpunk</option>
                <option value="Romance">Romance</option>
                <option value="Historical Fiction">Historical Fiction</option>
            </select>
        </div>

        <div class="field">
            <label for="tone">Tone:</label>
            <select id="tone">
                <option value="Dark and Gritty">Dark & Gritty</option>
                <option value="Whimsical and Light">Whimsical & Light</option>
                <option value="Suspenseful">Suspenseful</option>
                <option value="Melancholic">Melancholic</option>
                <option value="Action-Packed">Action-Packed</option>
            </select>
        </div>

        <div class="field full">
            <label for="prompt">Story Idea / Core Concept:</label>
            <textarea id="prompt" rows="3" placeholder="e.g. A space smuggler realizes their ship's AI has fallen in love with them..."></textarea>
        </div>
    </div>

    <button id="generateBtn">Write My Story</button>
    <div id="errorMsg" class="error"></div>

    <div id="output-container">
        <div id="output"></div>
        <div class="stats">
            <span id="wordCount">0 words</span>
            <span>Gemini 2.5 Flash</span>
        </div>
    </div>
</div>

<script>
    const generateBtn = document.getElementById('generateBtn');
    const outputContainer = document.getElementById('output-container');
    const output = document.getElementById('output');
    const errorMsg = document.getElementById('errorMsg');
    const wordCountSpan = document.getElementById('wordCount');

    generateBtn.addEventListener('click', async () => {
        const apiKey = document.getElementById('apiKey').value.trim();
        const prompt = document.getElementById('prompt').value.trim();
        const genre = document.getElementById('genre').value;
        const tone = document.getElementById('tone').value;

        if (!apiKey || !prompt) {
            errorMsg.innerText = "Please provide both your Gemini API key and a story idea.";
            return;
        }

        // Prepare UI
        generateBtn.disabled = true;
        generateBtn.innerText = "Writing...";
        outputContainer.style.display = "block";
        output.innerHTML = '<span class="cursor"></span>'; 
        wordCountSpan.innerText = "0 words";
        errorMsg.innerText = "";

        const systemPrompt = `You are an elite, award-winning author. Write a highly engaging story. 
        Rules:
        1. Emphasize "Show, Don't Tell". Use vivid sensory details (sight, sound, smell).
        2. Create compelling, realistic dialogue.
        3. Pacing is crucial: build tension and deliver a satisfying arc.
        4. No cliché openings. Start *in media res* (in the middle of the action).`;

        const userPrompt = `Write a ${genre} story with a ${tone} tone. The core concept is: ${prompt}`;

        // Gemini 2.5 Flash Endpoint
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:streamGenerateContent?alt=sse&key=${apiKey}`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    systemInstruction: {
                        parts: [{ text: systemPrompt }]
                    },
                    contents: [{
                        role: "user",
                        parts: [{ text: userPrompt }]
                    }],
                    generationConfig: {
                        temperature: 0.8
                    }
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || "Google API Connection Failed.");
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let storyText = "";
            let buffer = ""; // This buffer prevents the stream from crashing on incomplete chunks!

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                // Add new chunk to the buffer
                buffer += decoder.decode(value, { stream: true });
                
                // Split buffer by new lines
                const lines = buffer.split("\n");
                
                // Keep the last line in the buffer (it might be incomplete)
                buffer = lines.pop();

                for (const line of lines) {
                    if (line.startsWith("data: ")) {
                        const dataStr = line.substring(6).trim();
                        if (!dataStr) continue;
                        
                        try {
                            const parsed = JSON.parse(dataStr);
                            const textPart = parsed.candidates?.[0]?.content?.parts?.[0]?.text;
                            if (textPart) {
                                storyText += textPart;
                                output.innerHTML = storyText + '<span class="cursor"></span>';
                                
                                // Update live word count
                                const words = storyText.trim().split(/\s+/).filter(w => w.length > 0).length;
                                wordCountSpan.innerText = words + " words";
                            }
                        } catch (e) {
                            // Silently ignore incomplete JSON blocks that sneak through
                        }
                    }
                }
            }
            
            output.innerHTML = storyText; // Remove cursor at the end

        } catch (err) {
            errorMsg.innerText = "Error: " + err.message;
            outputContainer.style.display = "none";
        } finally {
            generateBtn.disabled = false;
            generateBtn.innerText = "Write Another Story";
        }
    });
</script>

</body>
</html>
