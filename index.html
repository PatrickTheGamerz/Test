<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro AI Storyteller</title>
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --bg: #0f172a;
            --box-bg: #1e293b;
            --text: #f8fafc;
            --border: #334155;
        }
        body {
            font-family: 'Georgia', serif; /* Better font for reading stories */
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            background: var(--box-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 700px;
            width: 100%;
            border: 1px solid var(--border);
        }
        h1 { margin-top: 0; color: #c4b5fd; text-align: center; font-family: 'Segoe UI', sans-serif;}
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .field { margin-bottom: 20px; }
        .field.full { grid-column: span 2; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #94a3b8; font-family: 'Segoe UI', sans-serif;}
        input, textarea, select {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            color: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            font-family: 'Segoe UI', sans-serif;
        }
        input:focus, textarea:focus, select:focus { outline: 2px solid var(--primary); }
        button {
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-family: 'Segoe UI', sans-serif;
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #475569; cursor: not-allowed; }
        #output {
            margin-top: 30px;
            padding: 30px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            line-height: 1.8;
            font-size: 18px;
            white-space: pre-wrap;
            display: none;
        }
        .error { color: #f87171; margin-top: 10px; font-size: 14px; text-align: center; font-family: 'Segoe UI', sans-serif;}
        
        /* Blinking cursor effect for typing */
        .cursor::after {
            content: '▌';
            animation: blink 1s step-start infinite;
            color: var(--primary);
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <h1>🖋️ Master Storyteller</h1>
    
    <div class="grid">
        <div class="field full">
            <label for="apiKey">OpenAI API Key:</label>
            <input type="password" id="apiKey" placeholder="sk-...">
        </div>

        <div class="field">
            <label for="genre">Genre:</label>
            <select id="genre">
                <option value="Fantasy">Fantasy</option>
                <option value="Sci-Fi">Sci-Fi</option>
                <option value="Mystery">Mystery</option>
                <option value="Horror">Horror</option>
                <option value="Romance">Romance</option>
                <option value="Literary Fiction">Literary Fiction</option>
            </select>
        </div>

        <div class="field">
            <label for="tone">Tone:</label>
            <select id="tone">
                <option value="Dark and Gritty">Dark & Gritty</option>
                <option value="Whimsical and Light">Whimsical & Light</option>
                <option value="Suspenseful">Suspenseful</option>
                <option value="Melancholic">Melancholic</option>
                <option value="Action-Packed">Action-Packed</option>
            </select>
        </div>

        <div class="field full">
            <label for="prompt">Story Idea / Core Concept:</label>
            <textarea id="prompt" rows="3" placeholder="e.g. A detective who can only solve crimes by tasting the evidence..."></textarea>
        </div>
    </div>

    <button id="generateBtn">Write My Story</button>
    <div id="errorMsg" class="error"></div>

    <div id="output"></div>
</div>

<script>
    const generateBtn = document.getElementById('generateBtn');
    const output = document.getElementById('output');
    const errorMsg = document.getElementById('errorMsg');

    generateBtn.addEventListener('click', async () => {
        const apiKey = document.getElementById('apiKey').value.trim();
        const prompt = document.getElementById('prompt').value.trim();
        const genre = document.getElementById('genre').value;
        const tone = document.getElementById('tone').value;

        if (!apiKey || !prompt) {
            errorMsg.innerText = "Please provide both an API key and a story idea.";
            return;
        }

        // Prepare UI
        generateBtn.disabled = true;
        generateBtn.innerText = "Writing...";
        output.style.display = "block";
        output.innerHTML = '<span class="cursor"></span>'; 
        errorMsg.innerText = "";

        // The Master Storyteller Prompt
        const systemPrompt = `You are an elite, award-winning author. Write a highly engaging story. 
        Rules:
        1. Emphasize "Show, Don't Tell". Use vivid sensory details (sight, sound, smell).
        2. Create compelling, realistic dialogue.
        3. Pacing is crucial: build tension and deliver a satisfying arc.
        4. No cliché openings (e.g., "Once upon a time", "In a world"). Start *in media res* (in the middle of the action).`;

        const userPrompt = `Write a ${genre} story with a ${tone} tone. The core concept is: ${prompt}`;

        try {
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "gpt-4o", // Using the best model
                    stream: true,    // This makes the text generate in real-time
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: userPrompt }
                    ],
                    temperature: 0.8, // Slightly higher for more creativity
                    max_tokens: 2000 // Ensure it has room to write a full story
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || "API Connection Failed.");
            }

            // Real-time Streaming Logic
            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let storyText = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                const lines = chunk.split("\n");

                for (const line of lines) {
                    if (line.startsWith("data: ") && line !== "data: [DONE]") {
                        try {
                            const parsed = JSON.parse(line.substring(6));
                            const content = parsed.choices[0].delta.content;
                            if (content) {
                                storyText += content;
                                // Update screen and keep the blinking cursor
                                output.innerHTML = storyText + '<span class="cursor"></span>';
                            }
                        } catch (e) {
                            console.error("Stream parsing error", e);
                        }
                    }
                }
            }
            
            // Remove cursor when finished
            output.innerHTML = storyText;

        } catch (err) {
            errorMsg.innerText = "Error: " + err.message;
            output.style.display = "none";
        } finally {
            generateBtn.disabled = false;
            generateBtn.innerText = "Write Another Story";
        }
    });
</script>

</body>
</html>
