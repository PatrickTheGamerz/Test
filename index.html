<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Story Architect</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #f8fafc;
            --text: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }
        h1 { margin-top: 0; color: var(--primary); }
        .field { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box; /* Important for width */
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #output {
            margin-top: 30px;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 8px;
            line-height: 1.6;
            white-space: pre-wrap; /* Keeps story formatting */
            display: none;
        }
        .error { color: #ef4444; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ Story Architect</h1>
    
    <div class="field">
        <label for="apiKey">OpenAI API Key:</label>
        <input type="password" id="apiKey" placeholder="sk-...">
    </div>

    <div class="field">
        <label for="prompt">What's the story about?</label>
        <textarea id="prompt" rows="3" placeholder="e.g. A robot who discovers how to paint feelings..."></textarea>
    </div>

    <button id="generateBtn">Write My Story</button>
    <div id="errorMsg" class="error"></div>

    <div id="output"></div>
</div>

<script>
    const generateBtn = document.getElementById('generateBtn');
    const output = document.getElementById('output');
    const errorMsg = document.getElementById('errorMsg');

    generateBtn.addEventListener('click', async () => {
        const apiKey = document.getElementById('apiKey').value.trim();
        const userPrompt = document.getElementById('prompt').value.trim();

        // Simple validation
        if (!apiKey || !userPrompt) {
            alert("Please provide both an API key and a story prompt!");
            return;
        }

        // Setup UI for loading
        generateBtn.disabled = true;
        generateBtn.innerText = "Consulting the Muse...";
        output.style.display = "none";
        errorMsg.innerText = "";

        try {
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "gpt-4o-mini", // Cost-effective and fast
                    messages: [
                        { role: "system", content: "You are a creative storyteller. Write a short, engaging story based on the user's prompt." },
                        { role: "user", content: userPrompt }
                    ],
                    temperature: 0.7
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || "Something went wrong.");
            }

            // Display the result
            const story = data.choices[0].message.content;
            output.innerText = story;
            output.style.display = "block";

        } catch (err) {
            errorMsg.innerText = "Error: " + err.message;
        } finally {
            generateBtn.disabled = false;
            generateBtn.innerText = "Write My Story";
        }
    });
</script>

</body>
</html>
