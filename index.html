<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Undertale: Determination Protocol V7</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        :root { --red: #ff0000; --yellow: #ffff00; --white: #ffffff; --orange: #ffaa00; --bg: #000000; }
        body { background: var(--bg); color: var(--white); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'VT323', monospace; overflow: hidden; }
        
        #game-container { display: flex; width: 1100px; height: 720px; border: 4px solid #333; background: var(--bg); position: relative; box-shadow: 0 0 50px rgba(255,0,0,0.1); }

        /* Save Menu */
        #menu-overlay { position: absolute; inset: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .save-slot { width: 450px; padding: 20px; border: 3px solid var(--white); margin: 10px; cursor: pointer; background: #080808; transition: 0.2s; }
        .save-slot:hover { border-color: var(--red); transform: scale(1.02); }

        /* Battle Side */
        #battle-side { width: 620px; border-right: 4px solid #222; display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }
        #monster-sprite { height: 150px; font-size: 100px; display: flex; align-items: center; }
        
        #battle-box { width: 420px; height: 260px; border: 6px solid var(--white); background: var(--bg); position: relative; overflow: hidden; margin: 15px 0; }
        #soul { width: 18px; height: 18px; position: absolute; background: var(--red); z-index: 100; clip-path: path('M9 2.1C9 2.1 8.4 0 4.2 0 1.2 0 0 2.4 0 4.4 0 8.4 9 13.5 9 13.5S18 8.4 18 4.4C18 2.4 16.8 0 13.8 0 10.6 0 9 2.1 9 2.1Z'); }
        .bullet { position: absolute; background: var(--white); border-radius: 50%; }

        /* Fight Bar Minigame */
        #fight-bar-container { position: absolute; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 150; }
        #fight-target { width: 380px; height: 100px; border: 4px solid var(--white); position: relative; background: url('https://raw.githubusercontent.com/FryingPan/undertale-fight-assets/master/images/target.png') center/cover; }
        #fight-slider { width: 10px; height: 100%; background: #00ffff; position: absolute; left: 0; box-shadow: 0 0 10px #00ffff; }

        /* Stats */
        #stat-ui { width: 100%; display: flex; justify-content: space-between; font-size: 30px; }
        #hp-bar-outer { width: 140px; height: 22px; background: var(--red); border: 2px solid #000; }
        #hp-bar-inner { height: 100%; background: var(--yellow); transition: width 0.2s; }

        #action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .act-btn { background: #000; border: 3px solid var(--orange); color: var(--orange); font-family: inherit; font-size: 30px; padding: 10px; cursor: pointer; text-align: center; }
        .act-btn:hover:not(:disabled) { background: var(--orange); color: #000; }
        .act-btn:disabled { border-color: #333; color: #333; }
        .hijacked { border-color: var(--red) !important; color: var(--red) !important; }

        /* Chat */
        #chat-side { width: 480px; display: flex; flex-direction: column; background: #050505; border-left: 2px solid #222; }
        #chat-log { flex-grow: 1; padding: 25px; overflow-y: auto; font-size: 24px; color: var(--orange); }
        .msg-chara { color: var(--red); border-left: 3px solid var(--red); padding-left: 12px; margin-bottom: 20px; }
        .msg-player { color: var(--white); align-self: flex-end; opacity: 0.6; margin-bottom: 15px; }
        #chat-input { background: #000; border: none; border-top: 2px solid #333; color: var(--white); font-family: inherit; font-size: 26px; padding: 15px; outline: none; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="menu-overlay">
        <h1 style="color: var(--red); font-size: 55px;">DETERMINATION PROTOCOL V7</h1>
        <div id="slots"></div>
        <button class="act-btn" onclick="setAPI()" style="font-size: 18px; margin-top: 20px;">LINK GEMINI API</button>
    </div>

    <div id="battle-side">
        <div id="stat-ui">
            <span id="lv-disp">LV 1</span>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span>HP</span>
                <div id="hp-bar-outer"><div id="hp-bar-inner"></div></div>
                <span id="hp-txt">20/20</span>
            </div>
        </div>
        
        <div style="width:100%; text-align:center; color: var(--red); margin: 5px 0;">
            SYNC: <span id="sync-val">0</span>% | WEAPON: STICK | ARMOR: BANDAGE
        </div>

        <div id="monster-sprite"></div>

        <div id="battle-box">
            <div id="soul"></div>
            <div id="fight-bar-container">
                <div id="fight-target"><div id="fight-slider"></div></div>
            </div>
        </div>

        <div id="action-grid">
            <button class="act-btn" id="btn-FIGHT" onclick="handleBtn('FIGHT')">FIGHT</button>
            <button class="act-btn" id="btn-ACT" onclick="handleBtn('ACT')">ACT</button>
            <button class="act-btn" id="btn-ITEM" onclick="handleBtn('ITEM')">ITEM</button>
            <button class="act-btn" id="btn-MERCY" onclick="handleBtn('MERCY')">MERCY</button>
        </div>
    </div>

    <div id="chat-side">
        <div id="chat-log"></div>
        <input type="text" id="chat-input" placeholder="Initiate thought..." autocomplete="off">
    </div>
</div>

<script>
    // --- PERSISTENCE ---
    const DB_KEY = 'UT_PROTOCOL_V7';
    let appData = JSON.parse(localStorage.getItem(DB_KEY)) || { slots: [null,null,null], apiKey: "" };
    let curSlot = null;

    // --- GAME STATE ---
    let lv = 1, hp = 20, maxHp = 20, exp = 0, sync = 0, inv = ["Pie"];
    let turn = 'MENU'; // MENU, PLAYER, FIGHT_MINI, SURVIVAL
    let enemy = null, bullets = [], frame = 0, turnFrames = 0;
    const soulPos = { x: 201, y: 121 };
    const keys = {};

    const Monsters = [
        { n: "Froggit", hp: 30, exp: 10, art: "🐸" },
        { n: "Whimsun", hp: 15, exp: 5, art: "🦋" },
        { n: "Moldsmal", hp: 50, exp: 8, art: "🍮" }
    ];

    // --- ENGINE ---
    function setAPI() { let k = prompt("Gemini API Key:"); if(k) { appData.apiKey = k; save(); } }
    function save() {
        if(curSlot !== null) appData.slots[curSlot] = { lv, hp, exp, sync, inv, name: appData.slots[curSlot].name };
        localStorage.setItem(DB_KEY, JSON.stringify(appData));
    }

    function initMenu() {
        const slots = document.getElementById('slots'); slots.innerHTML = '';
        appData.slots.forEach((s, i) => {
            const d = document.createElement('div');
            d.className = `save-slot ${s ? '' : 'empty'}`;
            d.innerHTML = s ? `[ ${s.name} ] - LV ${s.lv} - SYNC ${Math.floor(s.sync)}%` : `-- EMPTY --`;
            d.onclick = () => s ? startSlot(i) : createSlot(i);
            slots.appendChild(d);
        });
    }

    function createSlot(i) {
        let n = prompt("Name:"); if(!n) return;
        appData.slots[i] = { name: n, lv: 1, hp: 20, exp: 0, sync: 0, inv: ["Pie"] };
        save(); initMenu();
    }

    function startSlot(i) {
        curSlot = i; const s = appData.slots[i];
        lv = s.lv; hp = s.hp; exp = s.exp; sync = s.sync; inv = s.inv || ["Pie"];
        document.getElementById('menu-overlay').classList.add('hidden');
        refreshUI(); spawnEnemy();
        requestAnimationFrame(mainLoop);
    }

    // --- BATTLE LOGIC ---
    window.onkeydown = e => { 
        keys[e.code] = true; 
        if((e.code === 'KeyZ' || e.code === 'Enter') && turn === 'FIGHT_MINI') stopFightBar();
    };
    window.onkeyup = e => keys[e.code] = false;

    function mainLoop() {
        if(turn === 'SURVIVAL') updateSurvival();
        if(turn === 'FIGHT_MINI') updateFightBar();
        frame++; requestAnimationFrame(mainLoop);
    }

    function spawnEnemy() {
        enemy = { ...Monsters[Math.floor(Math.random()*Monsters.length)] };
        document.getElementById('monster-sprite').innerText = enemy.art;
        logMsg("System", `* ${enemy.n} drew near.`, "");
        startPlayerTurn();
    }

    function startPlayerTurn() {
        if(Math.random()*100 < sync) {
            hijackTurn();
        } else {
            turn = 'PLAYER';
            document.querySelectorAll('.act-btn').forEach(b => { b.disabled = false; b.classList.remove('hijacked'); });
            document.getElementById('soul').style.background = "var(--red)";
        }
    }

    function hijackTurn() {
        turn = 'CHARA';
        document.querySelectorAll('.act-btn').forEach(b => { b.disabled = true; b.classList.add('hijacked'); });
        document.getElementById('soul').style.background = "var(--white)";
        setTimeout(() => {
            if(hp < 8) useItem(); else startFightMini();
        }, 1000);
    }

    function handleBtn(act) {
        if(turn !== 'PLAYER') return;
        if(act === 'FIGHT') startFightMini();
        if(act === 'MERCY') { logMsg("You", "* You chose mercy.", "msg-player"); sync -= 4; save(); spawnEnemy(); }
        if(act === 'ITEM') useItem();
        if(act === 'ACT') { logMsg("You", "* You studied the enemy.", "msg-player"); startSurvival(); }
    }

    // --- FIGHT MINIGAME ---
    let sliderPos = 0, sliderDir = 5;
    function startFightMini() {
        turn = 'FIGHT_MINI';
        sliderPos = 0;
        document.getElementById('fight-bar-container').style.display = 'flex';
        // If Chara is in control, she stops the bar automatically
        if(turn === 'CHARA' || sync >= 100) {
            setTimeout(() => stopFightBar(), 400 + Math.random()*200);
        }
    }

    function updateFightBar() {
        sliderPos += sliderDir;
        if(sliderPos > 370 || sliderPos < 0) sliderDir *= -1;
        document.getElementById('fight-slider').style.left = sliderPos + 'px';
    }

    function stopFightBar() {
        document.getElementById('fight-bar-container').style.display = 'none';
        // Center is 190. Calculate precision.
        let dist = Math.abs(190 - sliderPos);
        let multiplier = Math.max(0.1, (1 - (dist / 190)) * 4);
        
        let baseAt = 10 + (lv-1) * 2;
        let dmg = Math.floor(baseAt * multiplier);
        
        enemy.hp -= dmg;
        logMsg(turn === 'CHARA' ? "Chara" : "You", `* Dealt ${dmg} damage with the Stick.`, turn === 'CHARA' ? "msg-chara" : "msg-player");
        
        if(enemy.hp <= 0) {
            exp += enemy.exp; sync = Math.min(100, sync + 10);
            if(exp >= lv*20) { lv++; hp = maxHp = 20 + (lv-1)*4; }
            save(); refreshUI(); spawnEnemy();
        } else {
            startSurvival();
        }
    }

    function startSurvival() {
        turn = 'SURVIVAL'; turnFrames = 400; bullets = [];
        document.querySelectorAll('.act-btn').forEach(b => b.disabled = true);
    }

    function updateSurvival() {
        let charaTakingWheel = (sync >= 100) || (Math.random()*100 < sync);
        const sEl = document.getElementById('soul');
        sEl.style.background = charaTakingWheel ? "var(--white)" : "var(--red)";

        if(charaTakingWheel) {
            // Chara AI Dodge
            let near = null, d = 60;
            bullets.forEach(b => { let dist = Math.hypot(b.x-soulPos.x, b.y-soulPos.y); if(dist < d){ d = dist; near = b; }});
            if(near) {
                if(near.x > soulPos.x) soulPos.x -= 3; else soulPos.x += 3;
                if(near.y > soulPos.y) soulPos.y -= 3; else soulPos.y += 3;
            }
        } else {
            let s = keys['ShiftLeft'] ? 1.5 : 3.5;
            if(keys['ArrowUp'] || keys['KeyW']) soulPos.y -= s;
            if(keys['ArrowDown'] || keys['KeyS']) soulPos.y += s;
            if(keys['ArrowLeft'] || keys['KeyA']) soulPos.x -= s;
            if(keys['ArrowRight'] || keys['KeyD']) soulPos.x += s;
        }

        soulPos.x = Math.max(0, Math.min(402, soulPos.x));
        soulPos.y = Math.max(0, Math.min(242, soulPos.y));
        sEl.style.left = soulPos.x + 'px'; sEl.style.top = soulPos.y + 'px';

        if(frame % 25 === 0) spawnBullet(Math.random()*400, -10, (Math.random()-0.5)*2, 4);

        for(let i=bullets.length-1; i>=0; i--) {
            let b = bullets[i]; b.x += b.vx; b.y += b.vy;
            b.el.style.left = b.x + 'px'; b.el.style.top = b.y + 'px';
            if(Math.hypot(b.x-soulPos.x, b.y-soulPos.y) < 14) {
                hp -= 1; b.el.remove(); bullets.splice(i,1); refreshUI();
                if(hp <= 0) { alert("Game Over."); location.reload(); }
            } else if(b.y > 280) { b.el.remove(); bullets.splice(i,1); }
        }

        turnFrames--;
        if(turnFrames <= 0) { bullets.forEach(b => b.el.remove()); startPlayerTurn(); }
    }

    function spawnBullet(x, y, vx, vy) {
        let b = { x, y, vx, vy, el: document.createElement('div') };
        b.el.className = 'bullet'; b.el.style.width = '12px'; b.el.style.height = '12px';
        document.getElementById('battle-box').appendChild(b.el); bullets.push(b);
    }

    function useItem() {
        if(inv.length > 0) { inv.pop(); hp = Math.min(maxHp, hp + 20); refreshUI(); startSurvival(); }
    }

    function refreshUI() {
        document.getElementById('lv-disp').innerText = `LV ${lv}`;
        document.getElementById('hp-txt').innerText = `${Math.ceil(hp)}/${maxHp}`;
        document.getElementById('hp-bar-inner').style.width = (hp/maxHp)*100 + "%";
        document.getElementById('sync-val').innerText = Math.floor(sync);
        document.getElementById('control-fill'); // Placeholder
    }

    // --- AI ---
    async function talkAI(txt) {
        if(!appData.apiKey) return;
        const prompt = `You are Chara from Undertale. You are the Narrator and the voice of the player's choices. You are cold, logical, and observant. 
        Stats: LV ${lv}, Weapon: Stick. Current Player Message: "${txt}". JSON ONLY: {"reply": "...", "controlMod": number}`;
        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${appData.apiKey}`, {
                method: 'POST', body: JSON.stringify({ contents: [{role: "user", parts: [{text: prompt}]}], generationConfig: {responseMimeType: "application/json"} })
            });
            const d = await r.json(); const res = JSON.parse(d.candidates[0].content.parts[0].text);
            logMsg("Chara", res.reply, "msg-chara"); sync = Math.min(100, Math.max(0, sync + res.controlMod)); refreshUI();
        } catch(e) {}
    }

    document.getElementById('chat-input').onkeypress = e => { if(e.key === 'Enter'){ logMsg("You", e.target.value, "msg-player"); talkAI(e.target.value); e.target.value = ''; }};
    function logMsg(s, t, c) { const l = document.getElementById('chat-log'); const d = document.createElement('div'); d.className = c; d.innerText = t; l.appendChild(d); l.scrollTop = l.scrollHeight; }

    initMenu();
</script>
</body>
</html>
