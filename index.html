<!DOCTYPE html>
<html>
<head>
    <title>Flappy Ultra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body oncontextmenu="return false;"> <div id="custom-cursor"></div>

    <div id="game-container">
        <div id="score-display" style="position:absolute; width:100%; text-align:center; top:40px; font-size:60px; font-weight:900; color:white; text-shadow:4px 4px 0 #000; z-index:50;">0</div>

        <div id="menu-gui" class="gui-panel">
            <h1 style="margin-top:0;">FLAPPY ULTRA</h1>
            <button onclick="changeState('playing')">START ENGINE</button>
            <button onclick="toggleGUI('skins-gui')">HANGAR (SKINS)</button>
            <button onclick="toggleGUI('ach-gui')">MEDALS</button>
        </div>

        <div id="skins-gui" class="gui-panel" style="display:none;">
            <h3>SELECT SKIN</h3>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button onclick="selectSkin('skin-default')">Yellow</button>
                <button id="btn-phantom" style="opacity:0.3" onclick="selectSkin('skin-phantom')">Phantom (Score 20)</button>
                <button id="btn-neon" style="opacity:0.3" onclick="selectSkin('skin-neon')">Neon (Score 50)</button>
            </div>
            <button style="background:#95a5a6; box-shadow: 0 5px 0 #7f8c8d;" onclick="toggleGUI('menu-gui')">BACK</button>
        </div>

        <div id="ach-gui" class="gui-panel" style="display:none;">
            <h3>ACHIEVEMENTS</h3>
            <div id="ach-list">
                <div id="ach0" class="achievement-card"><b>Pilot:</b> Score 10 pts</div>
                <div id="ach1" class="achievement-card"><b>Ghost:</b> Score 20 pts (Unlocks Phantom)</div>
                <div id="ach2" class="achievement-card"><b>God:</b> Score 50 pts (Unlocks Neon)</div>
            </div>
            <button onclick="toggleGUI('menu-gui')">BACK</button>
        </div>

        <div id="bird" class="skin-default"></div>
        <div id="world"></div>
    </div>

    <script>
        const bird = document.getElementById('bird');
        const world = document.getElementById('world');
        const cursor = document.getElementById('custom-cursor');
        
        // ENGINE VARS
        let state = 'menu';
        let birdY = 300, velocity = 0, gravity = 0.45;
        let score = 0, pipes = [], frame = 0;
        let pipeFrequency = 110; // High number = More distance between pipes
        let unlocked = { phantom: false, neon: false };

        // CURSOR FOLLOW
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        function changeState(s) {
            state = s;
            document.querySelectorAll('.gui-panel').forEach(g => g.style.display = 'none');
            if (s === 'menu') toggleGUI('menu-gui');
            if (s === 'playing') {
                resetEngine();
                requestAnimationFrame(loop);
            }
        }

        function toggleGUI(id) {
            document.querySelectorAll('.gui-panel').forEach(g => g.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        function resetEngine() {
            birdY = 300; velocity = 0; score = 0; pipes = []; frame = 0;
            world.innerHTML = '';
            document.getElementById('score-display').innerText = '0';
        }

        function selectSkin(s) {
            if (s === 'skin-phantom' && !unlocked.phantom) return;
            if (s === 'skin-neon' && !unlocked.neon) return;
            bird.className = s;
            changeState('menu');
        }

        function spawnPipe() {
            const gap = 160;
            const topH = Math.random() * 250 + 80;
            const type = Math.random() > 0.85 ? 'pipe-lava' : 'pipe-standard';
            
            const p = { 
                x: 500, th: topH, bh: 650 - topH - gap, 
                type: type, passed: false,
                divT: document.createElement('div'),
                divB: document.createElement('div')
            };

            p.divT.className = `pipe ${type}`;
            p.divT.style.height = p.th + 'px';
            p.divT.innerHTML = '<div class="pipe-cap" style="bottom:-5px"></div>';

            p.divB.className = `pipe ${type}`;
            p.divB.style.height = p.bh + 'px';
            p.divB.style.bottom = '0';
            p.divB.innerHTML = '<div class="pipe-cap" style="top:-5px"></div>';

            world.appendChild(p.divT);
            world.appendChild(p.divB);
            pipes.push(p);
        }

        function loop() {
            if (state !== 'playing') return;

            frame++;
            velocity += gravity;
            birdY += velocity;
            bird.style.top = birdY + 'px';
            bird.style.transform = `rotate(${Math.min(velocity * 3, 45)}deg)`;

            if (frame % pipeFrequency === 0) spawnPipe();

            pipes.forEach((p, i) => {
                p.x -= (p.type === 'pipe-lava' ? 5 : 3.5);
                p.divT.style.left = p.x + 'px';
                p.divB.style.left = p.x + 'px';

                // PIXEL-PERFECT COLLISION
                const b = bird.getBoundingClientRect();
                const pt = p.divT.getBoundingClientRect();
                const pb = p.divB.getBoundingClientRect();

                // Narrow hitboxes by 5px for fairness
                if (b.right-5 > pt.left && b.left+5 < pt.right) {
                    if (b.top+5 < pt.bottom || b.bottom-5 > pb.top) changeState('menu');
                }

                if (p.x < 30 && !p.passed) {
                    p.passed = true;
                    score++;
                    document.getElementById('score-display').innerText = score;
                    handleAchievements();
                }
            });

            if (pipes.length > 0 && pipes[0].x < -100) {
                pipes[0].divT.remove(); pipes[0].divB.remove();
                pipes.shift();
            }

            if (birdY > 630 || birdY < -20) changeState('menu');
            requestAnimationFrame(loop);
        }

        function handleAchievements() {
            if (score >= 10) document.getElementById('ach0').classList.add('ach-unlocked');
            if (score >= 20) {
                document.getElementById('ach1').classList.add('ach-unlocked');
                unlocked.phantom = true;
                document.getElementById('btn-phantom').style.opacity = '1';
            }
            if (score >= 50) {
                document.getElementById('ach2').classList.add('ach-unlocked');
                unlocked.neon = true;
                document.getElementById('btn-neon').style.opacity = '1';
            }
        }

        const flap = () => { if(state === 'playing') velocity = -8; };
        window.addEventListener('keydown', e => { if(e.code === 'Space') flap(); });
        window.addEventListener('mousedown', flap);

    </script>
</body>
</html>
