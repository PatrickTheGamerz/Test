<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undertale: Advanced Gulp Engine</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body { background: #000; color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'VT323', monospace; user-select: none; }
        #game { width: 800px; height: 600px; border: 4px solid #fff; display: flex; flex-direction: column; position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
        #screen { flex-grow: 1; position: relative; background: #050505; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; image-rendering: pixelated; }
        #ui { height: 220px; border-top: 4px solid #fff; padding: 20px; box-sizing: border-box; background: #000; position: relative; z-index: 10; display: flex; }
        #text-box { flex-grow: 1; padding-right: 20px; }
        .text { font-size: 26px; line-height: 1.2; }
        .speaker { font-size: 32px; color: #ffea00; margin-bottom: 5px; text-transform: uppercase; }
        #choices { display: flex; flex-direction: column; gap: 8px; min-width: 250px; }
        button { background: #000; color: #fff; border: 2px solid #fff; font-family: inherit; font-size: 24px; padding: 5px 15px; cursor: pointer; text-align: left; transition: 0.2s; }
        button:hover { background: #fff; color: #000; padding-left: 25px; }
        .hidden { display: none !important; }
        #map-menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 20; padding: 40px; box-sizing: border-box; }
        .map-btn { font-size: 30px; margin: 10px 0; width: 300px; display: block; }
        #juice-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: rgba(0, 255, 0, 0.5); z-index: 5; transition: height 0.5s; pointer-events: none;}
        #stats { position: absolute; top: 10px; left: 10px; font-size: 24px; color: #aaa; z-index: 10; }
    </style>
</head>
<body>

<div id="game">
    <div id="screen">
        <div id="stats">HP: <span id="hp-val">20</span>/20</div>
        <canvas id="c" width="800" height="380"></canvas>
        <div id="juice-overlay"></div>
    </div>
    
    <div id="ui">
        <div id="text-box">
            <div id="speaker" class="speaker">System</div>
            <div id="text" class="text"></div>
        </div>
        <div id="choices"></div>
    </div>

    <div id="map-menu" class="hidden">
        <h1 style="color:#ffea00; font-size: 40px; margin-top: 0;">SELECT REGION</h1>
        <button class="map-btn" onclick="explore('RUINS')">THE RUINS</button>
        <button class="map-btn" onclick="explore('SNOWDIN')">SNOWDIN FOREST</button>
        <button class="map-btn" onclick="explore('WATERFALL')">WATERFALL</button>
        <button class="map-btn" onclick="explore('HOTLAND')">HOTLAND</button>
    </div>
</div>

<script>
    const ctx = document.getElementById('c').getContext('2d');
    let frame = 0, state = 'MENU', currentMob = null;
    let juiceLevel = 0, escapeProgress = 0, playerHp = 20;
    let gulletTimer = 0;

    // --- MONSTER DATABASE (Multi-Region) ---
    const database = {
        // RUINS
        "Froggit": {
            reg: "RUINS", 
            draw: (w) => { ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(400, 220+w, 40, 0, Math.PI*2); ctx.fill(); },
            text: "* Froggit hops closer.",
            gulletTime: 60, gulletColor: '#2a1a2a', // Quick fall
            stomachBg: '#1a2a1a', stomachJuice: 'rgba(0, 255, 0, 0.6)', juiceSpeed: 4,
            stomachIntro: "* You are inside Froggit.\n* It's cramped and smells like flies.",
            options: [
                { label: "Struggle (Uses Energy)", action: () => tryEscape(15, 2) },
                { label: "Tickle the walls", action: () => tryEscape(30, 0) }
            ]
        },
        "Toriel": {
            reg: "RUINS", 
            draw: (w) => { ctx.fillStyle='#fff'; ctx.fillRect(360, 150+w, 80, 120); ctx.beginPath(); ctx.arc(400, 130+w, 40, 0, Math.PI*2); ctx.fill(); },
            text: "* Toriel looks at you with a hungry gaze.",
            gulletTime: 120, gulletColor: '#5a002a', // Medium fall
            stomachBg: '#2a0015', stomachJuice: 'rgba(255, 68, 0, 0.7)', juiceSpeed: 5,
            stomachIntro: "* You are in Toriel's stomach.\n* Fire magic burns around you.\n* It smells like butterscotch.",
            options: [
                { label: "Swim through fire acid", action: () => tryEscape(20, 5) },
                { label: "Wait for her to let you out", action: () => takeDamage(99) } // Bad choice!
            ]
        },
        // SNOWDIN
        "Lesser Dog": {
            reg: "SNOWDIN", 
            draw: (w) => { ctx.fillStyle='#fff'; ctx.fillRect(370, 220+w, 60, 60); ctx.fillRect(380, 50+Math.abs(w)*3, 40, 170-Math.abs(w)*3); ctx.beginPath(); ctx.arc(400, 50+Math.abs(w)*3, 30, 0, Math.PI*2); ctx.fill(); },
            text: "* Lesser Dog is overstimulated.",
            gulletTime: 400, gulletColor: '#331a00', // MASSIVE FALL TIME due to long neck!
            stomachBg: '#221100', stomachJuice: 'rgba(150, 100, 50, 0.6)', juiceSpeed: 3,
            stomachIntro: "* You finally hit the bottom.\n* You are buried in chewed-up bones and slobber.",
            options: [
                { label: "Pet the stomach lining", action: () => tryEscape(40, 0) },
                { label: "Throw a stick", action: () => tryEscape(100, 0) } // Instant escape
            ]
        },
        "Papyrus": {
            reg: "SNOWDIN", 
            draw: (w) => { ctx.fillStyle='#fff'; ctx.fillRect(380, 100+w, 40, 40); ctx.fillRect(360, 150+w, 80, 100); ctx.fillStyle='#f00'; ctx.fillRect(350, 140+w, 100, 20); },
            text: "* Papyrus prepares a culinary capture!",
            gulletTime: 90, gulletColor: '#aa4400',
            stomachBg: '#331100', stomachJuice: 'rgba(255, 255, 0, 0.4)', juiceSpeed: 2,
            stomachIntro: "* You are trapped in his ribcage.\n* Magic spaghetti is rising around you.",
            options: [
                { label: "Eat the spaghetti", action: () => { takeDamage(2); tryEscape(20, 0); } },
                { label: "Squeeze through ribs", action: () => tryEscape(25, 3) }
            ]
        },
        // WATERFALL
        "Aaron": {
            reg: "WATERFALL", 
            draw: (w) => { ctx.fillStyle='#ddd'; ctx.fillRect(350, 150+w, 100, 100); ctx.beginPath(); ctx.arc(400, 120+w, 30, 0, Math.PI*2); ctx.fill(); },
            text: "* Aaron flexes at you.",
            gulletTime: 100, gulletColor: '#002200',
            stomachBg: '#001100', stomachJuice: 'rgba(255, 255, 255, 0.7)', juiceSpeed: 6,
            stomachIntro: "* You are inside Aaron's muscular stomach.\n* It is incredibly sweaty in here.",
            options: [
                { label: "Flex back at the stomach", action: () => tryEscape(35, 1) },
                { label: "Punch the abs", action: () => { takeDamage(5); tryEscape(10, 0); } }
            ]
        },
        "Undyne": {
            reg: "WATERFALL", 
            draw: (w) => { ctx.fillStyle='#00aaff'; ctx.beginPath(); ctx.arc(400, 120+w, 35, 0, Math.PI*2); ctx.fill(); ctx.fillStyle='#000'; ctx.fillRect(370, 160+w, 60, 120); },
            text: "* Undyne suplexes a boulder, just because she can.",
            gulletTime: 80, gulletColor: '#001144',
            stomachBg: '#000022', stomachJuice: 'rgba(0, 255, 255, 0.8)', juiceSpeed: 8, // Very fast acid
            stomachIntro: "* You are in Undyne's gut.\n* The acid is rising intensely fast!\n* You have to fight your way out!",
            options: [
                { label: "Spear your way out", action: () => tryEscape(25, 4) },
                { label: "Plead for mercy", action: () => takeDamage(10) } // She hates mercy
            ]
        },
        // HOTLAND
        "Vulkin": {
            reg: "HOTLAND", 
            draw: (w) => { ctx.fillStyle='#ffaa00'; ctx.beginPath(); ctx.moveTo(400, 150+w); ctx.lineTo(330, 250+w); ctx.lineTo(470, 250+w); ctx.fill(); },
            text: "* Vulkin thinks its lava is healing you.",
            gulletTime: 100, gulletColor: '#aa2200',
            stomachBg: '#440000', stomachJuice: 'rgba(255, 0, 0, 0.9)', juiceSpeed: 5,
            stomachIntro: "* You are inside Vulkin.\n* It is literally full of molten lava.\n* It hurts. A lot.",
            options: [
                { label: "Endure the lava", action: () => { takeDamage(4); tryEscape(30, 0); } },
                { label: "Cry for help", action: () => tryEscape(15, 2) }
            ]
        },
        "Muffet": {
            reg: "HOTLAND", 
            draw: (w) => { ctx.fillStyle='#b366ff'; ctx.beginPath(); ctx.arc(400, 150+w, 40, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(400, 230+w, 50, 0, Math.PI*2); ctx.fill(); },
            text: "* Muffet pours you a cup of spiders.",
            gulletTime: 150, gulletColor: '#2a003a',
            stomachBg: '#1a002a', stomachJuice: 'rgba(150, 0, 255, 0.8)', juiceSpeed: 4,
            stomachIntro: "* You are wrapped in tight webs inside her stomach.\n* Purple digestive fluid is rising.",
            options: [
                { label: "Struggle in the webs", action: () => tryEscape(10, 3) }, // Hard to escape
                { label: "Bribe the stomach spiders", action: () => tryEscape(100, 0) } // Instant
            ]
        }
    };

    const regionalPools = {
        "RUINS": ["Froggit", "Toriel"],
        "SNOWDIN": ["Lesser Dog", "Papyrus"],
        "WATERFALL": ["Aaron", "Undyne"],
        "HOTLAND": ["Vulkin", "Muffet"]
    };

    // --- ENGINE LOGIC ---
    function updateHp(amt) {
        document.getElementById('hp-val').innerText = Math.max(0, playerHp);
    }

    function takeDamage(amt) {
        playerHp -= amt;
        updateHp();
        // Flash screen red
        document.getElementById('screen').style.backgroundColor = '#500';
        setTimeout(() => document.getElementById('screen').style.backgroundColor = '#050505', 100);
        
        if (playerHp <= 0) {
            state = 'GAMEOVER';
            setUI("System", "* Your HP dropped to 0.\n* You were fully digested.", [
                { label: "Load Save (Map)", action: () => { showMap(); } }
            ]);
        }
    }

    function setUI(speaker, text, btns) {
        document.getElementById('speaker').innerText = speaker;
        document.getElementById('text').innerHTML = text.replace(/\n/g, '<br>');
        let c = document.getElementById('choices'); c.innerHTML = '';
        btns.forEach(b => {
            let btn = document.createElement('button');
            btn.innerText = b.label; btn.onclick = b.action; c.appendChild(btn);
        });
    }

    function showMap() {
        state = 'MAP'; playerHp = 20; updateHp();
        document.getElementById('map-menu').classList.remove('hidden');
    }

    function explore(region) {
        document.getElementById('map-menu').classList.add('hidden');
        let pool = regionalPools[region];
        currentMob = database[pool[Math.floor(Math.random() * pool.length)]];
        startEncounter();
    }

    function startEncounter() {
        state = 'ENCOUNTER';
        juiceLevel = 0; escapeProgress = 0; gulletTimer = 0;
        document.getElementById('juice-overlay').style.height = '0%';
        
        setUI(currentMob.name, currentMob.text, [
            { label: "Talk", action: () => setUI(currentMob.name, "* The monster ignores your words.", [{label: "Back", action: startEncounter}]) },
            { label: "Offer yourself as food", action: gulpPlayer },
            { label: "Run away", action: showMap }
        ]);
    }

    function gulpPlayer() {
        state = 'GULLET';
        setUI("System", "* CHOMP!\n* You are sliding down the esophagus!", []);
    }

    function enterStomach() {
        state = 'STOMACH';
        document.getElementById('juice-overlay').style.backgroundColor = currentMob.stomachJuice;
        buildStomachMenu();
    }

    function buildStomachMenu() {
        if (state !== 'STOMACH') return;
        setUI("Stomach", currentMob.stomachIntro + `\n* Escape Progress: ${escapeProgress}%`, currentMob.options);
    }

    function tryEscape(progressAmt, dmgAmt) {
        if (dmgAmt > 0) takeDamage(dmgAmt);
        if (playerHp <= 0) return; // Dead
        
        escapeProgress += progressAmt;
        
        // Shake screen
        document.getElementById('screen').style.transform = `translate(${(Math.random()-0.5)*15}px, ${(Math.random()-0.5)*15}px)`;
        setTimeout(() => document.getElementById('screen').style.transform = 'none', 50);

        if (escapeProgress >= 100) {
            state = 'ESCAPED';
            document.getElementById('juice-overlay').style.height = '0%';
            setUI("System", "* You forced your way out of the digestive tract!\n* You survived!", [
                { label: "Return to Map", action: showMap }
            ]);
        } else {
            buildStomachMenu(); // Update progress UI
        }
    }

    function updateStomachPhysics() {
        if (state === 'STOMACH') {
            if (frame % 30 === 0) {
                juiceLevel += currentMob.juiceSpeed;
                document.getElementById('juice-overlay').style.height = `${juiceLevel}%`;
                
                if (juiceLevel >= 100) {
                    takeDamage(99); // Instant death if fluid fills
                }
            }
        }
    }

    // --- RENDER LOOP ---
    function loop() {
        frame++;
        ctx.clearRect(0, 0, 800, 380);

        if (state === 'ENCOUNTER') {
            ctx.fillStyle = '#050505'; ctx.fillRect(0,0,800,380);
            let wob = Math.sin(frame * 0.05) * 5;
            if (currentMob) currentMob.draw(wob);
        } 
        else if (state === 'GULLET') {
            gulletTimer++;
            ctx.fillStyle = currentMob.gulletColor; ctx.fillRect(0,0,800,380);
            
            // Draw fleshy falling effect
            ctx.fillStyle = '#000'; ctx.globalAlpha = 0.3;
            let scroll = (frame * 15) % 100;
            for(let i = -100; i < 500; i += 100) {
                let w = Math.sin((i+frame)*0.05)*30;
                ctx.fillRect(0, i+scroll, 200+w, 100);
                ctx.fillRect(600-w, i+scroll, 200+w, 100);
            }
            ctx.globalAlpha = 1.0;

            // Draw falling player
            ctx.fillStyle = '#ff0000';
            let py = 50 + (gulletTimer / currentMob.gulletTime) * 300;
            ctx.beginPath(); ctx.arc(400, py, 15, 0, Math.PI*2); ctx.fill();

            // Long neck text check
            if (currentMob.name === "Lesser Dog" && gulletTimer === 100) {
                document.getElementById('text').innerHTML = "* You are sliding down the esophagus.<br>* ...It is very long.";
            }

            if (gulletTimer >= currentMob.gulletTime) {
                enterStomach();
            }
        }
        else if (state === 'STOMACH') {
            ctx.fillStyle = currentMob.stomachBg; ctx.fillRect(0,0,800,380);
            
            // Draw Player inside
            ctx.fillStyle = '#ff0000';
            let pulse = Math.sin(frame * 0.1) * 10;
            let py = 300 - (escapeProgress * 1.5) + pulse;
            ctx.beginPath(); ctx.arc(400, py, 15, 0, Math.PI*2); ctx.fill();

            updateStomachPhysics();
        }

        requestAnimationFrame(loop);
    }

    // Init
    showMap();
    loop();

</script>
</body>
</html>
