<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Undertale: The Chara Protocol v3</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body { background: #000; color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'VT323', monospace; overflow: hidden; }
        #game-container { display: flex; width: 1050px; height: 650px; border: 4px solid #444; background: #000; position: relative; }
        
        /* Save System */
        #menu-overlay { position: absolute; inset: 0; background: #000; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .save-slot { width: 400px; padding: 15px; border: 3px solid #fff; margin: 8px; cursor: pointer; transition: 0.2s; position: relative; font-size: 24px;}
        .save-slot:hover { border-color: #ff0000; background: #110000; }
        .delete-btn { position: absolute; right: 10px; top: 10px; color: #ff0000; border: 1px solid #ff0000; padding: 2px 5px; cursor: pointer; }

        /* Left Side: Battle */
        #battle-side { width: 580px; border-right: 4px solid #333; display: flex; flex-direction: column; align-items: center; padding: 15px; position: relative; }
        #battle-box { width: 340px; height: 260px; border: 4px solid #fff; position: relative; overflow: hidden; background: #000; margin: 15px 0; }
        #soul { width: 16px; height: 16px; position: absolute; background: #f00; z-index: 10; clip-path: path('M8 2.1C8 2.1 7.4 0 4.2 0 1.2 0 0 2.4 0 4.4 0 8.4 8 13.5 8 13.5S16 8.4 16 4.4C16 2.4 14.8 0 11.8 0 8.6 0 8 2.1 8 2.1Z'); }
        .bullet { position: absolute; background: #fff; border-radius: 50%; }

        /* Combat Buttons */
        #action-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 90%; }
        .menu-btn { border: 2px solid #ffaa00; color: #ffaa00; background: #000; padding: 10px; font-size: 26px; cursor: pointer; text-align: center; }
        .menu-btn:hover:not(:disabled) { background: #ffaa00; color: #000; }
        .menu-btn:disabled { border-color: #333; color: #333; }

        /* Sub-menus for Items/Acts */
        #sub-menu { position: absolute; bottom: 80px; width: 80%; background: #000; border: 2px solid #fff; padding: 10px; display: none; flex-direction: column; z-index: 50;}
        .sub-opt { padding: 5px; cursor: pointer; font-size: 22px; }
        .sub-opt:hover { background: #333; }

        /* Stats */
        #stat-ui { width: 100%; display: flex; justify-content: space-around; font-size: 28px; }
        #hp-bar { width: 100px; height: 18px; background: #f00; display: inline-block; vertical-align: middle; }
        #hp-fill { height: 100%; background: #ff0; width: 100%; transition: width 0.3s; }
        #control-bar { width: 200px; height: 10px; background: #222; border: 1px solid #444; margin-top: 5px; }
        #control-fill { height: 100%; background: #f00; box-shadow: 0 0 10px #f00; }

        /* Right Side: Narrative */
        #chat-side { width: 470px; display: flex; flex-direction: column; background: #050505; }
        #chat-log { flex-grow: 1; padding: 20px; overflow-y: auto; font-size: 22px; line-height: 1.3; color: #ffaa00; }
        .msg-chara { color: #f00; border-left: 2px solid #f00; padding-left: 8px; margin-bottom: 10px; }
        .msg-player { color: #fff; align-self: flex-end; opacity: 0.7; margin-bottom: 10px; }
        #chat-input { width: 95%; background: #000; border: none; color: #fff; font-family: inherit; font-size: 24px; padding: 10px; outline: none; border-top: 2px solid #333; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="menu-overlay">
        <h1 style="color: #f00; font-size: 45px; letter-spacing: 5px;">TIMELINE SELECTOR</h1>
        <div id="slots"></div>
        <button class="menu-btn" onclick="setKey()">CONFIGURE API</button>
    </div>

    <div id="battle-side">
        <div id="stat-ui">
            <span>LV 19</span>
            <span>HP <div id="hp-bar"><div id="hp-fill"></div></div> <span id="hp-text">20/20</span></span>
        </div>
        <div id="control-bar"><div id="control-fill"></div></div>
        <div style="font-size: 18px; color: #f00;">CONTROL: <span id="ctrl-pct">0</span>%</div>

        <div id="battle-box">
            <div id="soul"></div>
        </div>

        <div id="sub-menu"></div>

        <div id="action-menu">
            <button class="menu-btn" id="btn-fight" onclick="showFight()">FIGHT</button>
            <button class="menu-btn" id="btn-act" onclick="showAct()">ACT</button>
            <button class="menu-btn" id="btn-item" onclick="showItems()">ITEM</button>
            <button class="menu-btn" id="btn-mercy" onclick="showMercy()">MERCY</button>
        </div>
    </div>

    <div id="chat-side">
        <div id="chat-log"></div>
        <input type="text" id="chat-input" placeholder="Say something to the void..." autocomplete="off">
    </div>
</div>

<script>
    // --- DATA ---
    let saves = JSON.parse(localStorage.getItem('chara_saves_v3')) || [null, null, null];
    let apiKey = localStorage.getItem('chara_api_key');
    let curSlot = null;
    let gameState = 'MENU'; // MENU, PLAYER_TURN, ENEMY_TURN
    
    let hp = 20, control = 0, inv = ["Pie", "Noodles", "Steak", "Tea"];
    const soul = document.getElementById('soul');
    const soulPos = { x: 162, y: 122 };
    const keys = {};
    let bullets = [];
    let turnTimer = 0;
    let isHijacked = false;

    // --- INIT ---
    function setKey() { let k = prompt("Gemini API Key:"); if(k) {localStorage.setItem('chara_api_key', k); apiKey = k;} }
    
    function renderSlots() {
        const cont = document.getElementById('slots');
        cont.innerHTML = '';
        saves.forEach((s, i) => {
            const d = document.createElement('div');
            d.className = `save-slot ${s ? '' : 'empty'}`;
            d.innerHTML = s ? `NAME: ${s.name} | CTRL: ${Math.floor(s.control)}% <span class="delete-btn" onclick="delSave(${i}, event)">[X]</span>` : `-- NO DATA --`;
            d.onclick = () => s ? loadGame(i) : newGame(i);
            cont.appendChild(d);
        });
    }

    function newGame(i) {
        let n = prompt("Name the fallen:");
        if(!n) return;
        saves[i] = { name: n, control: 0, hp: 20, inv: ["Pie", "Noodles", "Steak", "Tea"] };
        save(); renderSlots();
    }
    function delSave(i, e) { e.stopPropagation(); saves[i] = null; save(); renderSlots(); }
    function save() { localStorage.setItem('chara_saves_v3', JSON.stringify(saves)); }

    function loadGame(i) {
        curSlot = i;
        hp = saves[i].hp;
        control = saves[i].control;
        inv = saves[i].inv || ["Pie", "Noodles", "Steak", "Tea"];
        document.getElementById('menu-overlay').classList.add('hidden');
        gameState = 'PLAYER_TURN';
        logMsg("Chara", `I am ${saves[i].name}. Let us begin.`, "msg-chara");
        updateUI();
        requestAnimationFrame(loop);
    }

    // --- COMBAT LOGIC ---
    window.onkeydown = e => keys[e.code] = true;
    window.onkeyup = e => keys[e.code] = false;

    function loop() {
        if(gameState === 'ENEMY_TURN') {
            updateSoul();
            updateBullets();
            turnTimer--;
            if(turnTimer <= 0) endTurn();
        }
        requestAnimationFrame(loop);
    }

    function updateSoul() {
        // FLICKER LOGIC (hijack soul based on control %)
        isHijacked = false;
        if(control > 60) {
            let flickerRate = (control - 60) * 0.02; // More control = more flicker
            if(Math.random() < flickerRate) isHijacked = true;
        }
        if(control >= 100) isHijacked = true;

        soul.style.background = isHijacked ? "#fff" : "#f00";

        if(isHijacked) {
            // CHARA DODGE AI: Find nearest bullet and move away
            let near = null, minDist = 80;
            bullets.forEach(b => {
                let d = Math.hypot(b.x - soulPos.x, b.y - soulPos.y);
                if(d < minDist) { minDist = d; near = b; }
            });
            if(near) {
                // Move perpendicular to projectile or away
                if(near.x > soulPos.x) soulPos.x -= 2.5; else soulPos.x += 2.5;
                if(near.y > soulPos.y) soulPos.y -= 2.5; else soulPos.y += 2.5;
            }
        } else {
            let s = 3.5;
            if(keys['ArrowUp'] || keys['KeyW']) soulPos.y -= s;
            if(keys['ArrowDown'] || keys['KeyS']) soulPos.y += s;
            if(keys['ArrowLeft'] || keys['KeyA']) soulPos.x -= s;
            if(keys['ArrowRight'] || keys['KeyD']) soulPos.x += s;
        }

        soulPos.x = Math.max(0, Math.min(324, soulPos.x));
        soulPos.y = Math.max(0, Math.min(244, soulPos.y));
        soul.style.left = soulPos.x + 'px';
        soul.style.top = soulPos.y + 'px';
    }

    function startEnemyTurn() {
        gameState = 'ENEMY_TURN';
        turnTimer = 400; // ~6.5 seconds
        bullets = [];
        document.getElementById('action-menu').style.opacity = "0.3";
        document.querySelectorAll('.menu-btn').forEach(b => b.disabled = true);
        
        const patterns = ['RAIN', 'CIRCLE', 'WAVE', 'RANDOM'];
        const p = patterns[Math.floor(Math.random() * patterns.length)];
        
        let interval = setInterval(() => {
            if(gameState !== 'ENEMY_TURN') { clearInterval(interval); return; }
            spawnBulletPattern(p);
        }, 150);
        
        setTimeout(() => clearInterval(interval), 5500);
    }

    function spawnBulletPattern(p) {
        if(p === 'RAIN') spawnBullet(Math.random()*340, -10, 0, 4);
        if(p === 'CIRCLE') {
            let a = Math.random()*Math.PI*2;
            spawnBullet(170 + Math.cos(a)*150, 130 + Math.sin(a)*150, -Math.cos(a)*3, -Math.sin(a)*3);
        }
        if(p === 'WAVE') {
            spawnBullet(-10, 50 + Math.sin(Date.now()/200)*100, 4, 0);
        }
    }

    function spawnBullet(x, y, vx, vy) {
        let b = { x, y, vx, vy, el: document.createElement('div') };
        b.el.className = 'bullet';
        b.el.style.width = '12px'; b.el.style.height = '12px';
        document.getElementById('battle-box').appendChild(b.el);
        bullets.push(b);
    }

    function updateBullets() {
        for(let i=bullets.length-1; i>=0; i--) {
            let b = bullets[i];
            b.x += b.vx; b.y += b.vy;
            b.el.style.left = b.x + 'px'; b.el.style.top = b.y + 'px';
            if(Math.hypot(b.x - soulPos.x, b.y - soulPos.y) < 14) {
                b.el.remove(); bullets.splice(i,1); takeDamage(1);
            } else if(b.x < -20 || b.x > 360 || b.y < -20 || b.y > 280) {
                b.el.remove(); bullets.splice(i,1);
            }
        }
    }

    function endTurn() {
        gameState = 'PLAYER_TURN';
        bullets.forEach(b => b.el.remove());
        bullets = [];
        document.getElementById('action-menu').style.opacity = "1";
        document.querySelectorAll('.menu-btn').forEach(b => {
            if(control < 80 || b.id !== 'btn-mercy') b.disabled = false;
        });
        updateUI();
    }

    // --- ACTIONS ---
    function showItems() {
        const sm = document.getElementById('sub-menu');
        sm.style.display = 'flex';
        sm.innerHTML = inv.length ? inv.map((it, i) => `<div class="sub-opt" onclick="useItem(${i})">${it}</div>`).join('') : "NO ITEMS";
    }

    function useItem(i) {
        let item = inv.splice(i, 1)[0];
        let heal = item === "Pie" ? 20 : 10;
        hp = Math.min(20, hp + heal);
        logMsg("System", `* Used ${item}. Healed ${heal} HP.`, "msg-player");
        document.getElementById('sub-menu').style.display = 'none';
        shiftControl(-2);
        startEnemyTurn();
    }

    function showFight() { 
        logMsg("You", "* You struck the narrative.", "msg-player"); 
        shiftControl(8); startEnemyTurn(); 
    }
    function showAct() { 
        logMsg("You", "* You tried to talk things through.", "msg-player"); 
        shiftControl(2); startEnemyTurn(); 
    }
    function showMercy() { 
        logMsg("You", "* You chose to SPARE.", "msg-player"); 
        shiftControl(-5); startEnemyTurn(); 
    }

    function takeDamage(n) {
        hp -= n; updateUI();
        shiftControl(0.1);
        if(hp <= 0) {
            alert("ERASED.");
            saves[curSlot].hp = 20; // Soft reset for loop
            save(); location.reload();
        }
    }

    function shiftControl(n) {
        control = Math.max(0, Math.min(100, control + n));
        updateUI();
        if(control >= 100) {
            document.querySelectorAll('.menu-btn').forEach(b => b.disabled = true);
            soul.style.background = "#fff";
        }
    }

    function updateUI() {
        document.getElementById('hp-fill').style.width = (hp/20)*100+"%";
        document.getElementById('hp-text').innerText = `${Math.ceil(hp)}/20`;
        document.getElementById('ctrl-fill').style.width = control+"%";
        document.getElementById('ctrl-pct').innerText = Math.floor(control);
        if(curSlot !== null) {
            saves[curSlot].hp = hp;
            saves[curSlot].control = control;
            saves[curSlot].inv = inv;
            save();
        }
    }

    // --- AI CHAT ---
    async function sendAI(txt) {
        if(!apiKey || isAiTyping) return;
        isAiTyping = true;
        const system = `You are Chara from Undertale. You are cold, manipulative, and seek total control over the player's soul. 
        You speak in a formal but threatening tone. At >60% control, you glitch. At 100%, you are the master.
        Return JSON: {"reply": "text", "controlMod": number}`;

        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{role: "user", parts: [{text: txt}]}], systemInstruction: {parts: [{text: system}]}, generationConfig: {responseMimeType: "application/json"} })
            });
            const d = await r.json();
            const res = JSON.parse(d.candidates[0].content.parts[0].text);
            logMsg("Chara", res.reply, "msg-chara");
            shiftControl(res.controlMod || 0);
        } catch(e) {} finally { isAiTyping = false; }
    }

    document.getElementById('chat-input').onkeypress = e => {
        if(e.key === 'Enter') {
            let v = e.target.value; logMsg("You", v, "msg-player");
            e.target.value = ''; sendAI(v);
        }
    }

    function logMsg(s, t, c) {
        const l = document.getElementById('chat-log');
        const d = document.createElement('div');
        d.className = c; d.innerText = t;
        l.appendChild(d); l.scrollTop = l.scrollHeight;
    }

    let isAiTyping = false;
    renderSlots();
</script>
</body>
</html>
