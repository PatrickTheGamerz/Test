<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web RNG: Aura Roller</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050510; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; user-select: none; }
        
        /* UI Layout */
        #ui-layer { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .interactive { pointer-events: auto; }
        
        /* Top Bar */
        #top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
        #stats { background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; border: 1px solid #444; }
        .stat-line { font-size: 18px; margin-bottom: 5px; text-shadow: 1px 1px 2px black; }
        
        /* Inventory Button & Panel */
        #btn-inv { background: #222; color: #fff; border: 2px solid #666; padding: 10px 20px; font-size: 18px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        #btn-inv:hover { background: #444; transform: scale(1.05); }
        
        #inventory-panel { display: none; position: absolute; top: 70px; right: 20px; width: 300px; height: 60vh; background: rgba(10,10,15,0.95); border: 2px solid #555; border-radius: 8px; padding: 15px; overflow-y: auto; pointer-events: auto; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .inv-item { background: #222; margin-bottom: 10px; padding: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid gray; }
        .inv-item button { background: #444; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
        .inv-item button:hover { background: #666; }

        /* Bottom Controls */
        #bottom-bar { display: flex; flex-direction: column; align-items: center; padding-bottom: 20px; }
        #roll-result { font-size: 40px; font-weight: bold; margin-bottom: 20px; text-shadow: 0 0 10px rgba(255,255,255,0.5); opacity: 0; transition: opacity 0.3s; text-align: center; }
        #roll-chance { font-size: 20px; opacity: 0.8; }
        
        #btn-roll { background: linear-gradient(45deg, #4CAF50, #2E7D32); border: 3px solid #81C784; color: white; font-size: 36px; font-weight: bold; padding: 15px 60px; border-radius: 50px; cursor: pointer; box-shadow: 0 10px 20px rgba(0,255,0,0.2); transition: 0.1s; text-transform: uppercase; letter-spacing: 2px; }
        #btn-roll:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 15px 30px rgba(0,255,0,0.4); }
        #btn-roll:active { transform: translateY(2px) scale(0.95); }

        /* Rarity Colors */
        .r-common { color: #aaaaaa; }
        .r-uncommon { color: #55ff55; }
        .r-rare { color: #5555ff; }
        .r-epic { color: #aa00ff; text-shadow: 0 0 10px #aa00ff; }
        .r-legendary { color: #ffaa00; text-shadow: 0 0 15px #ffaa00; font-style: italic; }
        .r-galactic { color: #ff00ff; text-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff; font-weight: 900; letter-spacing: 5px; }

    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="top-bar">
            <div id="stats" class="interactive">
                <div class="stat-line">Rolls: <span id="stat-rolls">0</span></div>
                <div class="stat-line" style="font-size: 14px; color:#aaa;">Equipped: <span id="stat-equipped" style="color:white">None</span></div>
            </div>
            <div>
                <button id="btn-inv" class="interactive" onclick="toggleInventory()">Inventory (0)</button>
                <div id="inventory-panel">
                    <h2 style="margin-top:0; border-bottom: 1px solid #555; padding-bottom: 10px;">Auras</h2>
                    <div id="inv-list"></div>
                </div>
            </div>
        </div>

        <div id="bottom-bar">
            <div id="roll-result">
                <div id="roll-name">COMMON</div>
                <div id="roll-chance">1 in 2</div>
            </div>
            <button id="btn-roll" class="interactive" onclick="roll()">ROLL</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- GAME DATA: The RNG Table ---
        const AURAS = [
            { id: 'common', name: 'Common', chance: 2, color: 0xaaaaaa, class: 'r-common', particles: 0 },
            { id: 'uncommon', name: 'Uncommon', chance: 10, color: 0x55ff55, class: 'r-uncommon', particles: 50 },
            { id: 'rare', name: 'Rare', chance: 250, color: 0x5555ff, class: 'r-rare', particles: 200, rings: 1 },
            { id: 'epic', name: 'Epic', chance: 1500, color: 0xaa00ff, class: 'r-epic', particles: 500, rings: 2, glow: true },
            { id: 'legendary', name: 'Legendary', chance: 50000, color: 0xffaa00, class: 'r-legendary', particles: 1500, rings: 3, glow: true },
            { id: 'galactic', name: 'GALACTIC', chance: 1000000, color: 0xff00ff, class: 'r-galactic', particles: 3000, rings: 5, glow: true, starfield: true }
        ];

        // Global State
        window.playerData = {
            rolls: 0,
            inventory: [],
            equipped: null
        };

        // --- 3D SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enablePan = false;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Don't go below floor
        controls.minDistance = 5;
        controls.maxDistance = 20;

        // --- ENVIRONMENT ---
        // Floor Grid
        const gridHelper = new THREE.GridHelper(50, 50, 0x222244, 0x111122);
        scene.add(gridHelper);

        // The "Player" Dummy
        const dummyGeo = new THREE.CapsuleGeometry(1, 2.5, 4, 16);
        const dummyMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.2, metalness: 0.8 });
        const dummy = new THREE.Mesh(dummyGeo, dummyMat);
        dummy.position.y = 2.25;
        scene.add(dummy);

        // Base Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(5, 10, 5);
        scene.add(directionalLight);

        // --- AURA VISUAL SYSTEM ---
        let auraGroup = new THREE.Group();
        auraGroup.position.copy(dummy.position);
        scene.add(auraGroup);
        
        let activeParticles = null;
        let activeRings = [];
        let auraLight = new THREE.PointLight(0xffffff, 0, 10);
        scene.add(auraLight);

        window.equipAura = function(auraIndex) {
            const aura = window.playerData.inventory[auraIndex];
            window.playerData.equipped = aura;
            document.getElementById('stat-equipped').innerText = aura.name;
            document.getElementById('stat-equipped').className = aura.class;

            // Clear old visuals
            while(auraGroup.children.length > 0){ 
                let child = auraGroup.children[0];
                auraGroup.remove(child); 
            }
            activeRings = [];
            
            if(!aura) { auraLight.intensity = 0; return; }

            // Apply new visuals
            if (aura.glow) {
                auraLight.color.setHex(aura.color);
                auraLight.intensity = 5;
                auraLight.position.copy(dummy.position);
            } else {
                auraLight.intensity = 0;
            }

            // Create Rings
            if (aura.rings) {
                for(let i=0; i<aura.rings; i++) {
                    const ringGeo = new THREE.TorusGeometry(1.5 + (i*0.5), 0.05, 8, 50);
                    const ringMat = new THREE.MeshBasicMaterial({ color: aura.color, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
                    if (aura.glow) ringMat.blending = THREE.AdditiveBlending;
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.rotation.x = Math.PI / 2;
                    ring.userData = { speedX: (Math.random()-0.5)*0.05, speedY: (Math.random()-0.5)*0.05, speedZ: (Math.random()-0.5)*0.05 };
                    auraGroup.add(ring);
                    activeRings.push(ring);
                }
            }

            // Create Particles
            if (aura.particles > 0) {
                const partsGeo = new THREE.BufferGeometry();
                const partsPos = new Float32Array(aura.particles * 3);
                for(let i=0; i<aura.particles * 3; i+=3) {
                    // Spawn in a sphere around player
                    const radius = 2 + Math.random() * 3;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos((Math.random() * 2) - 1);
                    partsPos[i] = radius * Math.sin(phi) * Math.cos(theta);
                    partsPos[i+1] = radius * Math.sin(phi) * Math.sin(theta);
                    partsPos[i+2] = radius * Math.cos(phi);
                }
                partsGeo.setAttribute('position', new THREE.BufferAttribute(partsPos, 3));
                
                const partsMat = new THREE.PointsMaterial({ 
                    color: aura.color, size: 0.1, transparent: true, opacity: 0.6,
                    blending: aura.glow ? THREE.AdditiveBlending : THREE.NormalBlending
                });
                activeParticles = new THREE.Points(partsGeo, partsMat);
                auraGroup.add(activeParticles);
            } else {
                activeParticles = null;
            }
        };

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Rotate Rings
            activeRings.forEach((ring, index) => {
                ring.rotation.x += ring.userData.speedX;
                ring.rotation.y += ring.userData.speedY;
                ring.rotation.z += ring.userData.speedZ;
                ring.position.y = Math.sin(time * 2 + index) * 0.5; // Hover effect
            });

            // Rotate Particles
            if(activeParticles) {
                activeParticles.rotation.y += 0.005;
                if(window.playerData.equipped && window.playerData.equipped.id === 'galactic') {
                    activeParticles.rotation.x -= 0.002;
                    activeParticles.rotation.z += 0.003;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- RNG GAME LOGIC ---
        window.roll = function() {
            window.playerData.rolls++;
            document.getElementById('stat-rolls').innerText = window.playerData.rolls;

            // The Math: Sort from Rarest to Most Common
            const sorted = [...AURAS].sort((a,b) => b.chance - a.chance);
            let rolledAura = AURAS[0]; // Default to common

            for(let a of sorted) {
                // Generate a random number between 0 and 1. Compare against 1/chance.
                if (Math.random() <= (1 / a.chance)) {
                    rolledAura = a;
                    break;
                }
            }

            showRollResult(rolledAura);
            addToInventory(rolledAura);
        };

        function showRollResult(aura) {
            const resEl = document.getElementById('roll-result');
            const nameEl = document.getElementById('roll-name');
            const chanceEl = document.getElementById('roll-chance');

            nameEl.innerText = aura.name;
            nameEl.className = aura.class;
            chanceEl.innerText = `1 in ${aura.chance.toLocaleString()}`;

            // Screen shake / flash for rare stuff
            if (aura.chance >= 1500) {
                document.body.style.background = "#ffffff";
                setTimeout(() => document.body.style.background = "#050510", 50);
            }

            resEl.style.opacity = 1;
            resEl.style.transform = "scale(1.2)";
            setTimeout(() => { resEl.style.transform = "scale(1)"; }, 100);
            
            clearTimeout(window.rollFade);
            window.rollFade = setTimeout(() => { resEl.style.opacity = 0; }, 3000);
        }

        function addToInventory(aura) {
            window.playerData.inventory.push(aura);
            document.getElementById('btn-inv').innerText = `Inventory (${window.playerData.inventory.length})`;
            renderInventory();
        }

    </script>

    <script>
        function toggleInventory() {
            const p = document.getElementById('inventory-panel');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }

        function renderInventory() {
            const list = document.getElementById('inv-list');
            list.innerHTML = '';
            
            // Reverse so newest is at the top
            [...window.playerData.inventory].reverse().forEach((aura, reverseIndex) => {
                // Calculate actual array index
                const realIndex = window.playerData.inventory.length - 1 - reverseIndex;
                
                const item = document.createElement('div');
                item.className = `inv-item`;
                item.style.borderLeftColor = "#" + aura.color.toString(16).padStart(6, '0');
                
                item.innerHTML = `
                    <div>
                        <strong class="${aura.class}">${aura.name}</strong><br>
                        <span style="font-size:12px; color:#888;">1 in ${aura.chance.toLocaleString()}</span>
                    </div>
                    <button onclick="equipAura(${realIndex})">Equip</button>
                `;
                list.appendChild(item);
            });
        }
    </script>
</body>
</html>
