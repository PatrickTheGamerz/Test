<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undertale: Open World Gulp</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body { background: #000; color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'VT323', monospace; user-select: none; }
        #game { width: 800px; height: 600px; border: 4px solid #fff; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        #screen { flex-grow: 1; position: relative; background: #050505; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; image-rendering: pixelated; }
        #ui { height: 200px; border-top: 4px solid #fff; padding: 20px; box-sizing: border-box; background: #000; position: relative; z-index: 10; }
        .text { font-size: 28px; line-height: 1.2; }
        .speaker { font-size: 32px; color: #ffea00; margin-bottom: 5px; }
        #choices { position: absolute; right: 20px; top: 20px; display: flex; flex-direction: column; gap: 8px; }
        button { background: #000; color: #fff; border: 2px solid #fff; font-family: inherit; font-size: 24px; padding: 5px 15px; cursor: pointer; text-align: left; }
        button:hover { background: #fff; color: #000; }
        .hidden { display: none !important; }
        #map-menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 20; padding: 40px; box-sizing: border-box; }
        .map-btn { font-size: 30px; margin: 10px 0; width: 300px; }
        #juice-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: rgba(0, 255, 0, 0.5); z-index: 5; transition: height 0.5s; pointer-events: none;}
    </style>
</head>
<body>

<div id="game">
    <div id="screen">
        <canvas id="c" width="800" height="400"></canvas>
        <div id="juice-overlay"></div>
    </div>
    
    <div id="ui">
        <div id="speaker" class="speaker">System</div>
        <div id="text" class="text"></div>
        <div id="choices"></div>
    </div>

    <div id="map-menu" class="hidden">
        <h1 style="color:#ffea00;">WORLD MAP</h1>
        <p class="text">Select a region to explore:</p>
        <button class="map-btn" onclick="explore('RUINS')">Explore THE RUINS</button><br>
        <button class="map-btn" onclick="explore('SNOWDIN')">Explore SNOWDIN</button><br>
        <button class="map-btn" onclick="explore('WATERFALL')">Explore WATERFALL</button>
    </div>
</div>

<script>
    const ctx = document.getElementById('c').getContext('2d');
    let frame = 0, state = 'MENU', currentMob = null;
    let juiceLevel = 0, escapeProgress = 0;

    // --- MONSTER DATABASE ---
    const database = {
        "Froggit": {
            reg: "RUINS", draw: (wob) => {
                ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(400, 250+wob, 50, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(380, 230+wob, 8, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(420, 230+wob, 8, 0, Math.PI*2); ctx.fill();
            },
            text: "* Froggit doesn't understand why you are here.",
            stomachBg: '#1a2a1a', stomachJuice: 'rgba(0, 255, 0, 0.6)',
            stomachText: "* You are inside Froggit.\n* Digestive flies buzz around.\n* The acid is rising quickly!",
            escapeClicks: 5, juiceSpeed: 5
        },
        "Moldsmal": {
            reg: "RUINS", draw: (wob) => {
                ctx.fillStyle='#ff00ff'; ctx.fillRect(320-wob*2, 200, 160+wob*4, 100-wob);
            },
            text: "* Moldsmal wiggles alluringly.",
            stomachBg: '#2a002a', stomachJuice: 'rgba(255, 0, 255, 0.8)',
            stomachText: "* You are trapped in pure, thick slime.\n* It's incredibly sticky.\n* You have to struggle hard to pull free!",
            escapeClicks: 12, juiceSpeed: 2 // Hard to escape, slow digestion
        },
        "Lesser Dog": {
            reg: "SNOWDIN", draw: (wob) => {
                ctx.fillStyle='#fff'; ctx.fillRect(360, 200+wob, 80, 100); // Body
                ctx.fillRect(380, 100+Math.abs(wob)*3, 40, 100-Math.abs(wob)*3); // Neck extending
                ctx.fillRect(370, 60+Math.abs(wob)*3, 60, 40); // Head
            },
            text: "* Lesser Dog's neck extends excitedly.",
            stomachBg: '#331a00', stomachJuice: 'rgba(150, 100, 50, 0.7)',
            stomachText: "* It smells like dog food and slobber.\n* You are buried in half-chewed bones.\n* Pet the stomach walls to make it cough you up!",
            escapeClicks: 6, juiceSpeed: 4
        },
        "Annoying Dog": {
            reg: "SNOWDIN", draw: (wob) => {
                ctx.fillStyle='#fff'; ctx.fillRect(370, 250-wob, 60, 40); // Dog
                ctx.fillStyle='#000'; ctx.fillRect(380, 260-wob, 5,5); ctx.fillRect(410, 260-wob, 5,5); // Eyes
            },
            text: "* The Annoying Dog absorbs the artifact.",
            stomachBg: '#ffffff', stomachJuice: 'rgba(255, 255, 255, 0.9)',
            stomachText: "* You are in a blank white void.\n* A dog is sleeping on your face.\n* Reality is dissolving.",
            escapeClicks: 8, juiceSpeed: 10 // Rapid reality dissolution!
        }
    };

    // Regional Encounter Tables
    const regions = {
        "RUINS": ["Froggit", "Moldsmal", "Moldsmal"],
        "SNOWDIN": ["Lesser Dog", "Lesser Dog", "Annoying Dog"],
        "WATERFALL": ["Froggit"] // Placeholder for Waterfall
    };

    // --- CORE FUNCTIONS ---
    function setUI(speaker, text, btns) {
        document.getElementById('speaker').innerText = speaker;
        document.getElementById('text').innerHTML = text.replace(/\n/g, '<br>');
        let c = document.getElementById('choices'); c.innerHTML = '';
        btns.forEach(b => {
            let btn = document.createElement('button');
            btn.innerText = b.label; btn.onclick = b.action; c.appendChild(btn);
        });
    }

    function showMap() {
        state = 'MAP';
        document.getElementById('map-menu').classList.remove('hidden');
    }

    function explore(region) {
        document.getElementById('map-menu').classList.add('hidden');
        // Pick random mob from region
        let pool = regions[region];
        let mobName = pool[Math.floor(Math.random() * pool.length)];
        currentMob = database[mobName];
        startEncounter();
    }

    function startEncounter() {
        state = 'ENCOUNTER';
        juiceLevel = 0; escapeProgress = 0;
        document.getElementById('juice-overlay').style.height = '0%';
        
        setUI(currentMob.name, currentMob.text, [
            { label: "Talk", action: () => setUI(currentMob.name, "* It doesn't seem to understand.", [{label: "Back", action: startEncounter}]) },
            { label: "Flirt", action: () => {
                setUI(currentMob.name, "* It blushes...\n* Then its appetite takes over!", [
                    { label: "Uh oh...", action: gulpPlayer }
                ]);
            }},
            { label: "Flee", action: showMap }
        ]);
    }

    function gulpPlayer() {
        state = 'GULP';
        setUI("System", "* CHOMP!\n* The monster lunges and swallows you whole!\n* You are sliding down the esophagus!", [
            { label: "Fall into the stomach", action: enterStomach }
        ]);
    }

    function enterStomach() {
        state = 'STOMACH';
        document.getElementById('juice-overlay').style.backgroundColor = currentMob.stomachJuice;
        
        setUI("Stomach", currentMob.stomachText, [
            { label: "Struggle / Escape!", action: tryEscape }
        ]);
    }

    function tryEscape() {
        escapeProgress++;
        // Shake screen effect
        document.getElementById('screen').style.transform = `translate(${(Math.random()-0.5)*10}px, ${(Math.random()-0.5)*10}px)`;
        setTimeout(() => document.getElementById('screen').style.transform = 'none', 50);

        if (escapeProgress >= currentMob.escapeClicks) {
            state = 'ESCAPED';
            document.getElementById('juice-overlay').style.height = '0%';
            setUI("System", "* You burst out of the monster's mouth covered in digestive fluids!\n* You survived!", [
                { label: "Return to Map", action: showMap }
            ]);
        }
    }

    function updateStomachPhysics() {
        if (state === 'STOMACH') {
            // Rising Juice Mechanic
            if (frame % 30 === 0) {
                juiceLevel += currentMob.juiceSpeed;
                document.getElementById('juice-overlay').style.height = `${juiceLevel}%`;
                
                if (juiceLevel >= 100) {
                    state = 'GAMEOVER';
                    setUI("System", "* The digestive fluids consumed you completely.\n* You were digested.", [
                        { label: "Load Save (Map)", action: () => { juiceLevel = 0; document.getElementById('juice-overlay').style.height = '0%'; showMap(); } }
                    ]);
                }
            }
        }
    }

    // --- RENDER LOOP ---
    function loop() {
        frame++;
        ctx.clearRect(0, 0, 800, 400);

        if (state === 'ENCOUNTER') {
            // Draw Overworld Monster
            ctx.fillStyle = '#050505'; ctx.fillRect(0,0,800,400);
            let wob = Math.sin(frame * 0.05) * 5;
            if (currentMob) currentMob.draw(wob);
        } 
        else if (state === 'GULP') {
            // Gullet falling animation
            ctx.fillStyle = '#4a001a'; ctx.fillRect(0,0,800,400);
            ctx.fillStyle = '#80002a';
            let scroll = (frame * 15) % 100;
            for(let i = -100; i < 500; i += 100) {
                let w = Math.sin((i+frame)*0.05)*30;
                ctx.fillRect(0, i+scroll, 200+w, 100);
                ctx.fillRect(600-w, i+scroll, 200+w, 100);
            }
        }
        else if (state === 'STOMACH') {
            // Draw Anatomy
            ctx.fillStyle = currentMob.stomachBg; ctx.fillRect(0,0,800,400);
            ctx.strokeStyle = '#000'; ctx.lineWidth = 10;
            let pulse = Math.sin(frame * 0.1) * 10;
            
            // Player representation inside stomach
            ctx.fillStyle = '#ff0000';
            let py = 300 - (escapeProgress * 15) + pulse; // Move up as you escape
            ctx.beginPath(); ctx.arc(400, py, 15, 0, Math.PI*2); ctx.fill();

            updateStomachPhysics();
        }

        requestAnimationFrame(loop);
    }

    // Init
    showMap();
    loop();

</script>
</body>
</html>
