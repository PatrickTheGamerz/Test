<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Undertale: Apex Anatomy Engine</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body { background: #000; color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'VT323', monospace; user-select: none; overflow: hidden; }
        #game { width: 800px; height: 600px; border: 4px solid #fff; position: relative; box-shadow: 0 0 60px rgba(255,50,50,0.3); background: #000; border-radius: 5px; }
        canvas { display: block; image-rendering: pixelated; position: absolute; z-index: 1; }
        #ui { position: absolute; bottom: 0; left: 0; width: 100%; height: 160px; background: rgba(0,0,0,0.9); border-top: 4px solid #fff; padding: 15px; box-sizing: border-box; display: flex; flex-direction: column; z-index: 10; }
        .speaker { color: #ffea00; font-size: 30px; margin-bottom: 5px; text-transform: uppercase; }
        .text { font-size: 24px; line-height: 1.2; }
        #choices { position: absolute; right: 15px; top: 15px; display: flex; flex-direction: column; gap: 8px; z-index: 11; }
        button { background: #111; color: #fff; border: 2px solid #fff; font-family: inherit; font-size: 20px; padding: 5px 15px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #fff; color: #000; padding-left: 20px; }
        #stats { position: absolute; top: 10px; left: 10px; font-size: 24px; z-index: 10; background: rgba(0,0,0,0.7); padding: 5px; border-radius: 5px; }
    </style>
</head>
<body>

<div id="game">
    <div id="stats">HP: <span id="hp-val">20.0</span> | <span id="loc-val">Menu</span></div>
    <canvas id="c" width="800" height="440"></canvas>
    <div id="ui"><div id="speaker" class="speaker">System</div><div id="text" class="text"></div><div id="choices"></div></div>
</div>

<script>
    // --- LERP PHYSICS & ENGINE SETUP ---
    const ctx = document.getElementById('c').getContext('2d');
    const keys = {}; window.addEventListener('keydown', e => keys[e.code] = true); window.addEventListener('keyup', e => keys[e.code] = false);
    
    // Smooth interpolation function
    const lerp = (start, end, amt) => (1 - amt) * start + amt * end;

    let state = 'MENU', frame = 0, lastHurt = 0;
    const player = { x: 400, y: 220, hp: 20, maxHp: 20, speed: 4.5 };
    let currentRoom = null, activeInteractable = null;
    let gullet = { depth: 0, targetSpeed: 0, currentSpeed: 0, mob: null };
    let activeMicro = null; 
    let camSway = { x: 0, y: 0, tx: 0, ty: 0 }; // Target vs Current for smooth swaying!

    // --- PROCEDURAL ANATOMY ---
    function makeAnatomy(id, name, bg, wall, acid, segments, isMicro = false) {
        let rooms = {}; let wM = isMicro ? 0.6 : 1.0; 
        rooms.Throat = { id: `${id}_Throat`, n: `${name}'s Throat`, type: 'throat', bg: bg, wall: wall, acid: acid, w: 250*wM, h: 440, aY: 999, dmg: 0, exits: { up: "ESCAPE", down: `${id}_Stomach` }, micros: [], npcs: [] };
        rooms.Stomach = { id: `${id}_Stomach`, n: `${name}'s Stomach`, type: 'stomach', bg: bg, wall: wall, acid: acid, w: 500*wM, h: 350*wM, aY: isMicro?280:300, dmg: isMicro?0.5:1, exits: { up: `${id}_Throat`, down: `${id}_Intestines_1` }, micros: [], npcs: [] };
        
        for(let i=1; i<=segments; i++) {
            let next = (i === segments) ? (isMicro ? "POOP_OUT" : "DIGESTED") : `${id}_Intestines_${i+1}`;
            let prev = (i === 1) ? `${id}_Stomach` : `${id}_Intestines_${i-1}`;
            rooms[`Intestines_${i}`] = { id: `${id}_Intestines_${i}`, n: `${name}'s Gut (${i})`, type: 'intestine', bg: wall, wall: '#000', acid: acid, w: (700 - i*50)*wM, h: 150*wM, aY: 250*wM, dmg: isMicro?1:1.5, exits: { up: prev, down: next }, micros: [], npcs: [] };
        }
        return rooms;
    }

    let worldDB = {
        "Toriel": makeAnatomy("Toriel", '#2a0015', '#4a0025', 'rgba(255, 68, 0, 0.7)', 3),
        "Muffet": makeAnatomy("Muffet", '#1a002a', '#2a003a', 'rgba(150, 0, 255, 0.8)', 3),
        "Chara": makeAnatomy("Chara", "Neko Chara", '#110022', '#220033', 'rgba(0,0,0,0)', 1, true) // Spacious, no acid!
    };

    // Custom Chara properties
    worldDB.Chara.Stomach.w = 600; worldDB.Chara.Stomach.h = 400; worldDB.Chara.Stomach.dmg = 0;

    // --- SMART AI & MICRO CREATURES ---
    class SmartNPC {
        constructor(id, name, x, y, color) {
            this.id = id; this.n = name; this.x = x; this.y = y; this.c = color; this.r = 15;
            this.gulpTries = 0; this.active = false;
        }
        update() {
            if (!this.active && player.hp < player.maxHp * 0.6) {
                this.active = true; // Spawn condition met!
                setUI("System", `* ${this.n} materialized in the stomach!`, []);
            }
            if (this.active) {
                // Smooth follow AI using Lerp
                this.x = lerp(this.x, player.x, 0.02);
                this.y = lerp(this.y, player.y - 40, 0.02); // Hovers above player
            }
        }
    }
    
    let nekoChara = new SmartNPC('Chara', 'Neko Chara', 400, -100, '#ff00aa');
    worldDB.Toriel.Stomach.npcs.push(nekoChara);

    class MicroCreature {
        constructor(type, x, y) {
            this.type = type; this.x = x; this.y = y; this.vx = (Math.random()-0.5)*4; this.vy = (Math.random()-0.5)*4;
            this.dead = Math.random() < 0.2; // 20% chance to be dead!
            this.uid = type + "_" + Math.floor(Math.random()*10000);
            
            if (type === 'Spider') { this.c = this.dead?'#333':'#000'; this.r = 12; this.bg = '#111'; this.w = '#000'; this.a = 'rgba(150,0,200,0.8)'; }
            if (type === 'Fly') { this.c = this.dead?'#aaa':'#fff'; this.r = 8; this.bg = '#222'; this.w = '#111'; this.a = 'rgba(200,200,0,0.6)'; }
            
            worldDB[this.uid] = makeAnatomy(this.uid, `${this.dead?'Dead':''} ${type}`, this.bg, this.w, this.a, type==='Fly'?4:2, true);
            
            // Nested ecosystems: Spiders have flies in them!
            if (type === 'Spider' && !this.dead) worldDB[this.uid].Stomach.micros.push(new MicroCreature('Fly', 400, 200));
        }
        update(acidY) {
            if (this.dead) {
                // Dead physics: Float smoothly in acid
                this.vx = lerp(this.vx, 0, 0.05); 
                this.y = lerp(this.y, acidY + 10, 0.05); 
            } else {
                // Live physics: erratic flying
                this.x += this.vx; this.y += this.vy;
                if(Math.random() < 0.1) { this.vx += (Math.random()-0.5)*3; this.vy += (Math.random()-0.5)*3; }
                this.vx = Math.max(-5, Math.min(5, this.vx)); this.vy = Math.max(-5, Math.min(5, this.vy));
            }
            // Wall bounce
            if(this.x < 250 || this.x > 550) this.vx *= -1;
            if(this.y < 100 || this.y > 350) this.vy *= -1;
        }
    }

    worldDB.Muffet.Stomach.micros.push(new MicroCreature('Spider', 300, 200), new MicroCreature('Spider', 500, 250));

    // --- UI & LOGIC ---
    function setUI(spk, txt, btns) {
        document.getElementById('speaker').innerText = spk; 
        document.getElementById('text').innerHTML = txt.replace(/\n/g, '<br>');
        let c = document.getElementById('choices'); c.innerHTML = '';
        if(btns) btns.forEach(b => { let btn = document.createElement('button'); btn.innerText = b.l; btn.onclick = b.a; c.appendChild(btn); });
    }

    function damage(amt) {
        player.hp -= amt; lastHurt = frame;
        document.getElementById('hp-val').innerText = Math.max(0, player.hp).toFixed(1);
        if (player.hp <= 0) { state = 'GAMEOVER'; setUI("System", "* Digested.", [{l: "Restart", a: initMenu}]); }
    }

    function triggerGulp(id, name, bg, isMicroObj = null) {
        state = 'GULLET'; gullet.depth = 0; gullet.mob = { id: id, n: name, bg: bg }; gullet.currentSpeed = 0;
        player.x = 400; player.y = 50; activeMicro = isMicroObj;
        setUI("System", `* Swallowed by ${name}!`, []);
    }

    function loadRoom(rId) {
        if (rId === "ESCAPE") { state = 'ESCAPED'; activeMicro = null; setUI("System", "* You escaped!", [{l: "Map", a: initMenu}]); return; }
        if (rId === "DIGESTED") { damage(999); return; }
        if (rId === "POOP_OUT") { damage(1.0); activeMicro = null; state = 'ESCAPED'; setUI("System", "* Escaped the abdomen! (-1 HP)", [{l: "Map", a: initMenu}]); return; }

        let pts = rId.split('_'); let mobId = pts[0]; 
        if(pts.length > 2 && !['Throat','Stomach','Intestines'].includes(pts[1])) { mobId = pts[0]+"_"+pts[1]; } 
        let rType = rId.replace(mobId+"_", "");

        currentRoom = worldDB[mobId][rType];
        document.getElementById('loc-val').innerText = currentRoom.n;
        state = 'INTERNAL'; activeInteractable = null;
        player.x = 400; player.y = currentRoom.type === 'throat' ? 50 : 220;
    }

    function initMenu() {
        state = 'MENU'; player.hp = player.maxHp; document.getElementById('hp-val').innerText = player.hp.toFixed(1); activeMicro = null;
        setUI("World Map", "* Approach a monster:", [
            { l: "Toriel (Has Neko Chara AI)", a: () => triggerGulp("Toriel", "Toriel", '#5a002a') },
            { l: "Muffet (Nested Dead/Alive Spiders)", a: () => triggerGulp("Muffet", "Muffet", '#2a003a') }
        ]);
    }

    // --- PHYSICS & INTERACTION ---
    function updatePhysics() {
        // SMOOTH SWAY LERPING
        if (activeMicro && !activeMicro.dead) {
            camSway.tx = activeMicro.vx * 6; camSway.ty = activeMicro.vy * 6;
        } else { camSway.tx = 0; camSway.ty = 0; }
        camSway.x = lerp(camSway.x, camSway.tx, 0.1);
        camSway.y = lerp(camSway.y, camSway.ty, 0.1);

        let spd = keys['ShiftLeft'] ? player.speed*0.5 : player.speed;
        let dx = 0, dy = 0;
        
        if (keys['KeyA'] || keys['ArrowLeft']) dx -= spd; if (keys['KeyD'] || keys['ArrowRight']) dx += spd;
        if (currentRoom.type === 'throat') { dy += 3; if (keys['KeyW']) dy -= 1.5; if (keys['KeyS']) dy += 2; } 
        else { if (keys['KeyW'] || keys['ArrowUp']) dy -= spd; if (keys['KeyS'] || keys['ArrowDown']) dy += spd; }

        player.x += dx; player.y += dy;

        let bL = 400 - currentRoom.w/2 + camSway.x, bR = 400 + currentRoom.w/2 + camSway.x;
        let bT = 220 - currentRoom.h/2 + camSway.y, bB = 220 + currentRoom.h/2 + camSway.y;

        if (player.y < bT && currentRoom.exits.up) { loadRoom(currentRoom.exits.up); return; }
        if (player.y > bB && currentRoom.exits.down) { loadRoom(currentRoom.exits.down); return; }

        player.x = Math.max(bL + 10, Math.min(bR - 10, player.x)); player.y = Math.max(bT, Math.min(bB, player.y)); 

        if (player.y > currentRoom.aY + camSway.y && frame % 15 === 0) damage(currentRoom.dmg);
        if (frame - lastHurt > 180 && player.hp < player.maxHp && frame % 10 === 0) { player.hp += 0.1; document.getElementById('hp-val').innerText = player.hp.toFixed(1); }

        // Interactions
        let touch = null;
        
        // Update Micros
        if (currentRoom.micros) {
            currentRoom.micros.forEach(m => { m.update(currentRoom.aY); if (Math.hypot(player.x - (m.x+camSway.x), player.y - (m.y+camSway.y)) < m.r + 15) touch = m; });
        }
        
        // Update NPCs (Chara)
        if (currentRoom.npcs) {
            currentRoom.npcs.forEach(n => {
                n.update();
                if (n.active && Math.hypot(player.x - (n.x+camSway.x), player.y - (n.y+camSway.y)) < n.r + 15) touch = n;
            });
        }

        if (touch !== activeInteractable) {
            activeInteractable = touch;
            if (activeInteractable) {
                if (activeInteractable instanceof MicroCreature) {
                    if (activeInteractable.dead) {
                        setUI("Dead " + activeInteractable.type, "* It's dead and floating in acid.", [ { l: "Crawl Inside", a: () => loadRoom(activeInteractable.uid + "_Throat") } ]);
                    } else {
                        setUI(activeInteractable.type, `* A live ${activeInteractable.type} buzzes around.`, [ { l: `Let ${activeInteractable.type} Eat You`, a: () => triggerGulp(activeInteractable.uid, activeInteractable.type, activeInteractable.bg, activeInteractable) } ]);
                    }
                } else if (activeInteractable.id === 'Chara') {
                    setUI("Neko Chara", "* Chara tilts her head.", [
                        { l: "Eat me, please?", a: () => {
                            activeInteractable.gulpTries++;
                            if (activeInteractable.gulpTries < 3) setUI("Neko Chara", "* Nya? No way. You look gross.", []);
                            else { setUI("Neko Chara", "* Ugh, fine. Get in.", []); setTimeout(() => triggerGulp("Chara", "Neko Chara", '#110022'), 1000); }
                        }}
                    ]);
                }
            } else if (state === 'INTERNAL') setUI("Anatomy", `* Exploring ${currentRoom.n}.`, []);
        }
    }

    // --- RENDER ---
    function loop() {
        frame++; ctx.clearRect(0, 0, 800, 440);

        if (state === 'MENU') {
            ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '50px VT323'; ctx.fillText("APEX ANATOMY ENGINE", 400, 200); ctx.textAlign = 'left';
        }
        else if (state === 'GULLET') {
            // Smooth falling physics
            gullet.targetSpeed = 6 + Math.sin(frame*0.1)*3; // Speed fluctuates
            gullet.currentSpeed = lerp(gullet.currentSpeed, gullet.targetSpeed, 0.05);
            gullet.depth += gullet.currentSpeed; 
            
            ctx.fillStyle = gullet.mob.bg; ctx.fillRect(0,0,800,440);
            ctx.fillStyle = '#000'; ctx.globalAlpha = 0.5; let scr = gullet.depth % 100;
            for(let i=-100; i<600; i+=100) { let w = Math.sin((i+frame)*0.05)*30; ctx.fillRect(0, i+scr, 300+w, 100); ctx.fillRect(500-w, i+scr, 300+w, 100); }
            ctx.globalAlpha = 1.0; ctx.fillStyle = '#f00'; ctx.fillRect(393, 220, 14, 14); 
            if (gullet.depth >= 300) loadRoom(gullet.mob.id + "_Throat");
        }
        else if (state === 'INTERNAL') {
            updatePhysics();
            ctx.fillStyle = currentRoom.wall; ctx.fillRect(0,0,800,440);
            
            let cx = 400 + camSway.x, cy = 220 + camSway.y, rw = currentRoom.w, rh = currentRoom.h, wob = Math.sin(frame*0.05)*8;
            
            // Fleshy Room with Parallax Depth
            ctx.fillStyle = '#000'; ctx.globalAlpha = 0.3; ctx.fillRect(cx - rw/2 - wob - 10, cy - rh/2 + wob - 10, rw + wob*2 + 20, rh - wob*2 + 20); ctx.globalAlpha = 1.0;
            ctx.fillStyle = currentRoom.bg; ctx.fillRect(cx - rw/2 - wob, cy - rh/2 + wob, rw + wob*2, rh - wob*2);

            ctx.fillStyle = currentRoom.acid; ctx.fillRect(cx - rw/2, currentRoom.aY + camSway.y, rw, (cy+rh/2) - currentRoom.aY);
            
            ctx.fillStyle = '#000'; ctx.globalAlpha = 0.6;
            if (currentRoom.exits.up) ctx.fillRect(cx - 50, cy - rh/2, 100, 20);
            if (currentRoom.exits.down) ctx.fillRect(cx - 50, cy + rh/2 - 20, 100, 20);
            ctx.globalAlpha = 1.0;

            if (currentRoom.micros) {
                currentRoom.micros.forEach(m => {
                    ctx.fillStyle = m.c; ctx.beginPath(); ctx.arc(m.x + camSway.x, m.y + camSway.y, m.r, 0, Math.PI*2); ctx.fill();
                    if(m.dead) { ctx.fillStyle='#f00'; ctx.fillRect(m.x-3+camSway.x, m.y-3+camSway.y, 6, 2); } // Dead eyes
                });
            }
            if (currentRoom.npcs) {
                currentRoom.npcs.forEach(n => {
                    if(n.active) { ctx.fillStyle = n.c; ctx.beginPath(); ctx.arc(n.x + camSway.x, n.y + camSway.y, n.r, 0, Math.PI*2); ctx.fill(); }
                });
            }

            ctx.fillStyle = '#f00'; ctx.fillRect(player.x-7, player.y-7, 14, 14);
        }

        requestAnimationFrame(loop);
    }
    initMenu(); loop();
</script>
</body>
</html>
