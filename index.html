<!DOCTYPE html>
<html>
<head>
    <title>Advanced Flappy Bird</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <div id="main-menu" class="menu-layer">
            <h1>FLAPPY PRO</h1>
            <button onclick="changeState('playing')">PLAY GAME</button>
            <button onclick="changeState('skins')">SKINS</button>
            <button onclick="changeState('achievements')">ACHIEVEMENTS</button>
        </div>

        <div id="skins-menu" class="menu-layer hidden">
            <h2>SELECT SKIN</h2>
            <button onclick="setSkin('skin-default')">Yellow (Free)</button>
            <button id="red-skin-btn" onclick="setSkin('skin-red')" style="opacity:0.5">Red (Score 10)</button>
            <button id="gold-skin-btn" onclick="setSkin('skin-gold')" style="opacity:0.5">Gold (Score 50)</button>
            <button onclick="changeState('menu')">BACK</button>
        </div>

        <div id="achievements-menu" class="menu-layer hidden">
            <h2>ACHIEVEMENTS</h2>
            <div id="ach-1" class="achievement-item">Beginner (Score 10)</div>
            <div id="ach-2" class="achievement-item">Master (Score 50)</div>
            <div id="ach-3" class="achievement-item">Survivor (1 Minute)</div>
            <button onclick="changeState('menu')">BACK</button>
        </div>

        <div id="score">0</div>
        <div id="bird" class="skin-default"></div>
        <div id="pipe-container"></div>
    </div>

    <script>
        const bird = document.getElementById('bird');
        const pipeContainer = document.getElementById('pipe-container');
        const scoreBoard = document.getElementById('score');
        
        // GAME STATE
        let currentState = 'menu';
        let birdY = 250;
        let velocity = 0;
        let gravity = 0.4;
        let score = 0;
        let pipes = [];
        let pipeDistance = 250; // FIXED: Pipes are now further apart

        // PERSISTENT DATA
        let highscore = 0;
        let unlockedSkins = { 'skin-default': true };

        function changeState(state) {
            document.querySelectorAll('.menu-layer').forEach(m => m.classList.add('hidden'));
            if (state === 'menu') document.getElementById('main-menu').classList.remove('hidden');
            if (state === 'skins') document.getElementById('skins-menu').classList.remove('hidden');
            if (state === 'achievements') document.getElementById('achievements-menu').classList.remove('hidden');
            
            if (state === 'playing') {
                resetGame();
                requestAnimationFrame(update);
            }
            currentState = state;
        }

        function setSkin(skinName) {
            if (unlockedSkins[skinName]) {
                bird.className = skinName;
                changeState('menu');
            } else {
                alert("This skin is locked!");
            }
        }

        function resetGame() {
            birdY = 250; velocity = 0; score = 0; pipes = [];
            pipeContainer.innerHTML = '';
            scoreBoard.innerText = "0";
        }

        function createPipe() {
            const gap = 140;
            const topH = Math.random() * 250 + 50;
            const type = Math.random() > 0.8 ? 'pipe-lava' : (Math.random() > 0.8 ? 'pipe-ice' : 'pipe-standard');
            
            const topPipe = document.createElement('div');
            topPipe.className = `pipe ${type}`;
            topPipe.style.height = topH + 'px';
            topPipe.style.left = '400px';
            topPipe.style.top = '0';

            const bottomPipe = document.createElement('div');
            bottomPipe.className = `pipe ${type}`;
            bottomPipe.style.height = (600 - topH - gap) + 'px';
            bottomPipe.style.left = '400px';
            bottomPipe.style.bottom = '0';

            pipeContainer.appendChild(topPipe);
            pipeContainer.appendChild(bottomPipe);
            pipes.push({ x: 400, top: topPipe, bottom: bottomPipe, passed: false, type: type });
        }

        function update() {
            if (currentState !== 'playing') return;

            velocity += gravity;
            birdY += velocity;
            bird.style.top = birdY + 'px';

            // Pipe spawning logic
            if (pipes.length === 0 || pipes[pipes.length - 1].x < (400 - pipeDistance)) {
                createPipe();
            }

            pipes.forEach((p, i) => {
                p.x -= (p.type === 'pipe-lava' ? 5 : 3); // Lava pipes move faster!
                p.top.style.left = p.x + 'px';
                p.bottom.style.left = p.x + 'px';

                // Scored
                if (p.x < 50 && !p.passed) {
                    score++;
                    scoreBoard.innerText = score;
                    p.passed = true;
                    checkAchievements();
                }

                // Collision
                const bRect = bird.getBoundingClientRect();
                const tRect = p.top.getBoundingClientRect();
                const btRect = p.bottom.getBoundingClientRect();

                if (bRect.right > tRect.left && bRect.left < tRect.right) {
                    if (bRect.top < tRect.bottom || bRect.bottom > btRect.top) {
                        changeState('menu');
                    }
                }
            });

            if (birdY > 580 || birdY < 0) changeState('menu');
            requestAnimationFrame(update);
        }

        function checkAchievements() {
            if (score >= 10) {
                document.getElementById('ach-1').classList.add('unlocked');
                unlockedSkins['skin-red'] = true;
                document.getElementById('red-skin-btn').style.opacity = "1";
            }
            if (score >= 50) {
                document.getElementById('ach-2').classList.add('unlocked');
                unlockedSkins['skin-gold'] = true;
                document.getElementById('gold-skin-btn').style.opacity = "1";
            }
        }

        window.addEventListener('keydown', (e) => { if(e.code === 'Space') velocity = -7; });
        document.getElementById('game-container').addEventListener('mousedown', () => { velocity = -7; });

    </script>
</body>
</html>
