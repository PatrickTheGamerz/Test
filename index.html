<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flappy CSS Bird</title>
    <style>
        /* =========================================
           CSS: THIS IS WHERE WE MAKE IT LOOK GOOD
           ========================================= */
        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; /* Stops text highlighting when clicking */
        }

        #game-container {
            width: 400px;
            height: 500px;
            /* A nice CSS gradient sky */
            background: linear-gradient(to bottom, #70c5ce 0%, #e0f6ff 100%);
            position: relative;
            overflow: hidden;
            border: 6px solid #444;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        #bird {
            width: 34px;
            height: 24px;
            /* CSS making a cute yellow bird */
            background-color: #f1c40f;
            border: 2px solid #333;
            border-radius: 50% 50% 40% 40%;
            position: absolute;
            top: 250px;
            left: 50px;
            box-shadow: inset -3px -3px 0px rgba(0,0,0,0.2);
            /* Smoothly tilts the bird */
            transition: transform 0.1s ease; 
        }

        /* The little wing on the bird made entirely of CSS! */
        #bird::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 4px;
            width: 12px;
            height: 8px;
            background-color: #fff;
            border: 1px solid #333;
            border-radius: 10px 10px 2px 2px;
        }

        .pipe {
            width: 60px;
            background: linear-gradient(to right, #73bf2e 0%, #548c22 100%);
            border: 2px solid #333;
            position: absolute;
            left: 400px; /* Starts off-screen to the right */
        }

        #pipe-top {
            top: 0;
            border-bottom: 6px solid #333;
        }

        #pipe-bottom {
            bottom: 0;
            border-top: 6px solid #333;
        }

        #score-board {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 40px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            z-index: 10;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none; /* Hidden until you crash */
            z-index: 20;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="score-board">0</div>
        <div id="bird"></div>
        <div id="pipe-top" class="pipe"></div>
        <div id="pipe-bottom" class="pipe"></div>
        <div id="game-over">CRASHED!<br><br>Click here to restart</div>
    </div>

    <script>
        /* =========================================
           JAVASCRIPT: THE BRAINS & PHYSICS
           ========================================= */
        const bird = document.getElementById('bird');
        const pipeTop = document.getElementById('pipe-top');
        const pipeBottom = document.getElementById('pipe-bottom');
        const scoreBoard = document.getElementById('score-board');
        const gameOverScreen = document.getElementById('game-over');

        // Game Variables
        let birdY = 250;
        let velocity = 0;
        let gravity = 0.5;
        let pipeX = 400;
        let score = 0;
        let isGameOver = false;
        let pipeGap = 130; 
        let topPipeHeight = 150;

        // Make the bird jump
        function flap() {
            if (isGameOver) return;
            velocity = -7; // Pushes the bird up
            bird.style.transform = "rotate(-20deg)"; // Point up
        }

        // Listen for clicks or spacebar
        document.addEventListener('mousedown', flap);
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') flap();
        });

        // Restart the game
        gameOverScreen.addEventListener('click', () => {
            birdY = 250;
            velocity = 0;
            pipeX = 400;
            score = 0;
            isGameOver = false;
            scoreBoard.innerText = score;
            gameOverScreen.style.display = 'none';
            gameLoop();
        });

        // The main game loop running 60 times a second
        function gameLoop() {
            if (isGameOver) return;

            // 1. Bird Physics
            velocity += gravity;
            birdY += velocity;
            bird.style.top = birdY + 'px';

            // Point bird down when falling
            if (velocity > 3) {
                bird.style.transform = "rotate(20deg)";
            }

            // 2. Move Pipes
            pipeX -= 3; // Speed of pipes
            
            // If pipe goes off screen, reset it to the right
            if (pipeX < -60) {
                pipeX = 400;
                score++;
                scoreBoard.innerText = score;
                // Randomize the next pipe heights
                topPipeHeight = Math.floor(Math.random() * 200) + 50;
            }

            // Apply pipe positions
            pipeTop.style.left = pipeX + 'px';
            pipeBottom.style.left = pipeX + 'px';
            pipeTop.style.height = topPipeHeight + 'px';
            pipeBottom.style.height = (500 - topPipeHeight - pipeGap) + 'px';

            // 3. Collision Detection (The Math)
            const birdRect = bird.getBoundingClientRect();
            const topPipeRect = pipeTop.getBoundingClientRect();
            const bottomPipeRect = pipeBottom.getBoundingClientRect();
            const containerRect = document.getElementById('game-container').getBoundingClientRect();

            // Check if bird hits the floor or ceiling
            if (birdY > 470 || birdY < 0) {
                crash();
            }

            // Check if bird hits the pipes
            if (
                birdRect.right > topPipeRect.left &&
                birdRect.left < topPipeRect.right &&
                (birdRect.top < topPipeRect.bottom || birdRect.bottom > bottomPipeRect.top)
            ) {
                crash();
            }

            // Keep the loop running
            requestAnimationFrame(gameLoop);
        }

        function crash() {
            isGameOver = true;
            gameOverScreen.style.display = 'block';
        }

        // Start the game for the first time
        gameLoop();
    </script>

</body>
</html>
