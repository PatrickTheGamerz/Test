<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Undertale: Determination Protocol (Chara)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body { background: #000; color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'VT323', monospace; overflow: hidden; }
        #game-container { display: flex; width: 950px; height: 600px; border: 4px solid #333; box-shadow: 0 0 50px rgba(255, 0, 0, 0.2); background: #000; }
        
        /* Left Side: Battle */
        #battle-side { width: 500px; border-right: 4px solid #333; display: flex; flex-direction: column; align-items: center; justify-content: space-around; padding: 20px; position: relative; }
        #battle-box { width: 300px; height: 250px; border: 4px solid #fff; position: relative; overflow: hidden; background: #000; }
        #soul { width: 16px; height: 16px; position: absolute; background: #ff0000; transition: transform 0.05s linear; z-index: 5; clip-path: path('M8 2.1C8 2.1 7.4 0 4.2 0 1.2 0 0 2.4 0 4.4 0 8.4 8 13.5 8 13.5S16 8.4 16 4.4C16 2.4 14.8 0 11.8 0 8.6 0 8 2.1 8 2.1Z'); }
        .bullet { position: absolute; background: #fff; border-radius: 50%; }

        /* Determination UI */
        #control-panel { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        #control-bar-bg { width: 80%; height: 20px; background: #222; border: 2px solid #555; position: relative; }
        #control-bar-fill { width: 0%; height: 100%; background: #ff0000; box-shadow: 0 0 15px #ff0000; transition: width 0.5s ease; }
        #control-text { color: #ff0000; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; }

        /* Right Side: Narrative */
        #chat-side { width: 450px; display: flex; flex-direction: column; background: #050505; }
        #chat-log { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; font-size: 24px; color: #ffaa00; }
        .msg-chara { color: #ff0000; text-shadow: 0 0 5px rgba(255,0,0,0.5); border-left: 2px solid #ff0000; padding-left: 10px; }
        .msg-player { color: #fff; align-self: flex-end; opacity: 0.8; }
        
        #input-area { display: flex; border-top: 2px solid #333; }
        #chat-input { flex-grow: 1; background: transparent; border: none; color: #fff; padding: 15px; font-family: inherit; font-size: 24px; outline: none; }
        #btn-area { display: flex; justify-content: center; gap: 10px; padding: 10px; }
        .game-btn { background: #000; border: 2px solid #ffaa00; color: #ffaa00; font-family: inherit; font-size: 20px; cursor: pointer; padding: 5px 15px; transition: 0.2s; }
        .game-btn:hover:not(:disabled) { background: #ffaa00; color: #000; }
        .game-btn:disabled { border-color: #333; color: #333; cursor: not-allowed; }

        #api-overlay { position: absolute; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="api-overlay" class="hidden">
        <h1 style="color: #ff0000;">PROTOCOL: CONNECTION</h1>
        <input type="text" id="api-input" placeholder="Enter Gemini API Key..." style="width: 300px; padding: 10px; font-family: inherit; font-size: 20px; text-align: center;">
        <button onclick="saveKey()" class="game-btn">INITIALIZE</button>
    </div>

    <div id="battle-side">
        <div id="control-panel">
            <div id="control-text">CHARA'S CONTROL: <span id="control-val">0</span>%</div>
            <div id="control-bar-bg"><div id="control-bar-fill"></div></div>
        </div>
        
        <div id="battle-box">
            <div id="soul"></div>
        </div>

        <div id="btn-area">
            <button id="btn-fight" class="game-btn" onclick="act('FIGHT')">FIGHT</button>
            <button id="btn-mercy" class="game-btn" onclick="act('MERCY')">MERCY</button>
        </div>
    </div>

    <div id="chat-side">
        <div id="chat-log"></div>
        <div id="input-area">
            <input type="text" id="chat-input" placeholder="Say something..." autocomplete="off">
        </div>
    </div>
</div>

<script>
    let apiKey = localStorage.getItem('chara_api_key');
    let charaControl = 0; // 0 to 100
    const soul = document.getElementById('soul');
    const battleBox = document.getElementById('battle-box');
    const soulPos = { x: 142, y: 117 };
    const keys = {};
    let bullets = [];
    let frame = 0;

    // --- INITIALIZATION ---
    if (!apiKey) {
        document.getElementById('api-overlay').classList.remove('hidden');
    } else {
        startGame();
    }

    function saveKey() {
        const input = document.getElementById('api-input').value.trim();
        if(input.startsWith("AIza")) {
            localStorage.setItem('chara_api_key', input);
            apiKey = input;
            document.getElementById('api-overlay').classList.add('hidden');
            startGame();
        }
    }

    function startGame() {
        requestAnimationFrame(loop);
        logMsg("Chara", "Greetings. I am Chara.", "msg-chara");
    }

    // --- CONTROLS & AGENCY ---
    window.onkeydown = (e) => keys[e.code] = true;
    window.onkeyup = (e) => keys[e.code] = false;

    function moveSoul() {
        if (charaControl >= 100) return; // Full control: Player can't move

        let moveSpeed = 3;
        
        // CHANCE TO GLITCH: If control > 50, Chara occasionally hijacks movement
        if (charaControl > 50 && Math.random() < (charaControl / 200)) {
            soulPos.x += (Math.random() - 0.5) * 10;
            soulPos.y += (Math.random() - 0.5) * 10;
        }

        if (keys['KeyW'] || keys['ArrowUp']) soulPos.y -= moveSpeed;
        if (keys['KeyS'] || keys['ArrowDown']) soulPos.y += moveSpeed;
        if (keys['KeyA'] || keys['ArrowLeft']) soulPos.x -= moveSpeed;
        if (keys['KeyD'] || keys['ArrowRight']) soulPos.x += moveSpeed;

        // Boundaries
        soulPos.x = Math.max(0, Math.min(284, soulPos.x));
        soulPos.y = Math.max(0, Math.min(234, soulPos.y));

        soul.style.left = soulPos.x + 'px';
        soul.style.top = soulPos.y + 'px';
    }

    // --- BATTLE MECHANICS ---
    function spawnBullet() {
        if (frame % 40 === 0) {
            bullets.push({
                x: Math.random() * 300,
                y: -10,
                vy: 2 + (charaControl / 20),
                r: 6,
                el: document.createElement('div')
            });
            let b = bullets[bullets.length-1];
            b.el.className = 'bullet';
            b.el.style.width = b.r*2 + 'px';
            b.el.style.height = b.r*2 + 'px';
            battleBox.appendChild(b.el);
        }
    }

    function updateBullets() {
        bullets.forEach((b, i) => {
            b.y += b.vy;
            b.el.style.top = b.y + 'px';
            b.el.style.left = b.x + 'px';

            // Hit detection
            let dx = b.x - soulPos.x;
            let dy = b.y - soulPos.y;
            if (Math.sqrt(dx*dx + dy*dy) < b.r + 8) {
                shiftControl(0.5); // Getting hit increases Chara's control
            }

            if (b.y > 250) {
                b.el.remove();
                bullets.splice(i, 1);
            }
        });
    }

    function shiftControl(amt) {
        charaControl = Math.max(0, Math.min(100, charaControl + amt));
        document.getElementById('control-bar-fill').style.width = charaControl + '%';
        document.getElementById('control-val').innerText = Math.floor(charaControl);

        // AGENCY LOSS LOGIC
        if (charaControl > 80) {
            document.getElementById('btn-mercy').disabled = true; // Chara won't let you be nice
        }
        if (charaControl >= 100) {
            document.getElementById('btn-fight').disabled = true;
            document.getElementById('chat-input').placeholder = "Your soul is no longer yours.";
        }
    }

    async function act(type) {
        if (type === 'FIGHT') {
            logMsg("You", "* You lashed out.", "msg-player");
            shiftControl(10);
        } else {
            logMsg("You", "* You reached out for Mercy.", "msg-player");
            shiftControl(-5);
        }
        sendChat(`[Player chose ${type}]`);
    }

    // --- AI & CHAT ---
    async function sendChat(overrideText = null) {
        const input = document.getElementById('chat-input');
        const text = overrideText || input.value.trim();
        if (!text || isAiTyping) return;

        if(!overrideText) logMsg("You", text, "msg-player");
        input.value = "";
        isAiTyping = true;

        const systemPrompt = `You are Chara from Undertale. You are the fallen human.
Tone: Cold, philosophical, manipulative, sometimes mockingly sweet. 
Current Player Control: ${charaControl}%.
Goal: You want to take over the player's soul. As Control approaches 100%, you become more dominant and possessive.
You MUST respond in JSON format: {"reply": "your text", "controlMod": number_between_-5_and_10}`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    contents: [{ role: "user", parts: [{ text: text }] }],
                    generationConfig: { temperature: 0.9, responseMimeType: "application/json" }
                })
            });

            const data = await response.json();
            const res = JSON.parse(data.candidates[0].content.parts[0].text);
            logMsg("Chara", res.reply, "msg-chara");
            shiftControl(res.controlMod || 0);
        } catch (e) {
            logMsg("System", "* The connection is dying.", "msg-chara");
        } finally {
            isAiTyping = false;
        }
    }

    document.getElementById('chat-input').onkeypress = (e) => {
        if(e.key === 'Enter') sendChat();
    }

    function logMsg(sender, text, cls) {
        const log = document.getElementById('chat-log');
        const div = document.createElement('div');
        div.className = cls;
        div.innerText = (sender === "Chara" ? "" : "") + text;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
    }

    let isAiTyping = false;
    function loop() {
        frame++;
        moveSoul();
        spawnBullet();
        updateBullets();
        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
