<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Undertale: Determination Protocol V13</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        :root { --red: #ff0000; --yellow: #ffff00; --white: #ffffff; --orange: #ffaa00; --green: #00ff00; --blue: #00a2ff; --bg: #000000; }
        body { background: var(--bg); color: var(--white); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'VT323', monospace; overflow: hidden; }
        #game-container { display: flex; width: 1100px; height: 750px; border: 4px solid #333; background: var(--bg); position: relative; box-shadow: 0 0 50px rgba(255,0,0,0.4); }

        /* Save Menu */
        #menu-overlay { position: absolute; inset: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .save-slot { width: 450px; padding: 20px; border: 3px solid var(--white); margin: 10px; cursor: pointer; background: #080808; transition: 0.1s; }
        .save-slot:hover { border-color: var(--red); color: var(--red); transform: scale(1.02); }

        /* Battle side */
        #battle-side { width: 620px; border-right: 4px solid #222; display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }
        #monster-sprite { height: 160px; font-size: 100px; display: flex; align-items: center; justify-content: center; position: relative; }
        
        #battle-box { width: 440px; height: 260px; border: 6px solid var(--white); background: var(--bg); position: relative; overflow: hidden; margin: 15px 0; }
        #soul { width: 18px; height: 18px; position: absolute; background: var(--red); z-index: 100; clip-path: path('M9 2.1C9 2.1 8.4 0 4.2 0 1.2 0 0 2.4 0 4.4 0 8.4 9 13.5 9 13.5S18 8.4 18 4.4C18 2.4 16.8 0 13.8 0 10.6 0 9 2.1 9 2.1Z'); }
        .bullet { position: absolute; border-radius: 50%; }

        /* Fight Bar */
        #fight-ui { position: absolute; inset: 0; background: rgba(0,0,0,0.96); display: none; align-items: center; justify-content: center; z-index: 500; }
        #target-area { width: 380px; height: 120px; border: 4px solid var(--white); position: relative; background: url('https://raw.githubusercontent.com/FryingPan/undertale-fight-assets/master/images/target.png') center/cover; }
        #slider { width: 14px; height: 100%; background: #fff; position: absolute; left: 0; box-shadow: 0 0 15px #fff; }

        #stat-ui { width: 100%; display: flex; justify-content: space-between; font-size: 32px; }
        #hp-bar-bg { width: 140px; height: 22px; background: var(--red); border: 2px solid #000; }
        #hp-bar-fill { height: 100%; background: var(--yellow); transition: width 0.2s; }

        #action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .act-btn { background: #000; border: 3px solid var(--orange); color: var(--orange); font-family: inherit; font-size: 30px; padding: 10px; cursor: pointer; text-align: center; }
        .act-btn:disabled { opacity: 0.3; cursor: default; }

        /* Chat side */
        #chat-side { width: 480px; display: flex; flex-direction: column; background: #050505; border-left: 2px solid #222; }
        #chat-log { flex-grow: 1; padding: 25px; overflow-y: auto; font-size: 24px; color: var(--orange); }
        .msg-chara { color: var(--red); border-left: 3px solid var(--red); padding-left: 12px; margin-bottom: 20px; }
        .msg-player { color: var(--white); align-self: flex-end; opacity: 0.6; margin-bottom: 15px; }
        #chat-input { background: #000; border: none; border-top: 2px solid #333; color: var(--white); font-family: inherit; font-size: 26px; padding: 15px; outline: none; }
        
        .slash-vfx { position: absolute; width: 120px; height: 120px; background: white; clip-path: polygon(0 45%, 100% 45%, 100% 55%, 0 55%); z-index: 600; animation: slashAnim 0.15s linear forwards; }
        @keyframes slashAnim { 0% { transform: scaleY(0); } 50% { transform: scaleY(6); } 100% { transform: scaleY(0); opacity: 0; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="menu-overlay">
        <h1 style="color: var(--red); font-size: 60px;">PROTOCOL V13</h1>
        <div id="save-slots"></div>
        <button class="act-btn" onclick="promptKey()" style="font-size: 20px; margin-top: 20px;">LINK NARRATOR CORE</button>
    </div>

    <div id="battle-side">
        <div id="stat-ui">
            <span id="lv-val">LV 1</span>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span>HP</span>
                <div id="hp-bar-bg"><div id="hp-bar-fill"></div></div>
                <span id="hp-txt">20/20</span>
            </div>
        </div>
        
        <div style="width:100%; text-align:center; color: #666; font-size: 18px; margin: 5px 0;">
            DEF: <span id="p-def">10</span> | SYNC: <span id="sync-val" style="color:red">0</span>% | EXP: <span id="exp-val">0</span>
        </div>

        <div id="monster-sprite"></div>

        <div id="battle-box">
            <div id="soul"></div>
            <div id="fight-ui">
                <div id="target-area"><div id="slider"></div></div>
            </div>
        </div>

        <div id="action-grid">
            <button class="act-btn" id="btn-FIGHT" onclick="userAction('FIGHT')">FIGHT</button>
            <button class="act-btn" id="btn-ACT" onclick="userAction('ACT')">ACT</button>
            <button class="act-btn" id="btn-ITEM" onclick="userAction('ITEM')">ITEM</button>
            <button class="act-btn" id="btn-MERCY" onclick="userAction('MERCY')">MERCY</button>
        </div>
    </div>

    <div id="chat-side">
        <div id="chat-log"></div>
        <input type="text" id="chat-input" placeholder="Initiate thought..." autocomplete="off">
    </div>
</div>

<script>
    // --- PERSISTENCE ---
    const DB_KEY = 'UT_CHARA_V13_FINAL';
    let appData = JSON.parse(localStorage.getItem(DB_KEY)) || { slots: [null,null,null], apiKey: "" };
    let curIdx = null;

    // --- GAME STATE ---
    let lv = 1, hp = 20, maxHp = 20, exp = 0, sync = 0, learning = 0;
    let turn = 'MENU', region = 'RUINS', defeated = [];
    let enemy = null, bullets = [], frame = 0, turnFrames = 0;
    let soulPos = { x: 211, y: 121 }, moving = false;
    let sliderX = 0, sliderDir = 7.5, sliderTime = 0;
    const keys = {};

    const Monsters = {
        RUINS: [
            { n: "Froggit", hp: 20, def: 4, exp: 20, art: "🐸", patterns: ['FROG_FLY', 'FROG_JUMP'] },
            { n: "Whimsun", hp: 10, def: 0, exp: 10, art: "🦋", patterns: ['WHIM_DRIFT'] },
            { n: "Moldsmal", hp: 12, def: 0, exp: 3, art: "🍮", patterns: ['MOLD_SINE'] },
            { n: "Vegetoid", hp: 20, def: 6, exp: 6, art: "🥕", patterns: ['VEG_FALL'] }
        ]
    };

    function save() {
        if(curIdx !== null) appData.slots[curIdx] = { lv, hp, exp, sync, learning, region, defeated, name: appData.slots[curIdx].name };
        localStorage.setItem(DB_KEY, JSON.stringify(appData));
    }

    function initMenu() {
        const slots = document.getElementById('save-slots'); slots.innerHTML = '';
        appData.slots.forEach((s, i) => {
            const d = document.createElement('div');
            d.className = `save-slot ${s ? '' : 'empty'}`;
            d.innerHTML = s ? `NAME: ${s.name} | LV ${s.lv} | SYNC ${Math.floor(s.sync)}%` : `-- EMPTY --`;
            d.onclick = () => s ? loadSlot(i) : createSlot(i);
            slots.appendChild(d);
        });
    }

    function createSlot(i) {
        let n = prompt("Name:"); if(!n) return;
        appData.slots[i] = { name: n, lv: 1, hp: 20, exp: 0, sync: 0, learning: 0, region: 'RUINS', defeated: [] };
        save(); initMenu();
    }

    function loadSlot(i) {
        curIdx = i; const s = appData.slots[i];
        lv = s.lv; hp = 20; exp = s.exp; sync = s.sync; learning = s.learning;
        document.getElementById('menu-overlay').classList.add('hidden');
        updateStats(); spawnEnemy();
        requestAnimationFrame(mainLoop);
    }

    function promptKey() { let k = prompt("Gemini Key:"); if(k) { appData.apiKey = k; save(); } }

    // --- GAME ENGINE ---
    window.onkeydown = e => {
        keys[e.code] = true;
        if((e.code === 'KeyZ' || e.code === 'Enter') && turn === 'FIGHT_BAR') {
            stopSlider();
        }
    };
    window.onkeyup = e => keys[e.code] = false;

    function mainLoop() {
        if(turn === 'SURVIVAL') runSurvival();
        if(turn === 'FIGHT_BAR') runFightBar();
        frame++; requestAnimationFrame(mainLoop);
    }

    function spawnEnemy() {
        const list = Monsters[region];
        enemy = { ...list[Math.floor(Math.random()*list.length)] };
        document.getElementById('monster-sprite').innerText = enemy.art;
        logMsg("System", `* ${enemy.n} appeared.`, "");
        decideTurn();
    }

    function decideTurn() {
        if(Math.random()*100 < sync) {
            turn = 'CHARA';
            document.getElementById('soul').style.background = "var(--white)";
            document.querySelectorAll('.act-btn').forEach(b => b.disabled = true);
            setTimeout(() => { if(hp < 8) useHeal(); else startFightUI(); }, 1000);
        } else {
            turn = 'PLAYER';
            document.getElementById('soul').style.background = "var(--red)";
            document.querySelectorAll('.act-btn').forEach(b => b.disabled = false);
        }
    }

    function userAction(a) {
        if(turn !== 'PLAYER') return;
        if(a === 'FIGHT') startFightUI();
        if(a === 'ITEM') useHeal();
        if(a === 'MERCY') { logMsg("You", "* Spare.", "msg-player"); sync -= 2; save(); spawnEnemy(); }
        if(a === 'ACT') { logMsg("You", "* Scan.", "msg-player"); startDodgePhase(); }
    }

    // --- THE FIGHT BAR (FIXED FOR CHARA) ---
    function startFightUI() {
        turn = 'FIGHT_BAR';
        sliderX = 0; sliderTime = 0;
        document.getElementById('fight-ui').style.display = 'flex';
    }

    function runFightBar() {
        sliderX += sliderDir;
        sliderTime++;
        if(sliderX > 365 || sliderX < 0) sliderDir *= -1;
        document.getElementById('slider').style.left = sliderX + 'px';

        // CHARA AI DECISION
        if(turn === 'CHARA') {
            // Chara waits for a high-damage spot OR the 6-second timer (360 frames)
            let distanceToCenter = Math.abs(190 - sliderX);
            let perfectThreshold = 10 + (learning / 5); // Gets better over time

            if(distanceToCenter < perfectThreshold || sliderTime > 360) {
                stopSlider();
            }
        }
    }

    function stopSlider() {
        if(turn !== 'FIGHT_BAR' && turn !== 'CHARA') return;
        
        // Disable further hits for this turn
        const currentTurn = turn;
        turn = 'ANIMATING'; 

        document.getElementById('fight-ui').style.display = 'none';
        
        let dist = Math.abs(190 - sliderX);
        let precision = Math.max(0.1, (1 - (dist / 190)));
        
        // DAMAGE FORMULA: LV 1 Stick (1-10 DMG)
        let baseAtk = 10 + (lv-1)*2;
        let finalDmg = 1;
        if(precision > 0.85) {
            finalDmg = Math.floor(Math.max(1, (baseAtk - enemy.def)) * (precision * 1.5));
        }
        let cap = 10 + (lv-1)*2;
        finalDmg = Math.min(cap, finalDmg);

        enemy.hp -= finalDmg;

        // Visual Slash
        let slash = document.createElement('div');
        slash.className = 'slash-vfx';
        document.getElementById('monster-sprite').appendChild(slash);
        setTimeout(() => slash.remove(), 200);

        logMsg(currentTurn === 'CHARA' ? "Chara" : "You", `* Dealt ${finalDmg} damage.`, currentTurn === 'CHARA' ? "msg-chara" : "msg-player");

        setTimeout(() => {
            if(enemy.hp <= 0) handleVictory();
            else startDodgePhase();
        }, 600);
    }

    function handleVictory() {
        exp += enemy.exp; sync = Math.min(100, sync + 2); learning = Math.min(100, learning + 1);
        if(exp >= lv*150) { lv++; hp = maxHp = 20 + (lv-1)*4; logMsg("Chara", "* Level up.", "msg-chara"); }
        save(); updateStats(); spawnEnemy();
    }

    // --- SURVIVAL ---
    function startDodgePhase() { turn = 'SURVIVAL'; turnFrames = 380; bullets = []; }

    function runSurvival() {
        let isSynced = (sync >= 100) || (Math.random()*100 < sync);
        const sEl = document.getElementById('soul');
        sEl.style.background = isSynced ? "var(--white)" : "var(--red)";

        moving = false;
        if(isSynced) {
            // Chara AI Nav
            let near = null, d = 70;
            bullets.forEach(b => { let dist = Math.hypot(b.x-soulPos.x, b.y-soulPos.y); if(dist < d){ d = dist; near = b; }});
            if(near) {
                if(near.isBlue && learning > 50) { moving = false; } 
                else {
                    moving = true;
                    soulPos.x += (near.x > soulPos.x ? -3.5 : 3.5);
                    soulPos.y += (near.y > soulPos.y ? -3.5 : 3.5);
                }
            }
        } else {
            let s = keys['ShiftLeft'] ? 1.5 : 4;
            if(keys['ArrowUp'] || keys['KeyW']) { soulPos.y -= s; moving = true; }
            if(keys['ArrowDown'] || keys['KeyS']) { soulPos.y += s; moving = true; }
            if(keys['ArrowLeft'] || keys['KeyA']) { soulPos.x -= s; moving = true; }
            if(keys['ArrowRight'] || keys['KeyD']) { soulPos.x += s; moving = true; }
        }

        soulPos.x = Math.max(0, Math.min(422, soulPos.x));
        soulPos.y = Math.max(0, Math.min(242, soulPos.y));
        sEl.style.left = soulPos.x + 'px'; sEl.style.top = soulPos.y + 'px';

        if(frame % 25 === 0) spawnBulletPattern();

        for(let i=bullets.length-1; i>=0; i--) {
            let b = bullets[i]; b.x += b.vx; b.y += b.vy;
            b.el.style.left = b.x + 'px'; b.el.style.top = b.y + 'px';
            if(Math.hypot(b.x-soulPos.x, b.y-soulPos.y) < 14) {
                if(b.isBlue && !moving) { /* safe */ }
                else if(b.isGreen) { hp = Math.min(maxHp, hp+2); b.el.remove(); bullets.splice(i,1); }
                else {
                    hp -= 1; b.el.remove(); bullets.splice(i,1);
                    if(hp <= 0) { alert("DEAD."); location.reload(); }
                }
            } else if(b.y > 280 || b.x > 450) { b.el.remove(); bullets.splice(i,1); }
        }

        turnFrames--;
        if(turnFrames <= 0) { bullets.forEach(b => b.el.remove()); decideTurn(); }
    }

    function spawnBulletPattern() {
        const p = enemy.patterns[Math.floor(Math.random()*enemy.patterns.length)];
        let x = Math.random()*440, y = -10, vx = 0, vy = 4, isG = false, isB = false;
        if(p === 'FROG_JUMP') { y = 260; vy = -5; vx = (Math.random()-0.5)*2; }
        if(p === 'VEG_FALL') { vy = 3+Math.random()*3; isG = Math.random()<0.2; }
        if(p === 'BLUE_SLASH') { x = -10; y = soulPos.y; vx = 6; vy = 0; isB = true; }
        
        let b = { x, y, vx, vy, isGreen: isG, isBlue: isB, el: document.createElement('div') };
        b.el.className = 'bullet'; b.el.style.width = '16px'; b.el.style.height = '16px';
        if(isG) b.el.style.background = "var(--green)";
        else if(isB) b.el.style.background = "var(--blue)";
        else b.el.style.background = "var(--white)";
        document.getElementById('battle-box').appendChild(b.el); bullets.push(b);
    }

    function useHeal() { hp = Math.min(maxHp, hp + 15); logMsg("System", "* Healed.", "msg-player"); updateStats(); startDodgePhase(); }

    function updateStats() {
        maxHp = 20 + (lv-1)*4;
        document.getElementById('lv-val').innerText = `LV ${lv}`;
        document.getElementById('hp-txt').innerText = `${Math.ceil(hp)}/${maxHp}`;
        document.getElementById('hp-bar-fill').style.width = (hp/maxHp)*100 + "%";
        document.getElementById('sync-val').innerText = Math.floor(sync);
        document.getElementById('exp-val').innerText = exp;
        document.getElementById('p-def').innerText = 10 + (lv-1);
    }

    async function talkAI(txt) {
        if(!appData.apiKey) return;
        const prompt = `You are Chara. LV ${lv}, Sync ${sync}%. Player: "${txt}". JSON: {"reply": "...", "controlMod": number}`;
        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${appData.apiKey}`, {
                method: 'POST', body: JSON.stringify({ contents: [{role: "user", parts: [{text: prompt}]}], generationConfig: {responseMimeType: "application/json"} })
            });
            const d = await r.json(); const res = JSON.parse(d.candidates[0].content.parts[0].text);
            logMsg("Chara", res.reply, "msg-chara"); sync = Math.min(100, Math.max(0, sync + res.controlMod)); updateStats();
        } catch(e) {}
    }

    document.getElementById('chat-input').onkeypress = e => { if(e.key === 'Enter'){ logMsg("You", e.target.value, "msg-player"); talkAI(e.target.value); e.target.value = ''; }};
    function logMsg(s, t, c) { const l = document.getElementById('chat-log'); const d = document.createElement('div'); d.className = c; d.innerText = t; l.appendChild(d); l.scrollTop = l.scrollHeight; }

    initMenu();
</script>
</body>
</html>
