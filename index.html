<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Undertale: The Chara Protocol v4</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        :root { --red: #ff0000; --yellow: #ffff00; --white: #ffffff; --bg: #000000; }
        body { background: var(--bg); color: var(--white); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'VT323', monospace; overflow: hidden; }
        
        #game-container { display: flex; width: 1100px; height: 700px; border: 4px solid #333; background: var(--bg); position: relative; box-shadow: 0 0 40px rgba(255,0,0,0.1); }

        /* Save Selection Overlay */
        #menu-overlay { position: absolute; inset: 0; background: var(--bg); z-index: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .save-slot { width: 450px; padding: 20px; border: 3px solid var(--white); margin: 10px; cursor: pointer; transition: 0.2s; position: relative; background: #050505; }
        .save-slot:hover { border-color: var(--red); background: #110000; transform: scale(1.02); }
        .save-slot.empty { border-style: dashed; opacity: 0.5; }
        .del-btn { position: absolute; right: 15px; top: 15px; color: var(--red); border: 1px solid var(--red); padding: 2px 8px; font-size: 18px; }

        /* Battle Viewport */
        #battle-side { width: 600px; border-right: 4px solid #222; display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }
        #battle-box { width: 360px; height: 300px; border: 5px solid var(--white); background: var(--bg); position: relative; overflow: hidden; margin: 20px 0; }
        #soul { width: 18px; height: 18px; position: absolute; background: var(--red); z-index: 100; clip-path: path('M9 2.1C9 2.1 8.4 0 4.2 0 1.2 0 0 2.4 0 4.4 0 8.4 9 13.5 9 13.5S18 8.4 18 4.4C18 2.4 16.8 0 13.8 0 10.6 0 9 2.1 9 2.1Z'); }
        .bullet { position: absolute; background: var(--white); border-radius: 50%; box-shadow: 0 0 8px var(--white); }

        /* Combat Interface */
        #stat-ui { width: 100%; display: flex; align-items: center; justify-content: space-between; font-size: 32px; margin-bottom: 10px; }
        #hp-container { display: flex; align-items: center; gap: 10px; }
        #hp-bar { width: 120px; height: 22px; background: var(--red); border: 2px solid #000; position: relative; }
        #hp-fill { height: 100%; background: var(--yellow); width: 100%; transition: width 0.3s; }
        
        #control-ui { width: 100%; text-align: center; }
        #control-bar { width: 100%; height: 8px; background: #222; border: 1px solid #444; margin: 5px 0; }
        #control-fill { height: 100%; background: var(--red); transition: width 0.4s; box-shadow: 0 0 10px var(--red); }

        #action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
        .act-btn { background: #000; border: 3px solid #ffaa00; color: #ffaa00; font-family: inherit; font-size: 32px; padding: 10px; cursor: pointer; text-align: center; }
        .act-btn:hover:not(:disabled) { background: #ffaa00; color: #000; }
        .act-btn:disabled { border-color: #333; color: #333; cursor: not-allowed; }

        /* Sub-Menu */
        #sub-menu { position: absolute; bottom: 100px; width: 80%; background: #000; border: 3px solid var(--white); padding: 15px; display: none; flex-direction: column; z-index: 200; box-shadow: 0 0 20px #000; }
        .opt { font-size: 28px; padding: 5px; cursor: pointer; }
        .opt:hover { background: #222; color: var(--yellow); }

        /* Chat Viewport */
        #chat-side { width: 500px; display: flex; flex-direction: column; background: #080808; border-left: 2px solid #222; }
        #chat-log { flex-grow: 1; padding: 25px; overflow-y: auto; font-size: 26px; line-height: 1.4; color: #ffaa00; }
        .msg-chara { color: var(--red); border-left: 4px solid var(--red); padding-left: 12px; margin-bottom: 20px; }
        .msg-player { color: var(--white); align-self: flex-end; opacity: 0.6; margin-bottom: 20px; text-align: right; }
        #chat-input { width: 100%; background: #000; border: none; border-top: 2px solid #333; color: var(--white); font-family: inherit; font-size: 28px; padding: 15px; outline: none; }

        .shake { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="menu-overlay">
        <h1 style="color: var(--red); font-size: 60px; text-shadow: 0 0 20px rgba(255,0,0,0.5);">DETERMINATION PROTOCOL</h1>
        <div id="slot-list"></div>
        <button class="act-btn" onclick="configureAPI()" style="margin-top: 20px; font-size: 20px;">CONFIGURE AI CONNECTION</button>
    </div>

    <div id="battle-side">
        <div id="stat-ui">
            <span style="font-weight: bold;">LV 19</span>
            <div id="hp-container">
                <span style="font-size: 20px;">HP</span>
                <div id="hp-bar"><div id="hp-fill"></div></div>
                <span id="hp-text" style="width: 80px;">20/20</span>
            </div>
        </div>

        <div id="control-ui">
            <div style="color: var(--red); font-size: 20px;">SYSTEM POSSESSION: <span id="ctrl-num">0</span>%</div>
            <div id="control-bar"><div id="control-fill"></div></div>
        </div>

        <div id="battle-box">
            <div id="soul"></div>
        </div>

        <div id="sub-menu"></div>

        <div id="action-grid">
            <button class="act-btn" id="btn-fight" onclick="doAction('FIGHT')">FIGHT</button>
            <button class="act-btn" id="btn-act" onclick="doAction('ACT')">ACT</button>
            <button class="act-btn" id="btn-item" onclick="doAction('ITEM')">ITEM</button>
            <button class="act-btn" id="btn-mercy" onclick="doAction('MERCY')">MERCY</button>
        </div>
    </div>

    <div id="chat-side">
        <div id="chat-log"></div>
        <input type="text" id="chat-input" placeholder="Initiate contact..." autocomplete="off">
    </div>
</div>

<script>
    // --- PERSISTENCE ENGINE ---
    const SAVE_KEY = 'CHARA_PROTOCOL_DATA_V4';
    let appData = JSON.parse(localStorage.getItem(SAVE_KEY)) || { slots: [null, null, null], apiKey: "" };
    let curSlotIndex = null;
    let isAiTyping = false;

    // --- GAME STATE ---
    let state = 'MENU'; // MENU, PLAYER, SUB, ENEMY
    let hp = 20, maxHp = 20, control = 0, inventory = ["Butterscotch Pie", "Instant Noodles", "Face Steak"];
    let soulPos = { x: 171, y: 141 };
    let bullets = [];
    let frame = 0, turnFrames = 0;
    const keys = {};

    function saveToDisk() {
        if (curSlotIndex !== null) {
            appData.slots[curSlotIndex] = { 
                name: appData.slots[curSlotIndex].name, 
                hp, control, inventory 
            };
        }
        localStorage.setItem(SAVE_KEY, JSON.stringify(appData));
    }

    // --- UI & MENUS ---
    function initMenu() {
        const list = document.getElementById('slot-list');
        list.innerHTML = '';
        appData.slots.forEach((s, i) => {
            const d = document.createElement('div');
            d.className = `save-slot ${s ? '' : 'empty'}`;
            d.innerHTML = s ? 
                `[ SLOT ${i+1} ] - ${s.name} <br> <small>HP: ${s.hp}/20 | CONTROL: ${Math.floor(s.control)}%</small> 
                <span class="del-btn" onclick="event.stopPropagation(); deleteSlot(${i})">ERASE</span>` : 
                `[ SLOT ${i+1} ] - NO DATA`;
            d.onclick = () => s ? startSlot(i) : createSlot(i);
            list.appendChild(d);
        });
    }

    function createSlot(i) {
        let n = prompt("Name this soul:");
        if (!n) return;
        appData.slots[i] = { name: n, hp: 20, control: 0, inventory: ["Pie", "Noodles", "Steak"] };
        saveToDisk(); initMenu();
    }

    function deleteSlot(i) {
        if(confirm("Permanently erase this timeline?")) {
            appData.slots[i] = null;
            saveToDisk(); initMenu();
        }
    }

    function startSlot(i) {
        curSlotIndex = i;
        const s = appData.slots[i];
        hp = s.hp; control = s.control; inventory = s.inventory || ["Pie", "Noodles", "Steak"];
        state = 'PLAYER';
        document.getElementById('menu-overlay').classList.add('hidden');
        logMsg("Chara", `Greetings. I am ${s.name}.`, "msg-chara");
        updateUI();
        requestAnimationFrame(gameLoop);
    }

    function configureAPI() {
        let k = prompt("Enter Gemini API Key:");
        if(k) { appData.apiKey = k; saveToDisk(); }
    }

    // --- BATTLE ENGINE ---
    window.onkeydown = e => keys[e.code] = true;
    window.onkeyup = e => keys[e.code] = false;

    function gameLoop() {
        if (state === 'ENEMY') {
            updateSoul();
            updateBullets();
            turnFrames--;
            if (turnFrames <= 0) endEnemyTurn();
        }
        frame++;
        requestAnimationFrame(gameLoop);
    }

    function updateSoul() {
        let hijacked = (control >= 100) || (control > 60 && Math.random() < (control-60)*0.015);
        const soulEl = document.getElementById('soul');
        soulEl.style.background = hijacked ? varColor('--white') : varColor('--red');

        if (hijacked) {
            // Advanced Dodge AI
            let targetX = 171, targetY = 141;
            let nearest = null, minDist = 80;
            bullets.forEach(b => {
                let d = Math.hypot(b.x - soulPos.x, b.y - soulPos.y);
                if (d < minDist) { minDist = d; nearest = b; }
            });
            if (nearest) {
                if(nearest.x > soulPos.x) soulPos.x -= 3; else soulPos.x += 3;
                if(nearest.y > soulPos.y) soulPos.y -= 3; else soulPos.y += 3;
            }
        } else {
            let speed = keys['ShiftLeft'] ? 1.5 : 3.5;
            if(keys['ArrowUp'] || keys['KeyW']) soulPos.y -= speed;
            if(keys['ArrowDown'] || keys['KeyS']) soulPos.y += speed;
            if(keys['ArrowLeft'] || keys['KeyA']) soulPos.x -= speed;
            if(keys['ArrowRight'] || keys['KeyD']) soulPos.x += speed;
        }

        soulPos.x = Math.max(0, Math.min(342, soulPos.x));
        soulPos.y = Math.max(0, Math.min(282, soulPos.y));
        soulEl.style.left = soulPos.x + 'px';
        soulEl.style.top = soulPos.y + 'px';
    }

    function spawnBullet(x, y, vx, vy) {
        let b = { x, y, vx, vy, el: document.createElement('div') };
        b.el.className = 'bullet';
        b.el.style.width = '12px'; b.el.style.height = '12px';
        document.getElementById('battle-box').appendChild(b.el);
        bullets.push(b);
    }

    function updateBullets() {
        for(let i = bullets.length-1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.vx; b.y += b.vy;
            b.el.style.left = b.x + 'px'; b.el.style.top = b.y + 'px';
            
            if (Math.hypot(b.x - soulPos.x, b.y - soulPos.y) < 14) {
                hitPlayer();
                b.el.remove(); bullets.splice(i, 1);
            } else if (b.x < -20 || b.x > 380 || b.y < -20 || b.y > 320) {
                b.el.remove(); bullets.splice(i, 1);
            }
        }
    }

    function hitPlayer() {
        hp -= 1;
        document.getElementById('battle-side').classList.add('shake');
        setTimeout(() => document.getElementById('battle-side').classList.remove('shake'), 300);
        updateUI();
        if (hp <= 0) {
            alert("This timeline has reached its end.");
            hp = 20; saveToDisk(); location.reload();
        }
    }

    function startEnemyTurn() {
        state = 'ENEMY';
        turnFrames = 400; // ~6.6 seconds
        bullets = [];
        document.querySelectorAll('.act-btn').forEach(b => b.disabled = true);
        
        const pattern = Math.floor(Math.random() * 3);
        let intv = setInterval(() => {
            if (state !== 'ENEMY') { clearInterval(intv); return; }
            if (pattern === 0) spawnBullet(Math.random()*360, -10, 0, 4.5);
            if (pattern === 1) { 
                let a = Math.random() * Math.PI*2;
                spawnBullet(180+Math.cos(a)*150, 150+Math.sin(a)*150, -Math.cos(a)*3.5, -Math.sin(a)*3.5);
            }
            if (pattern === 2) spawnBullet(-10, soulPos.y + (Math.random()-0.5)*40, 5, 0);
        }, 120);
        setTimeout(() => clearInterval(intv), 6000);
    }

    function endEnemyTurn() {
        state = 'PLAYER';
        bullets.forEach(b => b.el.remove());
        bullets = [];
        document.querySelectorAll('.act-btn').forEach(b => {
            if (control < 90 || b.id !== 'btn-mercy') b.disabled = false;
        });
        updateUI();
    }

    // --- BUTTON ACTIONS ---
    function doAction(type) {
        if (state !== 'PLAYER') return;
        const sub = document.getElementById('sub-menu');
        sub.innerHTML = '';
        
        if (type === 'FIGHT') {
            logMsg("You", "* You delivered a critical blow.", "msg-player");
            modifyControl(8); startEnemyTurn();
        } else if (type === 'ACT') {
            sub.style.display = 'flex';
            ["Check", "Threaten", "Reason"].forEach(a => {
                let d = document.createElement('div'); d.className = 'opt'; d.innerText = a;
                d.onclick = () => { logMsg("You", `* You chose to ${a}.`, "msg-player"); sub.style.display = 'none'; modifyControl(2); startEnemyTurn(); };
                sub.appendChild(d);
            });
        } else if (type === 'ITEM') {
            sub.style.display = 'flex';
            inventory.forEach((it, idx) => {
                let d = document.createElement('div'); d.className = 'opt'; d.innerText = it;
                d.onclick = () => { 
                    hp = Math.min(20, hp + 15); inventory.splice(idx, 1);
                    logMsg("You", `* You consumed the ${it}.`, "msg-player");
                    sub.style.display = 'none'; modifyControl(-3); startEnemyTurn(); 
                };
                sub.appendChild(d);
            });
            if(inventory.length === 0) sub.innerText = "NO ITEMS";
        } else if (type === 'MERCY') {
            logMsg("You", "* You reached out... but there was nothing to grasp.", "msg-player");
            modifyControl(-5); startEnemyTurn();
        }
    }

    // --- AI & CONTROL ---
    function modifyControl(n) {
        control = Math.max(0, Math.min(100, control + n));
        updateUI();
        saveToDisk();
        if (control >= 100) {
            document.querySelectorAll('.act-btn').forEach(b => b.disabled = true);
            document.getElementById('chat-input').placeholder = "Ownership is complete.";
        }
    }

    function updateUI() {
        document.getElementById('hp-fill').style.width = (hp/20)*100 + "%";
        document.getElementById('hp-text').innerText = `${Math.ceil(hp)} / 20`;
        document.getElementById('control-fill').style.width = control + "%";
        document.getElementById('ctrl-num').innerText = Math.floor(control);
    }

    async function chatWithChara(txt) {
        if (!appData.apiKey || isAiTyping) return;
        isAiTyping = true;
        const prompt = `You are Chara from Undertale. Cold, formal, and seeking total control. 
        Respond to: "${txt}". Current Control: ${control}%.
        Return ONLY JSON: {"reply": "...", "controlMod": number}`;

        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash:generateContent?key=${appData.apiKey}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{role: "user", parts: [{text: prompt}]}], generationConfig: {responseMimeType: "application/json"} })
            });
            const d = await r.json();
            const res = JSON.parse(d.candidates[0].content.parts[0].text);
            logMsg("Chara", res.reply, "msg-chara");
            modifyControl(res.controlMod || 0);
        } catch(e) { console.error(e); } finally { isAiTyping = false; }
    }

    document.getElementById('chat-input').onkeypress = e => {
        if(e.key === 'Enter') {
            let v = e.target.value; logMsg("You", v, "msg-player");
            e.target.value = ''; chatWithChara(v);
        }
    }

    function logMsg(s, t, c) {
        const l = document.getElementById('chat-log');
        const d = document.createElement('div'); d.className = c; d.innerText = t;
        l.appendChild(d); l.scrollTop = l.scrollHeight;
    }

    function varColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

    initMenu();
</script>
</body>
</html>
