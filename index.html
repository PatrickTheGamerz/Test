<!DOCTYPE html>
<html>
<head>
    <title>Flappy Hangar Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body oncontextmenu="return false;">

    <div id="cursor"></div>

    <div id="game-container">
        <div id="score-text" style="position:absolute; width:100%; text-align:center; top:50px; font-size:70px; font-weight:900; z-index:10; pointer-events:none;">0</div>

        <div id="menu-gui" class="gui">
            <h1>FLAPPY PRO</h1>
            <p>HIGHSCORE: <span id="high-val">0</span></p>
            <button class="btn" onclick="gameState='playing'; hideAll(); startGame();">PLAY MISSION</button>
            <button class="btn" onclick="showGUI('hangar-gui')">HANGAR</button>
            <button class="btn" onclick="showGUI('ach-gui')">ACHIEVEMENTS</button>
        </div>

        <div id="hangar-gui" class="gui hidden">
            <h2>FLIGHT HANGAR</h2>
            <div class="hangar-grid">
                <div class="skill-node" id="node-center" style="border-color:#fff">Core</div>
                <div class="skill-node" id="node-red" onclick="applySkill('#ff4757', 10)"><i>10 PTS</i></div>
                <div class="skill-node" id="node-blue" onclick="applySkill('#00d2ff', 20)"><i>20 PTS</i></div>
                <div class="skill-node" id="node-yellow" onclick="applySkill('#eccc68', 30)"><i>30 PTS</i></div>
                <div class="skill-node" id="node-green" onclick="applySkill('#7bed9f', 40)"><i>40 PTS</i></div>
                <div class="skill-node" id="node-purple" onclick="applySkill('#a29bfe', 50)"><i>50 PTS</i></div>
            </div>
            <button class="btn" onclick="showGUI('menu-gui')">EXIT HANGAR</button>
        </div>

        <div id="ach-gui" class="gui hidden">
            <h2>PILOT LOG</h2>
            <div id="ach-container"></div>
            <button class="btn" onclick="showGUI('menu-gui')">BACK</button>
        </div>

        <div id="save-pop">PROGRESS SAVED</div>
        <div id="bird"></div>
        <div id="world"></div>
    </div>

    <script>
        const bird = document.getElementById('bird');
        const world = document.getElementById('world');
        const cursor = document.getElementById('cursor');

        // GAME ENGINE
        let gameState = 'menu';
        let birdY = 300, velocity = 0, gravity = 0.5;
        let score = 0, pipes = [], frame = 0;
        let highscore = localStorage.getItem('fs_high') || 0;
        document.getElementById('high-val').innerText = highscore;

        // CURSOR
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        function showGUI(id) {
            hideAll();
            document.getElementById(id).classList.remove('hidden');
            if(id === 'hangar-gui') refreshHangar();
        }

        function hideAll() {
            document.querySelectorAll('.gui').forEach(g => g.classList.add('hidden'));
        }

        function applySkill(color, req) {
            if(highscore >= req) {
                bird.style.setProperty('--bird-color', color);
                saveGame();
            }
        }

        function refreshHangar() {
            const nodes = [
                {id:'node-red', r:10}, {id:'node-blue', r:20}, 
                {id:'node-yellow', r:30}, {id:'node-green', r:40}, {id:'node-purple', r:50}
            ];
            nodes.forEach(n => {
                const el = document.getElementById(n.id);
                if(highscore >= n.r) el.classList.add('unlocked');
            });
        }

        function startGame() {
            birdY = 300; velocity = 0; score = 0; pipes = []; frame = 0;
            world.innerHTML = '';
            document.getElementById('score-text').innerText = '0';
            requestAnimationFrame(gameLoop);
        }

        function spawnPipe() {
            const gap = 170;
            const topH = Math.random() * 300 + 50;
            const p = {
                x: 500, th: topH, bh: 700 - topH - gap, passed: false,
                divT: document.createElement('div'),
                divB: document.createElement('div')
            };
            p.divT.className = 'pipe pipe-top';
            p.divT.style.height = p.th + 'px';
            p.divB.className = 'pipe pipe-bottom';
            p.divB.style.height = p.bh + 'px';
            p.divB.style.bottom = '0';
            world.appendChild(p.divT);
            world.appendChild(p.divB);
            pipes.push(p);
        }

        function gameLoop() {
            if (gameState !== 'playing') return;

            frame++;
            velocity += gravity;
            birdY += velocity;
            bird.style.top = birdY + 'px';
            bird.style.transform = `rotate(${Math.min(velocity * 4, 90)}deg)`;

            // Pipe Frequency: 180 frames = LOTS of space
            if (frame % 180 === 0) spawnPipe();

            pipes.forEach((p, i) => {
                p.x -= 3.5;
                p.divT.style.left = p.x + 'px';
                p.divB.style.left = p.x + 'px';

                // Hitbox logic
                const b = bird.getBoundingClientRect();
                const pt = p.divT.getBoundingClientRect();
                const pb = p.divB.getBoundingClientRect();

                if (b.right-8 > pt.left && b.left+8 < pt.right) {
                    if (b.top+8 < pt.bottom || b.bottom-8 > pb.top) gameOver();
                }

                if (p.x < 50 && !p.passed) {
                    p.passed = true;
                    score++;
                    document.getElementById('score-text').innerText = score;
                }
            });

            if (pipes.length > 0 && pipes[0].x < -100) {
                pipes[0].divT.remove(); pipes[0].divB.remove();
                pipes.shift();
            }

            if (birdY > 670 || birdY < -20) gameOver();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameState = 'menu';
            if(score > highscore) {
                highscore = score;
                localStorage.setItem('fs_high', highscore);
                document.getElementById('high-val').innerText = highscore;
            }
            saveGame();
            showGUI('menu-gui');
        }

        function saveGame() {
            const pop = document.getElementById('save-pop');
            pop.style.display = 'block';
            setTimeout(() => pop.style.display = 'none', 2000);
        }

        const flap = () => { if(gameState === 'playing') velocity = -9; };
        window.addEventListener('keydown', e => { if(e.code === 'Space') flap(); });
        window.addEventListener('mousedown', (e) => { if(e.button === 0) flap(); });

    </script>
</body>
</html>
