<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Undertale: Determination Protocol V8</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        :root { --red: #ff0000; --yellow: #ffff00; --white: #ffffff; --orange: #ffaa00; --green: #00ff00; --bg: #000000; }
        body { background: var(--bg); color: var(--white); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'VT323', monospace; overflow: hidden; }
        #game-container { display: flex; width: 1100px; height: 750px; border: 4px solid #333; background: var(--bg); position: relative; box-shadow: 0 0 50px rgba(255,0,0,0.2); }
        
        /* CRT SCANLINES */
        #game-container::before { content: " "; position: absolute; inset: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); z-index: 1000; background-size: 100% 4px, 3px 100%; pointer-events: none; }

        #menu-overlay { position: absolute; inset: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .save-slot { width: 450px; padding: 20px; border: 3px solid var(--white); margin: 10px; cursor: pointer; background: #080808; }
        .save-slot:hover { border-color: var(--red); transform: scale(1.02); }

        #battle-side { width: 620px; border-right: 4px solid #222; display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }
        #monster-sprite { height: 160px; font-size: 100px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        
        #battle-box { width: 420px; height: 260px; border: 6px solid var(--white); background: var(--bg); position: relative; overflow: hidden; margin: 15px 0; }
        #soul { width: 18px; height: 18px; position: absolute; background: var(--red); z-index: 100; clip-path: path('M9 2.1C9 2.1 8.4 0 4.2 0 1.2 0 0 2.4 0 4.4 0 8.4 9 13.5 9 13.5S18 8.4 18 4.4C18 2.4 16.8 0 13.8 0 10.6 0 9 2.1 9 2.1Z'); }
        .bullet { position: absolute; border-radius: 50%; }

        #fight-bar-container { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 150; }
        #fight-target { width: 380px; height: 120px; border: 4px solid var(--white); position: relative; background: url('https://raw.githubusercontent.com/FryingPan/undertale-fight-assets/master/images/target.png') center/cover; }
        #fight-slider { width: 12px; height: 100%; background: #00ffff; position: absolute; left: 0; box-shadow: 0 0 15px #00ffff; }

        #stat-ui { width: 100%; display: flex; justify-content: space-between; font-size: 32px; font-weight: bold; }
        #hp-bar-outer { width: 140px; height: 22px; background: var(--red); border: 2px solid #000; }
        #hp-bar-inner { height: 100%; background: var(--yellow); transition: width 0.2s; }

        #action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .act-btn { background: #000; border: 3px solid var(--orange); color: var(--orange); font-family: inherit; font-size: 30px; padding: 10px; cursor: pointer; text-align: center; }
        .act-btn:hover:not(:disabled) { background: var(--orange); color: #000; }
        .act-btn:disabled { opacity: 0.3; cursor: default; }
        .hijacked { border-color: var(--red) !important; color: var(--red) !important; }

        #chat-side { width: 480px; display: flex; flex-direction: column; background: #050505; border-left: 2px solid #222; }
        #chat-log { flex-grow: 1; padding: 25px; overflow-y: auto; font-size: 24px; color: var(--orange); }
        .msg-chara { color: var(--red); border-left: 3px solid var(--red); padding-left: 12px; margin-bottom: 20px; }
        .msg-player { color: var(--white); align-self: flex-end; opacity: 0.6; margin-bottom: 15px; }
        #chat-input { background: #000; border: none; border-top: 2px solid #333; color: var(--white); font-family: inherit; font-size: 26px; padding: 15px; outline: none; }
        
        .hidden { display: none !important; }
        .shake { animation: shake 0.2s linear infinite; }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } 100% { transform: translate(2px, -2px); } }
    </style>
</head>
<body>

<div id="game-container">
    <div id="menu-overlay">
        <h1 style="color: var(--red); font-size: 55px; letter-spacing: 5px;">DETERMINATION V8</h1>
        <div id="slots"></div>
        <button class="act-btn" onclick="setAPI()" style="font-size: 18px; margin-top: 20px;">LINK GEMINI NARRATOR</button>
    </div>

    <div id="battle-side">
        <div id="stat-ui">
            <span id="lv-disp">LV 1</span>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span>HP</span>
                <div id="hp-bar-outer"><div id="hp-bar-inner"></div></div>
                <span id="hp-txt">20/20</span>
            </div>
        </div>
        
        <div style="width:100%; text-align:center; color: #aaa; margin: 5px 0; font-size: 18px;">
            EXP: <span id="exp-val">0</span> / <span id="next-lv">50</span> | SYNC: <span id="sync-val" style="color:red">0</span>%
        </div>

        <div id="monster-sprite"></div>

        <div id="battle-box">
            <div id="soul"></div>
            <div id="fight-bar-container">
                <div id="fight-target"><div id="fight-slider"></div></div>
            </div>
        </div>

        <div id="action-grid">
            <button class="act-btn" id="btn-FIGHT" onclick="handleInput('FIGHT')">FIGHT</button>
            <button class="act-btn" id="btn-ACT" onclick="handleInput('ACT')">ACT</button>
            <button class="act-btn" id="btn-ITEM" onclick="handleInput('ITEM')">ITEM</button>
            <button class="act-btn" id="btn-MERCY" onclick="handleInput('MERCY')">MERCY</button>
        </div>
    </div>

    <div id="chat-side">
        <div id="chat-log"></div>
        <input type="text" id="chat-input" placeholder="Type a thought..." autocomplete="off">
    </div>
</div>

<script>
    // --- DATABASE ---
    const DB_KEY = 'UT_PROTOCOL_V8';
    let appData = JSON.parse(localStorage.getItem(DB_KEY)) || { slots: [null,null,null], apiKey: "" };
    let curSlot = null;

    // --- GAME STATE ---
    let lv = 1, hp = 20, maxHp = 20, exp = 0, sync = 0, items = ["Pie", "Noodles", "Steak", "Tea"];
    let turn = 'MENU'; 
    let enemy = null, bullets = [], frame = 0, turnFrames = 0;
    const soulPos = { x: 201, y: 121 };
    const keys = {};

    const Monsters = [
        { n: "Froggit", hp: 20, def: 4, exp: 20, art: "🐸" },
        { n: "Whimsun", hp: 10, def: 0, exp: 10, art: "🦋" },
        { n: "Moldsmal", hp: 12, def: 0, exp: 3, art: "🍮" },
        { n: "Vegetoid", hp: 20, def: 6, exp: 6, art: "🥕" }
    ];

    // --- INITIALIZATION ---
    function setAPI() { let k = prompt("Gemini API Key:"); if(k) { appData.apiKey = k; saveDisk(); } }
    function saveDisk() {
        if(curSlot !== null) appData.slots[curSlot] = { lv, hp, exp, sync, name: appData.slots[curSlot].name };
        localStorage.setItem(DB_KEY, JSON.stringify(appData));
    }

    function initMenu() {
        const slots = document.getElementById('slots'); slots.innerHTML = '';
        appData.slots.forEach((s, i) => {
            const d = document.createElement('div');
            d.className = `save-slot ${s ? '' : 'empty'}`;
            d.innerHTML = s ? `NAME: ${s.name} | LV ${s.lv} | SYNC ${Math.floor(s.sync)}%` : `-- EMPTY --`;
            d.onclick = () => s ? startSlot(i) : createSlot(i);
            slots.appendChild(d);
        });
    }

    function createSlot(i) {
        let n = prompt("Name:"); if(!n) return;
        appData.slots[i] = { name: n, lv: 1, hp: 20, exp: 0, sync: 0 };
        saveDisk(); initMenu();
    }

    function startSlot(i) {
        curSlot = i; const s = appData.slots[i];
        lv = s.lv; hp = 20; exp = s.exp; sync = s.sync; maxHp = 20 + (lv-1)*4;
        document.getElementById('menu-overlay').classList.add('hidden');
        updateUI(); spawnEncounter();
        requestAnimationFrame(gameLoop);
    }

    // --- MAIN ENGINE ---
    window.onkeydown = e => { 
        keys[e.code] = true; 
        if((e.code === 'KeyZ' || e.code === 'Enter') && turn === 'FIGHT_BAR') finalizePlayerAttack();
    };
    window.onkeyup = e => keys[e.code] = false;

    function gameLoop() {
        if(turn === 'SURVIVAL') updateDodgePhase();
        if(turn === 'FIGHT_BAR') updateFightSlider();
        frame++; requestAnimationFrame(gameLoop);
    }

    function spawnEncounter() {
        enemy = { ...Monsters[Math.floor(Math.random()*Monsters.length)] };
        items = ["Pie", "Noodles", "Steak", "Tea"]; // Refill items every fight
        document.getElementById('monster-sprite').innerText = enemy.art;
        logMsg("System", `* ${enemy.n} draws near.`, "");
        nextTurnLogic();
    }

    function nextTurnLogic() {
        if(Math.random()*100 < sync) {
            startCharaTurn();
        } else {
            turn = 'PLAYER';
            document.getElementById('soul').style.background = "var(--red)";
            document.querySelectorAll('.act-btn').forEach(b => { b.disabled = false; b.classList.remove('hijacked'); });
        }
    }

    function startCharaTurn() {
        turn = 'CHARA';
        document.getElementById('soul').style.background = "var(--white)";
        document.querySelectorAll('.act-btn').forEach(b => { b.disabled = true; b.classList.add('hijacked'); });
        setTimeout(() => {
            if(hp < maxHp/2 && items.length > 0) useBestItem();
            else startFightSequence();
        }, 800);
    }

    function handleInput(type) {
        if(turn !== 'PLAYER') return;
        if(type === 'FIGHT') startFightSequence();
        if(type === 'ITEM') useBestItem();
        if(type === 'MERCY') { logMsg("You", "* You spared them.", "msg-player"); sync = Math.max(0, sync-5); spawnEncounter(); }
        if(type === 'ACT') { logMsg("You", `* You Checked ${enemy.n}.`, "msg-player"); startSurvivalPhase(); }
    }

    // --- FIGHT SYSTEM ---
    let sliderPos = 0, sliderDir = 6;
    function startFightSequence() {
        turn = 'FIGHT_BAR'; sliderPos = 0;
        document.getElementById('fight-bar-container').style.display = 'flex';
        if(turn === 'CHARA') setTimeout(() => finalizePlayerAttack(), 400 + Math.random()*200); // Chara's perfect-ish aim
    }

    function updateFightSlider() {
        sliderPos += sliderDir;
        if(sliderPos > 370 || sliderPos < 0) sliderDir *= -1;
        document.getElementById('fight-slider').style.left = sliderPos + 'px';
    }

    function finalizePlayerAttack() {
        document.getElementById('fight-bar-container').style.display = 'none';
        let dist = Math.abs(190 - sliderPos);
        let multiplier = Math.max(0.1, (1 - (dist / 190)) * 4);
        if(turn === 'CHARA') multiplier = 4.0; // Chara is perfect

        let baseAt = 10 + (lv-1)*2;
        let finalDmg = Math.max(1, (baseAt - enemy.def) * multiplier);
        
        enemy.hp -= finalDmg;
        logMsg(turn === 'CHARA' ? "Chara" : "You", `* Dealt ${Math.floor(finalDmg)} damage.`, turn === 'CHARA' ? "msg-chara" : "msg-player");
        
        if(enemy.hp <= 0) {
            exp += enemy.exp; sync = Math.min(100, sync + 8);
            checkLevelUp();
            saveDisk(); updateUI(); spawnEncounter();
        } else {
            startSurvivalPhase();
        }
    }

    function checkLevelUp() {
        let req = lv * 50;
        if(exp >= req) { lv++; hp = maxHp = 20 + (lv-1)*4; logMsg("Chara", "* Your Level increased.", "msg-chara"); }
    }

    // --- SURVIVAL ---
    function startSurvivalPhase() {
        turn = 'SURVIVAL'; turnFrames = 350; bullets = [];
        document.querySelectorAll('.act-btn').forEach(b => b.disabled = true);
    }

    function updateDodgePhase() {
        let hijacked = (sync >= 100) || (Math.random()*100 < sync);
        const sEl = document.getElementById('soul');
        sEl.style.background = hijacked ? "var(--white)" : "var(--red)";

        if(hijacked) {
            // Chara AI: Spatial Awareness
            let near = null, d = 70;
            bullets.forEach(b => { 
                let dist = Math.hypot(b.x-soulPos.x, b.y-soulPos.y); 
                if(dist < d){ 
                    d = dist; near = b; 
                }
            });
            if(near) {
                // If it's a green carrot, Chara hunts it if low HP
                if(near.isGreen && hp < maxHp) {
                    if(near.x > soulPos.x) soulPos.x += 2; else soulPos.x -= 2;
                    if(near.y > soulPos.y) soulPos.y += 2; else soulPos.y -= 2;
                } else {
                    if(near.x > soulPos.x) soulPos.x -= 3.5; else soulPos.x += 3.5;
                    if(near.y > soulPos.y) soulPos.y -= 3.5; else soulPos.y += 3.5;
                }
            }
        } else {
            let s = keys['ShiftLeft'] ? 1.5 : 3.5;
            if(keys['ArrowUp'] || keys['KeyW']) soulPos.y -= s;
            if(keys['ArrowDown'] || keys['KeyS']) soulPos.y += s;
            if(keys['ArrowLeft'] || keys['KeyA']) soulPos.x -= s;
            if(keys['ArrowRight'] || keys['KeyD']) soulPos.x += s;
        }

        soulPos.x = Math.max(0, Math.min(402, soulPos.x));
        soulPos.y = Math.max(0, Math.min(242, soulPos.y));
        sEl.style.left = soulPos.x + 'px'; sEl.style.top = soulPos.y + 'px';

        // Bullet Logic
        if(frame % 25 === 0) {
            let isGreen = (enemy.n === "Vegetoid" && Math.random() < 0.2);
            spawnBullet(Math.random()*400, -10, (Math.random()-0.5)*2, 4.5, isGreen);
        }

        for(let i=bullets.length-1; i>=0; i--) {
            let b = bullets[i]; b.x += b.vx; b.y += b.vy;
            b.el.style.left = b.x + 'px'; b.el.style.top = b.y + 'px';
            if(Math.hypot(b.x-soulPos.x, b.y-soulPos.y) < 14) {
                if(b.isGreen) {
                    hp = Math.min(maxHp, hp + 2);
                } else {
                    hp -= 1;
                    document.getElementById('battle-side').classList.add('shake');
                    setTimeout(()=>document.getElementById('battle-side').classList.remove('shake'), 200);
                }
                b.el.remove(); bullets.splice(i,1); updateUI();
                if(hp <= 0) { alert("Timeline Erased."); location.reload(); }
            } else if(b.y > 280) { b.el.remove(); bullets.splice(i,1); }
        }

        turnFrames--;
        if(turnFrames <= 0) { bullets.forEach(b => b.el.remove()); nextTurnLogic(); }
    }

    function spawnBullet(x, y, vx, vy, isGreen) {
        let b = { x, y, vx, vy, isGreen, el: document.createElement('div') };
        b.el.className = 'bullet'; b.el.style.width = '14px'; b.el.style.height = '14px';
        b.el.style.background = isGreen ? "var(--green)" : "var(--white)";
        document.getElementById('battle-box').appendChild(b.el); bullets.push(b);
    }

    function useBestItem() {
        if(items.length > 0) { 
            items.pop(); hp = Math.min(maxHp, hp + 15); 
            logMsg(turn === 'CHARA' ? "Chara" : "You", "* Ate an item.", turn === 'CHARA' ? "msg-chara" : "msg-player");
            updateUI(); startSurvivalPhase();
        }
    }

    function updateUI() {
        document.getElementById('lv-disp').innerText = `LV ${lv}`;
        document.getElementById('hp-txt').innerText = `${Math.ceil(hp)}/${maxHp}`;
        document.getElementById('hp-bar-inner').style.width = (hp/maxHp)*100 + "%";
        document.getElementById('sync-val').innerText = Math.floor(sync);
        document.getElementById('exp-val').innerText = exp;
        document.getElementById('next-lv').innerText = lv * 50;
    }

    // --- AI NARRATOR ---
    async function talkAI(txt) {
        if(!appData.apiKey) return;
        const prompt = `You are Chara, the Narrator. You observe the player's choices with cold interest. 
        Stats: LV ${lv}, HP ${hp}/${maxHp}, Current Monster: ${enemy.n}. 
        User says: "${txt}". JSON Response: {"reply": "...", "controlMod": number}`;
        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${appData.apiKey}`, {
                method: 'POST', body: JSON.stringify({ contents: [{role: "user", parts: [{text: prompt}]}], generationConfig: {responseMimeType: "application/json"} })
            });
            const d = await r.json(); const res = JSON.parse(d.candidates[0].content.parts[0].text);
            logMsg("Chara", res.reply, "msg-chara"); sync = Math.min(100, Math.max(0, sync + res.controlMod)); updateUI();
        } catch(e) {}
    }

    document.getElementById('chat-input').onkeypress = e => { if(e.key === 'Enter'){ logMsg("You", e.target.value, "msg-player"); talkAI(e.target.value); e.target.value = ''; }};
    function logMsg(s, t, c) { const l = document.getElementById('chat-log'); const d = document.createElement('div'); d.className = c; d.innerText = t; l.appendChild(d); l.scrollTop = l.scrollHeight; }

    initMenu();
</script>
</body>
</html>
