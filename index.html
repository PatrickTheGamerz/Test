<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ORANGEBIRD PRO | AEROSPACE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body oncontextmenu="return false;">

    <div id="loading-screen">
        <div class="loader"></div>
        <h2 style="color:white; margin-top:20px; letter-spacing:5px;">INITIALIZING SYSTEMS</h2>
    </div>

    <div id="cursor"></div>

    <div id="game-container">
        <div id="bg-far"></div>
        <div id="bg-near"></div>
        
        <div id="top-score" class="ingame-ui">0</div>

        <div id="menu-ui" class="gui">
            <div class="logo-area">
                <span class="version">V2.0 PRO</span>
                <h1>ORANGEBIRD</h1>
            </div>
            <div class="stats-bar">
                <div class="stat"><span>HIGHSCORE</span><b id="high-val">0</b></div>
                <div class="stat"><span>CREDITS</span><b id="points-val">0</b></div>
            </div>
            <button id="btn-play" class="btn lock" onclick="checkStart()">FLY MISSION</button>
            <button class="btn btn-sec" onclick="switchUI('hangar')">ENGINEERING HANGAR</button>
            <button class="btn btn-sec" onclick="switchUI('medals')">PILOT RECORDS</button>
        </div>

        <div id="gameover-ui" class="gui" style="display:none;">
            <h2 style="color:#ff4757; font-size:40px; margin-bottom:10px;">MISSION FAILED</h2>
            <div class="results-card">
                <p>PIPES PASSED: <span id="res-score">0</span></p>
                <p>CREDITS EARNED: <span id="res-points">0</span></p>
                <p>BEST RECORD: <span id="res-high">0</span></p>
            </div>
            <button class="btn" onclick="switchUI('play')">RE-DEPLOY</button>
            <button class="btn btn-sec" onclick="switchUI('menu')">RETURN TO BASE</button>
        </div>

        <div id="hangar-ui" class="gui" style="display:none; background:transparent;">
            <div id="hangar-viewport">
                <svg id="lines" style="position:absolute; width:100%; height:100%; pointer-events:none;"></svg>
            </div>
            <div class="hangar-controls">DRAG TO NAVIGATE TECHNOLOGY TREE</div>
            <button class="btn back-btn" onclick="switchUI('menu')">EXIT HANGAR</button>
        </div>

        <div id="medals-ui" class="gui" style="display:none;">
            <h2 style="color:white;">PILOT ACHIEVEMENTS</h2>
            <div id="ach-list" class="scroll-box"></div>
            <button class="btn" onclick="switchUI('menu')">BACK</button>
        </div>

        <div id="toast">
            <div class="toast-img">🏆</div>
            <div class="toast-body"><b id="t-name"></b><span id="t-desc"></span></div>
        </div>

        <div id="bird"></div>
        <div id="world"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
