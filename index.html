<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Undertale: Determination Protocol V14</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        :root { --red: #ff0000; --yellow: #ffff00; --white: #ffffff; --orange: #ffaa00; --green: #00ff00; --blue: #00a2ff; --bg: #000; }
        body { background: var(--bg); color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'VT323', monospace; overflow: hidden; }
        #game { display: flex; width: 1100px; height: 750px; border: 4px solid #333; position: relative; box-shadow: 0 0 40px rgba(255,0,0,0.3); }

        /* Overlays */
        #menu, #api-screen { position: absolute; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .slot { width: 450px; padding: 15px; border: 3px solid #fff; margin: 10px; cursor: pointer; transition: 0.2s; }
        .slot:hover { border-color: var(--red); color: var(--red); }

        /* Battle Area */
        #battle-side { width: 620px; border-right: 4px solid #222; display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }
        #sprite-container { height: 180px; width: 100%; display: flex; align-items: center; justify-content: center; font-size: 100px; position: relative; }
        #box { width: 440px; height: 260px; border: 6px solid #fff; position: relative; overflow: hidden; margin: 15px 0; background: #000; }
        #soul { width: 18px; height: 18px; position: absolute; z-index: 100; clip-path: path('M9 2.1C9 2.1 8.4 0 4.2 0 1.2 0 0 2.4 0 4.4 0 8.4 9 13.5 9 13.5S18 8.4 18 4.4C18 2.4 16.8 0 13.8 0 10.6 0 9 2.1 9 2.1Z'); }
        .bullet { position: absolute; border-radius: 50%; }

        /* Fight Bar */
        #fight-ui { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 500; }
        #target { width: 380px; height: 120px; border: 4px solid #fff; position: relative; background: url('https://raw.githubusercontent.com/FryingPan/undertale-fight-assets/master/images/target.png') center/cover; }
        #slider { width: 12px; height: 100%; background: #fff; position: absolute; left: 0; box-shadow: 0 0 15px #fff; }

        /* Stats & Buttons */
        #stats { width: 100%; display: flex; justify-content: space-between; font-size: 32px; }
        #hp-bg { width: 140px; height: 22px; background: var(--red); border: 2px solid #000; }
        #hp-fill { height: 100%; background: var(--yellow); transition: width 0.2s; }
        #btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .btn { background: #000; border: 3px solid var(--orange); color: var(--orange); font-family: inherit; font-size: 30px; padding: 10px; cursor: pointer; text-align: center; }
        .btn:disabled { opacity: 0.3; border-color: #444; color: #444; }
        .btn.chara-active { border-color: var(--red) !important; color: var(--red) !important; }

        /* Chat */
        #chat-side { width: 480px; display: flex; flex-direction: column; background: #050505; border-left: 2px solid #222; }
        #log { flex-grow: 1; padding: 25px; overflow-y: auto; font-size: 24px; color: var(--orange); }
        .m-chara { color: var(--red); border-left: 3px solid var(--red); padding-left: 12px; margin-bottom: 20px; }
        .m-player { color: #fff; align-self: flex-end; opacity: 0.6; margin-bottom: 15px; }
        #input { background: #000; border: none; border-top: 2px solid #333; color: #fff; font-family: inherit; font-size: 26px; padding: 15px; outline: none; }

        .vfx-slash { position: absolute; width: 120px; height: 20px; background: #fff; z-index: 600; transform: rotate(-45deg); animation: slash 0.2s linear forwards; }
        @keyframes slash { 0% { transform: scaleX(0) rotate(-45deg); opacity: 1; } 100% { transform: scaleX(5) rotate(-45deg); opacity: 0; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game">
    <div id="api-screen">
        <h1 style="color:var(--red)">AI LINK REQUIRED</h1>
        <input type="text" id="api-key" placeholder="AIza..." style="width:300px; padding:10px; font-family:inherit; font-size:20px;">
        <button class="btn" onclick="saveKey()" style="margin-top:20px;">INITIALIZE</button>
    </div>

    <div id="menu" class="hidden">
        <h1 style="color:var(--red); font-size: 50px;">CHOOSE TIMELINE</h1>
        <div id="slot-list"></div>
    </div>

    <div id="battle-side">
        <div id="stats">
            <span id="lv-ui">LV 1</span>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span>HP</span>
                <div id="hp-bg"><div id="hp-fill"></div></div>
                <span id="hp-ui">20/20</span>
            </div>
        </div>
        <div style="font-size:18px; color:#777; margin:5px;">SYNC: <span id="sync-ui" style="color:var(--red)">0</span>% | REGION: <span id="region-ui">RUINS</span></div>
        <div id="sprite-container"></div>
        <div id="box">
            <div id="soul"></div>
            <div id="fight-ui">
                <div id="target"><div id="slider"></div></div>
            </div>
        </div>
        <div id="btns">
            <button class="btn" id="b-FIGHT" onclick="act('FIGHT')">FIGHT</button>
            <button class="btn" id="b-ACT" onclick="act('ACT')">ACT</button>
            <button class="btn" id="b-ITEM" onclick="act('ITEM')">ITEM</button>
            <button class="btn" id="b-MERCY" onclick="act('MERCY')">MERCY</button>
        </div>
    </div>

    <div id="chat-side">
        <div id="log"></div>
        <input type="text" id="input" placeholder="Initiate thought..." autocomplete="off">
    </div>
</div>

<script>
    const STORAGE_KEY = 'UT_PROTOCOL_V14';
    let appData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { slots: [null,null,null], apiKey: "" };
    let curSlot = null;

    // --- GAME STATE ---
    let lv=1, hp=20, maxHp=20, exp=0, sync=0, region='RUINS', defeated=[];
    let turn='MENU', enemy=null, bullets=[], frame=0, turnTimer=0;
    let soulX=211, soulY=121, isSoulMoving=false;
    let sliderX=0, sliderDir=8, sliderStartFrame=0;
    let knowledge = { green: 0, blue: 0, fight: 10 }; 
    const keys = {};

    const Monsters = {
        RUINS: [
            { n: "Froggit", hp: 20, def: 4, exp: 20, art: "🐸", patterns: ['FROG_FLY', 'FROG_CURVE'] },
            { n: "Whimsun", hp: 10, def: 0, exp: 10, art: "🦋", patterns: ['BUTTERFLY'] },
            { n: "Moldsmal", hp: 12, def: 0, exp: 3, art: "🍮", patterns: ['SINE_WAVE'] },
            { n: "Vegetoid", hp: 20, def: 6, exp: 6, art: "🥕", patterns: ['VEGGIE_FALL'] }
        ],
        SNOWDIN: [
            { n: "Lesser Dog", hp: 60, def: 0, exp: 18, art: "🐕", patterns: ['BONE_RAIN', 'BONE_SWING'] },
            { n: "Ice Cap", hp: 48, def: 2, exp: 17, art: "👒", patterns: ['SNOWFLAKE', 'HAT_ARC'] },
            { n: "Snowdrake", hp: 48, def: 2, exp: 22, art: "🐦", patterns: ['ICE_SPIKE', 'SHARD'] },
            { n: "Gyftrot", hp: 100, def: 2, exp: 50, art: "🦌", patterns: ['SNOWFLAKE_LARGE'] }
        ]
    };

    const Bosses = {
        NAPSTABLOOK: { n: "Napstablook", hp: 88, def: 0, exp: 0, art: "👻", patterns: ['TEAR_RAIN', 'SIDE_TEARS', 'WAVY_TEARS'], boss: true },
        TORIEL: { n: "Toriel", hp: 440, def: 0, exp: 0, art: "🐐", patterns: ['FIRE_SPIRAL', 'FIRE_RAIN'], boss: true },
        DOGGO: { n: "Doggo", hp: 30, def: 1, exp: 30, art: "🗡️", patterns: ['BLUE_SLASH'], boss: true },
        DOGAMY: { n: "Dogamy & Dogaressa", hp: 108, def: 5, exp: 40, art: "🪓", patterns: ['BLUE_WHITE_BONE'], boss: true },
        GREATER_DOG: { n: "Greater Dog", hp: 350, def: 8, exp: 80, art: "🛡️", patterns: ['BARK_BULLET', 'SPEAR_THRUST'], boss: true }
    };

    // --- CORE ---
    function saveKey() {
        const k = document.getElementById('api-key').value;
        if(k.startsWith("AIza")) { appData.apiKey = k; localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); location.reload(); }
    }

    if(!appData.apiKey) { document.getElementById('api-screen').classList.remove('hidden'); }
    else { document.getElementById('api-screen').classList.add('hidden'); document.getElementById('menu').classList.remove('hidden'); initMenu(); }

    function initMenu() {
        const list = document.getElementById('slot-list'); list.innerHTML = '';
        appData.slots.forEach((s, i) => {
            const d = document.createElement('div'); d.className = `slot ${s?'':'empty'}`;
            d.innerHTML = s ? `${s.name} - LV ${s.lv} [${s.region}]` : `-- EMPTY --`;
            d.onclick = () => s ? loadSlot(i) : createSlot(i);
            list.appendChild(d);
        });
    }

    function createSlot(i) {
        let n = prompt("Name:"); if(!n) return;
        appData.slots[i] = { name: n, lv: 1, exp: 0, sync: 0, region: 'RUINS', defeated: [], knowledge: {green:0, blue:0, fight:10} };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); initMenu();
    }

    function loadSlot(i) {
        curSlot = i; const s = appData.slots[i];
        lv = s.lv; exp = s.exp; sync = s.sync; region = s.region; defeated = s.defeated; knowledge = s.knowledge || {green:0, blue:0, fight:10};
        hp = 20 + (lv-1)*4; maxHp = hp;
        document.getElementById('menu').classList.add('hidden');
        updateUI(); spawnNext(); requestAnimationFrame(loop);
    }

    // --- LOOP ---
    window.onkeydown = e => { 
        keys[e.code] = true; 
        if((e.code === 'KeyZ' || e.code === 'Enter') && turn === 'FIGHT_BAR') finalizeHit(); 
    };
    window.onkeyup = e => keys[e.code] = false;

    function loop() {
        if(turn === 'SURVIVAL') runSurvival();
        if(turn === 'FIGHT_BAR') runFightBar();
        frame++; requestAnimationFrame(loop);
    }

    function spawnNext() {
        if(lv === 2 && !defeated.includes("NAPSTABLOOK")) enemy = {...Bosses.NAPSTABLOOK};
        else if(lv === 3 && !defeated.includes("TORIEL")) enemy = {...Bosses.TORIEL};
        else if(lv === 4 && !defeated.includes("DOGGO")) enemy = {...Bosses.DOGGO};
        else if(lv === 5 && !defeated.includes("DOGAMY")) enemy = {...Bosses.DOGAMY};
        else if(lv === 6 && !defeated.includes("GREATER_DOG")) enemy = {...Bosses.GREATER_DOG};
        else enemy = {...Monsters[region][Math.floor(Math.random()*Monsters[region].length)]};

        document.getElementById('sprite-container').innerText = enemy.art;
        logMsg("System", `* ${enemy.n} appears.`, "");
        checkTurnType();
    }

    function checkTurnType() {
        if(Math.random()*100 < sync) {
            turn = 'CHARA';
            document.getElementById('soul').style.background = "#fff";
            document.querySelectorAll('.btn').forEach(b => b.classList.add('chara-active'));
            setTimeout(() => { if(hp < maxHp/2) act('ITEM'); else act('FIGHT'); }, 1000);
        } else {
            turn = 'PLAYER';
            document.getElementById('soul').style.background = "var(--red)";
            document.querySelectorAll('.btn').forEach(b => { b.disabled = false; b.classList.remove('chara-active'); });
        }
    }

    function act(type) {
        if(turn === 'PLAYER' || turn === 'CHARA') {
            if(type === 'FIGHT') startFightUI();
            if(type === 'ITEM') { hp = Math.min(maxHp, hp+15); logMsg(turn==='CHARA'?'Chara':'You', "* Healed.", ""); startDodge(); }
            if(type === 'MERCY') { logMsg("You", "* Spare.", ""); sync = Math.max(0, sync-5); spawnNext(); }
            if(type === 'ACT') { logMsg("You", "* Check.", ""); startDodge(); }
        }
    }

    // --- FIGHT BAR ---
    function startFightUI() {
        turn = 'FIGHT_BAR'; sliderX = 0; sliderStartFrame = frame;
        document.getElementById('fight-ui').style.display = 'flex';
    }

    function runFightBar() {
        sliderX += sliderDir;
        if(sliderX > 370 || sliderX < 0) sliderDir *= -1;
        document.getElementById('slider').style.left = sliderX + 'px';

        if(turn === 'CHARA') {
            let dist = Math.abs(190 - sliderX);
            // Chara hits better as LV/Sync goes up
            if(dist < (20 - knowledge.fight/10) || (frame - sliderStartFrame > 300)) finalizeHit();
        }
    }

    function finalizeHit() {
        const attacker = (turn === 'CHARA') ? 'Chara' : 'You';
        turn = 'ANIMATING';
        document.getElementById('fight-ui').style.display = 'none';
        
        let dist = Math.abs(190 - sliderX);
        let precision = Math.max(0.1, (1 - (dist/190)));
        let baseAtk = 10 + (lv-1)*2;
        let dmg = 1;
        if(precision > 0.8) dmg = Math.floor(Math.max(1, baseAtk - enemy.def) * (precision * 1.5));
        let cap = 10 + (lv-1)*2;
        dmg = Math.min(cap, dmg);

        enemy.hp -= dmg;
        logMsg(attacker, `* Dealt ${dmg} damage.`, attacker === 'Chara' ? 'm-chara' : 'm-player');
        
        const slash = document.createElement('div'); slash.className = 'vfx-slash';
        document.getElementById('sprite-container').appendChild(slash);
        setTimeout(() => {
            slash.remove();
            if(enemy.hp <= 0) handleWin(); else startDodge();
        }, 500);
    }

    function handleWin() {
        if(enemy.boss) {
            defeated.push(enemy.n.toUpperCase());
            if(enemy.n === "Toriel") { region = "SNOWDIN"; lv = 4; }
        }
        exp += enemy.exp; sync = Math.min(100, sync+2); knowledge.fight = Math.min(100, knowledge.fight + 2);
        if(exp >= lv*150) { lv++; logMsg("Chara", "* Level up.", "m-chara"); }
        updateUI(); saveProgress(); spawnNext();
    }

    // --- SURVIVAL ---
    function startDodge() { turn = 'SURVIVAL'; turnTimer = 380; bullets = []; }

    function runSurvival() {
        let isHijacked = (sync >= 100) || (Math.random()*100 < sync);
        const sEl = document.getElementById('soul');
        sEl.style.background = isHijacked ? "#fff" : "var(--red)";

        isSoulMoving = false;
        if(isHijacked) {
            let near = null, d = 70;
            bullets.forEach(b => { let dst = Math.hypot(b.x-soulX, b.y-soulY); if(dst < d){d=dst; near=b;} });
            if(near) {
                if(near.isBlue && knowledge.blue > 50) isSoulMoving = false;
                else if(near.isGreen && knowledge.green > 40) { isSoulMoving = true; soulX += (near.x > soulX ? 2 : -2); soulY += (near.y > soulY ? 2 : -2); }
                else { isSoulMoving = true; soulX += (near.x > soulX ? -3.5 : 3.5); soulY += (near.y > soulY ? -3.5 : 3.5); }
            }
        } else {
            let s = keys['ShiftLeft'] ? 1.5 : 4;
            if(keys['ArrowUp'] || keys['KeyW']) { soulY -= s; isSoulMoving = true; }
            if(keys['ArrowDown'] || keys['KeyS']) { soulY += s; isSoulMoving = true; }
            if(keys['ArrowLeft'] || keys['KeyA']) { soulX -= s; isSoulMoving = true; }
            if(keys['ArrowRight'] || keys['KeyD']) { soulX += s; isSoulMoving = true; }
        }

        soulX = Math.max(0, Math.min(422, soulX)); soulY = Math.max(0, Math.min(242, soulY));
        sEl.style.left = soulX + 'px'; sEl.style.top = soulY + 'px';

        if(frame % 25 === 0) spawnBullet();

        for(let i=bullets.length-1; i>=0; i--) {
            let b = bullets[i]; b.x += b.vx; b.y += b.vy;
            if(b.type === 'SINE') b.y += Math.sin(frame*0.1)*5;
            if(b.type === 'CURVE') { b.vx += (220-b.x)*0.01; b.vy += 0.1; }
            b.el.style.left = b.x + 'px'; b.el.style.top = b.y + 'px';
            
            if(Math.hypot(b.x-soulX, b.y-soulY) < 14) {
                if(b.isBlue && !isSoulMoving) { /* safe */ }
                else if(b.isGreen) { 
                    hp = Math.min(maxHp, hp+2); b.el.remove(); bullets.splice(i,1); 
                    if(!isHijacked) knowledge.green++;
                } else {
                    if(enemy.n === "Toriel" && hp < 10) { b.vx = (b.x > soulX ? 6 : -6); }
                    else { hp -= 1; b.el.remove(); bullets.splice(i,1); }
                }
            } else if(b.y > 280 || b.x > 450 || b.x < -20) { b.el.remove(); bullets.splice(i,1); }
        }

        if(!isHijacked && !isSoulMoving && bullets.some(b => b.isBlue && Math.hypot(b.x-soulX, b.y-soulY) < 30)) knowledge.blue++;

        turnTimer--; if(turnTimer <= 0) { bullets.forEach(b => b.el.remove()); checkTurnType(); }
        updateUI();
    }

    function spawnBullet() {
        const p = enemy.patterns[Math.floor(Math.random()*enemy.patterns.length)];
        let x = Math.random()*440, y = -10, vx = 0, vy = 4, type = 'STILL', isG = false, isB = false;

        if(p === 'FROG_CURVE') type = 'CURVE';
        if(p === 'SINE_WAVE') { x = -10; y = 50+Math.random()*150; vx = 4; vy = 0; type = 'SINE'; }
        if(p === 'VEGGIE_FALL') isG = Math.random() < 0.2;
        if(p === 'BLUE_SLASH') { x = -10; y = soulY; vx = 6; vy = 0; isB = true; }
        if(p === 'WAVY_TEARS') { type = 'SINE'; vy = 3; }

        const b = { x, y, vx, vy, type, isGreen: isG, isBlue: isB, el: document.createElement('div') };
        b.el.className = 'bullet'; b.el.style.width = '16px'; b.el.style.height = '16px';
        b.el.style.background = isG ? "var(--green)" : (isB ? "var(--blue)" : "#fff");
        document.getElementById('box').appendChild(b.el); bullets.push(b);
    }

    // --- UTILS ---
    function updateUI() {
        maxHp = 20 + (lv-1)*4;
        document.getElementById('lv-ui').innerText = `LV ${lv}`;
        document.getElementById('hp-ui').innerText = `${Math.ceil(hp)}/${maxHp}`;
        document.getElementById('hp-fill').style.width = (hp/maxHp)*100+"%";
        document.getElementById('sync-ui').innerText = Math.floor(sync);
        document.getElementById('region-ui').innerText = region;
        document.getElementById('exp-val').innerText = exp;
    }

    function saveProgress() {
        if(curSlot !== null) {
            appData.slots[curIdx] = { name: appData.slots[curIdx].name, lv, exp, sync, region, defeated, knowledge };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        }
    }

    async function talk(txt) {
        if(!appData.apiKey) return;
        const p = `You are Chara. LV ${lv}, Region ${region}. JSON: {"reply": "...", "controlMod": number}`;
        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${appData.apiKey}`, {
                method: 'POST', body: JSON.stringify({ contents: [{role: "user", parts: [{text: txt}]}], generationConfig: {responseMimeType: "application/json"} })
            });
            const d = await r.json(); const res = JSON.parse(d.candidates[0].content.parts[0].text);
            logMsg("Chara", res.reply, "m-chara"); sync = Math.min(100, Math.max(0, sync + res.controlMod)); updateUI();
        } catch(e) {}
    }

    document.getElementById('input').onkeypress = e => { if(e.key === 'Enter'){ logMsg("You", e.target.value, "m-player"); talk(e.target.value); e.target.value = ''; }};
    function logMsg(s, t, c) { const l = document.getElementById('log'); const d = document.createElement('div'); d.className = c; d.innerText = t; l.appendChild(d); l.scrollTop = l.scrollHeight; }
</script>
</body>
</html>
