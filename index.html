<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Undertale: The Chara Protocol v2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body { background: #000; color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'VT323', monospace; overflow: hidden; }
        #game-container { display: flex; width: 1000px; height: 650px; border: 4px solid #444; background: #000; position: relative; }
        
        /* Menu System */
        #menu-overlay { position: absolute; inset: 0; background: #000; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .save-slot { width: 400px; padding: 20px; border: 3px solid #fff; margin: 10px; cursor: pointer; transition: 0.2s; position: relative; }
        .save-slot:hover { border-color: #ff0000; background: #110000; }
        .save-slot.empty { border-style: dashed; color: #666; }
        .delete-btn { position: absolute; right: 10px; top: 10px; color: #ff0000; border: 1px solid #ff0000; padding: 2px 5px; cursor: pointer; }

        /* Battle UI */
        #battle-side { width: 550px; border-right: 4px solid #333; display: flex; flex-direction: column; align-items: center; padding: 20px; position: relative; }
        #battle-box { width: 320px; height: 280px; border: 4px solid #fff; position: relative; overflow: hidden; background: #000; margin-top: 20px; }
        #soul { width: 16px; height: 16px; position: absolute; background: #ff0000; z-index: 5; clip-path: path('M8 2.1C8 2.1 7.4 0 4.2 0 1.2 0 0 2.4 0 4.4 0 8.4 8 13.5 8 13.5S16 8.4 16 4.4C16 2.4 14.8 0 11.8 0 8.6 0 8 2.1 8 2.1Z'); }
        .bullet { position: absolute; background: #fff; border-radius: 50%; box-shadow: 0 0 5px #fff; }

        /* Stats bar */
        #stat-line { width: 100%; display: flex; justify-content: space-around; font-size: 28px; margin-bottom: 10px; color: #fff; }
        #hp-bar-bg { width: 100px; height: 20px; background: #f00; display: inline-block; position: relative; vertical-align: middle; }
        #hp-bar-fill { height: 100%; background: #ff0; width: 100%; }

        /* Control Meter */
        #control-panel { width: 80%; text-align: center; margin-top: 10px; }
        #control-bar-bg { width: 100%; height: 15px; background: #222; border: 1px solid #555; }
        #control-bar-fill { height: 100%; background: #f00; transition: width 0.3s; box-shadow: 0 0 15px #f00; }

        /* Chat Side */
        #chat-side { width: 450px; display: flex; flex-direction: column; background: #050505; }
        #chat-log { flex-grow: 1; padding: 20px; overflow-y: auto; font-size: 24px; display: flex; flex-direction: column; gap: 15px; }
        .msg-chara { color: #ff0000; border-left: 3px solid #ff0000; padding-left: 10px; animation: jitter 0.1s infinite alternate; }
        @keyframes jitter { 0% { transform: translate(0,0); } 100% { transform: translate(1px, 0.5px); } }
        
        #input-area { border-top: 2px solid #333; padding: 10px; background: #000; }
        #chat-input { width: 100%; background: transparent; border: none; color: #fff; font-family: inherit; font-size: 24px; outline: none; }
        
        .game-btn { background: #000; border: 2px solid #ffaa00; color: #ffaa00; font-family: inherit; font-size: 24px; cursor: pointer; padding: 10px 20px; margin: 10px; }
        .game-btn:hover { background: #ffaa00; color: #000; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="menu-overlay">
        <h1 style="color: #ff0000; font-size: 50px;">CHOOSE A TIMELINE</h1>
        <div id="slots-container"></div>
        <button class="game-btn" onclick="promptApiKey()">SET API KEY</button>
    </div>

    <div id="battle-side">
        <div id="stat-line">
            <span>LV 19</span>
            <span>HP <div id="hp-bar-bg"><div id="hp-bar-fill"></div></div> <span id="hp-txt">20/20</span></span>
        </div>
        
        <div id="control-panel">
            <div style="color: #f00;">CONTROL: <span id="ctrl-val">0</span>%</div>
            <div id="control-bar-bg"><div id="control-bar-fill"></div></div>
        </div>

        <div id="battle-box">
            <div id="soul"></div>
        </div>

        <div style="display: flex; gap: 20px; margin-top: 20px;">
            <button class="game-btn" id="btn-fight" onclick="playerAct('FIGHT')">FIGHT</button>
            <button class="game-btn" id="btn-mercy" onclick="playerAct('MERCY')">MERCY</button>
        </div>
    </div>

    <div id="chat-side">
        <div id="chat-log"></div>
        <div id="input-area">
            <input type="text" id="chat-input" placeholder="Is there someone there?" autocomplete="off">
        </div>
    </div>
</div>

<script>
    // --- PERSISTENCE ---
    let saves = JSON.parse(localStorage.getItem('chara_saves')) || [null, null, null];
    let currentSlot = null;
    let apiKey = localStorage.getItem('chara_api_key');

    // --- GAME STATE ---
    let hp = 20;
    let control = 0;
    let frame = 0;
    let bullets = [];
    const soulPos = { x: 152, y: 132 };
    const keys = {};
    let currentPattern = 'RAIN';
    let isAiTyping = false;

    function initMenu() {
        const container = document.getElementById('slots-container');
        container.innerHTML = '';
        saves.forEach((slot, i) => {
            const div = document.createElement('div');
            div.className = `save-slot ${slot ? '' : 'empty'}`;
            div.innerHTML = slot ? 
                `NAME: ${slot.name} <br> CONTROL: ${Math.floor(slot.control)}% <br> HP: ${slot.hp}/20
                <span class="delete-btn" onclick="event.stopPropagation(); deleteSave(${i})">DELETE</span>` : 
                `-- EMPTY SLOT --`;
            div.onclick = () => slot ? loadSave(i) : createSave(i);
            container.appendChild(div);
        });
    }

    function promptApiKey() {
        let key = prompt("Enter Gemini API Key (starts with AIza):");
        if(key) { localStorage.setItem('chara_api_key', key); apiKey = key; }
    }

    function createSave(i) {
        let name = prompt("Name the fallen human:");
        if(!name) return;
        saves[i] = { name: name, control: 0, hp: 20 };
        saveAll();
        initMenu();
    }

    function deleteSave(i) {
        if(confirm("Erase this timeline?")) {
            saves[i] = null;
            saveAll();
            initMenu();
        }
    }

    function saveAll() { localStorage.setItem('chara_saves', JSON.stringify(saves)); }

    function loadSave(i) {
        currentSlot = i;
        hp = saves[i].hp;
        control = saves[i].control;
        document.getElementById('menu-overlay').classList.add('hidden');
        updateUI();
        logMsg("Chara", `Greetings. I am ${saves[i].name}.`, "msg-chara");
        requestAnimationFrame(gameLoop);
    }

    // --- BATTLE ENGINE ---
    window.onkeydown = (e) => keys[e.code] = true;
    window.onkeyup = (e) => keys[e.code] = false;

    function gameLoop() {
        frame++;
        updateSoul();
        handleAttacks();
        updateBullets();
        if(frame % 300 === 0) switchPattern();
        requestAnimationFrame(gameLoop);
    }

    function updateSoul() {
        if (control >= 100) {
            // CHARA AUTO-PILOT (Dodges bullets perfectly)
            let nearest = null;
            let minDist = 100;
            bullets.forEach(b => {
                let d = Math.hypot(b.x - soulPos.x, b.y - soulPos.y);
                if(d < minDist) { minDist = d; nearest = b; }
            });
            if(nearest) {
                if(nearest.x > soulPos.x) soulPos.x -= 2; else soulPos.x += 2;
                if(nearest.y > soulPos.y) soulPos.y -= 2; else soulPos.y += 2;
            }
        } else {
            // PLAYER CONTROL
            let spd = 3;
            if(keys['ArrowUp'] || keys['KeyW']) soulPos.y -= spd;
            if(keys['ArrowDown'] || keys['KeyS']) soulPos.y += spd;
            if(keys['ArrowLeft'] || keys['KeyA']) soulPos.x -= spd;
            if(keys['ArrowRight'] || keys['KeyD']) soulPos.x += spd;
        }

        soulPos.x = Math.max(0, Math.min(304, soulPos.x));
        soulPos.y = Math.max(0, Math.min(264, soulPos.y));
        soul.style.left = soulPos.x + 'px';
        soul.style.top = soulPos.y + 'px';
    }

    function handleAttacks() {
        if (frame % 30 !== 0) return;
        
        if (currentPattern === 'RAIN') {
            spawnBullet(Math.random()*320, -10, 0, 3);
        } else if (currentPattern === 'SPIRAL') {
            let ang = frame * 0.1;
            spawnBullet(160 + Math.cos(ang)*150, 140 + Math.sin(ang)*150, -Math.cos(ang)*2, -Math.sin(ang)*2);
        } else if (currentPattern === 'CROSS') {
            spawnBullet(-10, soulPos.y, 4, 0);
            spawnBullet(soulPos.x, -10, 0, 4);
        } else if (currentPattern === 'HOMING') {
            let dx = soulPos.x - 160, dy = soulPos.y - 140;
            let mag = Math.hypot(dx, dy);
            spawnBullet(160, 140, (dx/mag)*3, (dy/mag)*3);
        }
    }

    function spawnBullet(x, y, vx, vy) {
        let b = { x, y, vx, vy, r: 6, el: document.createElement('div') };
        b.el.className = 'bullet';
        b.el.style.width = '12px'; b.el.style.height = '12px';
        document.getElementById('battle-box').appendChild(b.el);
        bullets.push(b);
    }

    function updateBullets() {
        for(let i=bullets.length-1; i>=0; i--) {
            let b = bullets[i];
            b.x += b.vx; b.y += b.vy;
            b.el.style.left = b.x + 'px'; b.el.style.top = b.y + 'px';

            // Hit detection
            if(Math.hypot(b.x - soulPos.x, b.y - soulPos.y) < 14) {
                takeDamage();
                b.el.remove();
                bullets.splice(i, 1);
                continue;
            }

            if(b.x < -20 || b.x > 340 || b.y < -20 || b.y > 300) {
                b.el.remove();
                bullets.splice(i, 1);
            }
        }
    }

    function switchPattern() {
        const p = ['RAIN', 'SPIRAL', 'CROSS', 'HOMING'];
        currentPattern = p[Math.floor(Math.random() * p.length)];
    }

    function takeDamage() {
        hp -= 1;
        shiftControl(0.5);
        updateUI();
        if(hp <= 0) {
            alert("ERased.");
            location.reload();
        }
    }

    function updateUI() {
        document.getElementById('hp-bar-fill').style.width = (hp/20)*100 + "%";
        document.getElementById('hp-txt').innerText = `${hp}/20`;
        document.getElementById('ctrl-val').innerText = Math.floor(control);
        document.getElementById('control-bar-fill').style.width = control + "%";
        
        if(control >= 100) {
            document.getElementById('btn-fight').disabled = true;
            document.getElementById('btn-mercy').disabled = true;
            soul.style.background = "#fff"; // Possession look
        }
        
        // Save current progress
        if(currentSlot !== null) {
            saves[currentSlot].hp = hp;
            saves[currentSlot].control = control;
            saveAll();
        }
    }

    function shiftControl(amt) {
        control = Math.max(0, Math.min(100, control + amt));
        updateUI();
    }

    // --- NARRATIVE ---
    async function playerAct(type) {
        let msg = type === 'FIGHT' ? "* You swung your weapon." : "* You begged for mercy.";
        logMsg("You", msg, "msg-player");
        shiftControl(type === 'FIGHT' ? 8 : -3);
        sendCharaAI(`[SYSTEM: Player chose ${type}. Control is ${control}%]`);
    }

    async function sendCharaAI(promptText) {
        if(!apiKey || isAiTyping) return;
        isAiTyping = true;
        const system = `You are Chara from Undertale. You are the absolute manifestation of the player's hunger for power.
        You are cynical, cold, but speak with a soft, formal tone. 
        At high control (>80%), you start taking over the user's interface. At 100%, you OWN them.
        Respond ONLY in JSON: {"reply": "...", "controlMod": number(-5 to 10)}`;

        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    contents: [{role: "user", parts: [{text: promptText}]}],
                    systemInstruction: {parts: [{text: system}]},
                    generationConfig: { responseMimeType: "application/json" }
                })
            });
            const d = await r.json();
            const res = JSON.parse(d.candidates[0].content.parts[0].text);
            logMsg("Chara", res.reply, "msg-chara");
            shiftControl(res.controlMod || 0);
        } catch(e) { console.error(e); }
        finally { isAiTyping = false; }
    }

    document.getElementById('chat-input').onkeypress = (e) => {
        if(e.key === 'Enter') {
            let val = e.target.value;
            logMsg("You", val, "msg-player");
            e.target.value = '';
            sendCharaAI(val);
        }
    }

    function logMsg(sender, text, cls) {
        const log = document.getElementById('chat-log');
        const div = document.createElement('div');
        div.className = cls;
        div.innerText = text;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
    }

    initMenu();
</script>
</body>
</html>
