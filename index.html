<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Bunker Defense Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; color: white;}
        canvas { display: block; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* Let clicks pass through to 3D canvas unless on a button */
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px; background-color: white; border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        #stats {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 0, 0, 0.7); padding: 15px; border: 1px solid #0f0;
        }

        #computer-screen {
            display: none; background: rgba(0, 20, 0, 0.9); border: 2px solid #0f0;
            padding: 30px; border-radius: 10px; text-align: center; pointer-events: auto;
        }

        button {
            background-color: #000; color: #0f0; border: 1px solid #0f0;
            padding: 10px 20px; margin: 10px; cursor: pointer; font-family: inherit; font-size: 16px;
        }
        button:hover { background-color: #0f0; color: #000; }

        #warning {
            position: absolute; top: 20px; right: 20px; color: red; font-size: 24px; font-weight: bold; display: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="ui-layer">
    <div id="crosshair"></div>
    <div id="stats">
        <h3>Survival Stats</h3>
        <div>Money: $<span id="money">1000000</span></div>
        <div>Base Health: <span id="health">100</span>%</div>
    </div>
    
    <div id="warning">⚠️ ZOMBIE APPROACHING ⚠️</div>

    <div id="computer-screen">
        <h2>TERMINAL ACCESS</h2>
        <p>Purchase Upgrades to survive the horde.</p>
        <button onclick="buyUpgrade('door')">Reinforce Doors ($50,000)</button>
        <button onclick="buyUpgrade('turret')">Buy Auto-Turret ($150,000)</button><br>
        <button onclick="closeComputer()" style="border-color: red; color: red;">Close Terminal</button>
    </div>
</div>

<script>
    // Game State
    let money = 1000000;
    let baseHealth = 100;
    let isComputerOpen = false;

    // Three.js Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);
    scene.fog = new THREE.Fog(0x111111, 10, 50);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.y = 1.6; // Player eye level

    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0x404040); // Soft white light
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0xffaa00, 1, 20);
    pointLight.position.set(0, 4, 0);
    scene.add(pointLight);

    // Environment (The Bunker)
    const floorGeo = new THREE.PlaneGeometry(50, 50);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // The Computer (Blue Cube)
    const compGeo = new THREE.BoxGeometry(1, 1, 1);
    const compMat = new THREE.MeshStandardMaterial({ color: 0x0088ff, emissive: 0x002255 });
    const computer = new THREE.Mesh(compGeo, compMat);
    computer.position.set(3, 1, -3);
    computer.userData = { isComputer: true }; // Tag for raycasting
    scene.add(computer);

    // The Zombie (Red Cube)
    const zombieGeo = new THREE.BoxGeometry(1, 2, 1);
    const zombieMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
    const zombie = new THREE.Mesh(zombieGeo, zombieMat);
    zombie.position.set(-10, 1, -20);
    scene.add(zombie);

    // Raycaster for clicking
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    // Controls state
    const keys = { w: false, a: false, s: false, d: false };
    const speed = 0.1;

    // Event Listeners
    document.addEventListener('keydown', (e) => {
        if (!isComputerOpen) keys[e.key.toLowerCase()] = true;
    });
    document.addEventListener('keyup', (e) => {
        keys[e.key.toLowerCase()] = false;
    });

    // Handle Clicking the Computer
    window.addEventListener('click', (event) => {
        if (isComputerOpen) return;

        // Calculate mouse position in normalized device coordinates (-1 to +1)
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(scene.children);

        for (let i = 0; i < intersects.length; i++) {
            if (intersects[i].object.userData.isComputer && intersects[i].distance < 5) {
                openComputer();
                break;
            }
        }
    });

    // Window resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // UI Logic
    function openComputer() {
        isComputerOpen = true;
        document.getElementById('computer-screen').style.display = 'block';
        document.getElementById('crosshair').style.display = 'none';
        keys.w = keys.a = keys.s = keys.d = false; // stop moving
    }

    function closeComputer() {
        isComputerOpen = false;
        document.getElementById('computer-screen').style.display = 'none';
        document.getElementById('crosshair').style.display = 'block';
    }

    function buyUpgrade(type) {
        if (type === 'door' && money >= 50000) {
            money -= 50000;
            baseHealth += 50;
        } else if (type === 'turret' && money >= 150000) {
            money -= 150000;
            // Visually change the zombie to "dead" (gray) for prototype purposes
            zombie.material.color.setHex(0x555555);
            zombie.position.y = 0.5; // knock it down
            zombie.rotation.x = Math.PI / 2;
        }
        document.getElementById('money').innerText = money.toLocaleString();
        document.getElementById('health').innerText = baseHealth;
    }

    // Animation / Game Loop
    function animate() {
        requestAnimationFrame(animate);

        if (!isComputerOpen) {
            // Movement Logic
            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);
            direction.y = 0; // Keep movement on flat plane
            direction.normalize();

            const right = new THREE.Vector3();
            right.crossVectors(camera.up, direction).normalize();

            if (keys.w) camera.position.addScaledVector(direction, speed);
            if (keys.s) camera.position.addScaledVector(direction, -speed);
            if (keys.a) camera.position.addScaledVector(right, speed);
            if (keys.d) camera.position.addScaledVector(right, -speed);
            
            // Basic Mouse Look (simplified for prototype)
            // In a real game, you'd use PointerLockControls here.
        }

        // Zombie Logic (moves toward player)
        if (zombie.position.y > 0.6) { // if not dead
            const distance = zombie.position.distanceTo(camera.position);
            if (distance < 25) {
                document.getElementById('warning').style.display = 'block';
                // Very basic follow logic
                zombie.lookAt(camera.position);
                zombie.translateZ(0.02); // Move forward
                
                if (distance < 2) {
                    baseHealth -= 0.1; // Damage base
                    document.getElementById('health').innerText = Math.floor(baseHealth);
                    if (baseHealth <= 0) alert("ZOMBIES BROKE IN. YOU DIED.");
                }
            } else {
                document.getElementById('warning').style.display = 'none';
            }
        }

        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>
